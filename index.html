   "<b>Se puede hacer sin framework.</b> Con la API del modelo y una base vectorial son unas cien líneas. Conviene entenderlo sin framework primero para saber qué está pasando.",
   "<b>El prompt del sistema es donde se gana o se pierde:</b> 'respondé usando únicamente el contexto provisto; si la respuesta no está ahí, decí que no lo sabés y sugerí dónde buscar; citá siempre el archivo y la sección'.",
   "<b>Las citas no son decoración:</b> son lo que permite verificar. Un bot que responde sin citar es un bot en el que no se puede confiar para documentación técnica.",
   "<b>Decir 'no sé' es una función, no una falla.</b> Un bot de documentación que inventa es peor que no tener bot, porque genera confianza en algo falso.",
   "<b>Evaluación mínima:</b> 20 preguntas con respuesta conocida, más 5 cuya respuesta no está en la documentación. Se mide cuántas acierta, cuántas cita bien y cuántas veces inventa en vez de decir que no sabe.",
   "<b>Reordenamiento (re-ranking):</b> traer 20 trozos y que un modelo chico elija los 5 más relevantes antes de responder. Mejora bastante con poco costo."],
  ej:[["Prompt de sistema efectivo","'Sos un asistente de documentación técnica. Respondé sólo con el contexto. Citá archivo y sección de cada afirmación. Si no está en el contexto, decí exactamente: no encuentro eso en la documentación.'"],
   ["Evaluación que revela el problema","De 20 preguntas acierta 17, pero de las 5 sin respuesta inventa 3. El arreglo está en el prompt y en el umbral de distancia, no en el modelo."],
   ["Sin framework","Cliente de la API para el embedding, consulta por distancia a la base, y una llamada al modelo con el contexto armado. Cien líneas y entendés cada una."]],
  steps:["Armá el pipeline completo, con framework o sin él.","Escribí el prompt de sistema con la política de citas y de no saber.","Armá el conjunto de evaluación de 25 preguntas y medí.","Probá reordenamiento y compará."],
  links:[["LangChain","https://python.langchain.com/"]],
  done:"El bot responde con citas verificables y dice que no sabe cuando la respuesta no está."},
 {t:"L1.3 Interfaces con Streamlit",s:"Prototipo en una tarde; producción sólo si va a un cliente.",
  detail:"La interfaz de un asistente de documentación es simple a propósito: pregunta, respuesta, fuentes. Lo que importa es que alguien lo use y te diga qué le falta.",
  clase:["<b>Streamlit</b> convierte un script de Python en una aplicación web sin escribir frontend. Para un prototipo interno o una demo, es imbatible en tiempo.",
   "<b>Los tres elementos imprescindibles:</b> la caja de pregunta, la respuesta transmitida token a token (la espera se siente muchísimo menos), y las fuentes citadas con link al documento.",
   "<b>Historial de conversación</b> para poder repreguntar. Requiere reescribir la consulta con el contexto de la charla: 'y eso cómo se configura' necesita saber a qué se refiere 'eso'.",
   "<b>Botón de retroalimentación</b> (pulgar arriba o abajo) en cada respuesta. Es la fuente de datos más valiosa para mejorar, y cuesta cinco líneas.",
   "<b>Cuándo pasar a producción:</b> si lo usa un cliente o va en tu producto, se reescribe la interfaz en tu stack real y el pipeline queda como servicio.",
   "<b>Ponerlo en manos de alguien es el verdadero test.</b> Las primeras diez preguntas de un usuario real revelan más que cien de tu conjunto de evaluación."],
  ej:[["Prototipo interno","Un asistente sobre la documentación del equipo, desplegado en la nube de Streamlit, con acceso restringido. Una tarde de trabajo."],
   ["Producto","La misma lógica expuesta como endpoint y consumida desde el frontend real, con autenticación y control de uso."],
   ["Retroalimentación que sirve","Las respuestas con pulgar abajo se revisan una vez por semana: la mitad son problemas de partición en trozos, no del modelo."]],
  steps:["Levantá la interfaz mínima con los tres elementos.","Agregá historial con reescritura de consulta y botón de retroalimentación.","Deployalo y hacé que tres personas lo usen.","Anotá las diez primeras preguntas reales y qué salió mal."],
  links:[["Streamlit","https://streamlit.io/"]],
  done:"Hay una URL donde alguien más puede preguntarle a tu documentación, con fuentes y retroalimentación."},
 {t:"L1.4 Consultas complejas, interfaces de voz y de visión",s:"Preguntas que cruzan documentos, y entrada multimodal.",
  detail:"La segunda parte del lab sube el nivel: preguntas que no se responden con un solo trozo, y entradas que no son texto.",
  clase:["<b>Preguntas compuestas</b> ('comparame la configuración de staging y la de producción') necesitan descomposición: partir la pregunta en subpreguntas, recuperar para cada una, y sintetizar.",
   "<b>Recuperación iterativa:</b> el modelo busca, ve que le falta información, y busca de nuevo con una consulta mejor. Más lento y más caro, mucho mejor en preguntas difíciles.",
   "<b>Voz de entrada</b> con un modelo de transcripción. Cambia el uso: se vuelve práctico para consultar mientras tenés las manos ocupadas.",
   "<b>Voz de salida</b> con síntesis, cuando el caso lo pide (accesibilidad, manos ocupadas). No siempre suma: leer suele ser más rápido.",
   "<b>Visión:</b> subir una captura de un error o un diagrama y preguntar sobre eso. Los modelos multimodales leen texto de imágenes bastante bien, y es un caso de uso muy natural en soporte técnico.",
   "<b>Cuidado con el costo:</b> imágenes y audio consumen bastante más que texto. Conviene medir por consulta antes de abrirlo a muchos usuarios."],
  ej:[["Pregunta compuesta descompuesta","'¿Qué cambió entre la versión 2 y la 3 en autenticación?' se parte en: configuración de auth en v2, configuración en v3, y una síntesis comparativa."],
   ["Visión en soporte","El usuario sube la captura del error, el modelo lee el mensaje y el stack, busca en la documentación y responde con la solución y la cita."],
   ["Voz práctica","Un técnico en campo pregunta por voz mientras trabaja y escucha la respuesta. Ahí la voz sí suma."]],
  steps:["Implementá descomposición para preguntas compuestas y compará con la versión simple.","Agregá entrada por voz con transcripción.","Permití subir una imagen y preguntar sobre ella.","Medí el costo por consulta de cada modalidad."],
  done:"El bot responde una pregunta compuesta, una por voz y una sobre una imagen, y sabés cuánto cuesta cada una."},
]},
{n:"Lab 2",h:"6 h",icon:"agents",t:"Tu propio entorno de multi-agentes",s:"Orquestación, MCP propio, y observabilidad de agentes.",temas:[
 {t:"L2.1 Frameworks de orquestación: LangGraph, PydanticAI, Autogen y el Agent SDK",s:"Cuatro formas de coordinar agentes, y cuándo cada una.",
  detail:"Un sistema multi-agente no es varios chats: es un flujo con estado, control de errores y criterios de terminación. Los frameworks se diferencian en cuánto control te dan sobre eso.",
  clase:["<b>LangGraph:</b> modela el flujo como un grafo de nodos con estado compartido. Permite ciclos, ramificaciones y puntos de control. Es el más adecuado cuando el flujo tiene lógica de verdad y necesitás poder retomar.",
   "<b>PydanticAI:</b> agentes tipados, con la salida validada contra un esquema. Menos flexible en el flujo, mucho más seguro en los datos. Ideal cuando la salida alimenta un sistema.",
   "<b>Autogen:</b> agentes que conversan entre sí para llegar a un resultado. Muy expresivo, más difícil de acotar en costo y en tiempo.",
   "<b>Agent SDK del proveedor:</b> el camino más directo cuando ya estás en ese ecosistema, con las herramientas y el manejo de contexto resueltos.",
   "<b>Los patrones de orquestación que importan.</b> Cadena: cada agente toma la salida del anterior. Distribución y síntesis: varios en paralelo sobre partes distintas y uno que unifica. Verificación adversarial: uno produce y otro intenta refutar. Torneo: varias propuestas y una elección. Bucle hasta terminar: repetir hasta que se cumple un criterio.",
   "<b>Lo que siempre hay que definir:</b> criterio de terminación, tope de iteraciones y presupuesto de tokens. Un sistema multi-agente sin topes es una factura sorpresa.",
   "<b>Cuándo NO usar multi-agente:</b> si la tarea entra en un contexto y no tiene partes independientes, un solo agente es más barato, más rápido y más fácil de depurar."],
  ej:[["Distribución y síntesis","Tres agentes revisan el mismo PR por dimensiones distintas y un cuarto unifica. Es el patrón más útil y el más fácil de implementar."],
   ["Verificación adversarial","Un agente escribe la migración, otro intenta encontrar el caso donde pierde datos. El segundo tiene el prompt de refutar, no de aprobar."],
   ["Bucle con criterio","'Mejorá el rendimiento de esta página hasta que la métrica supere el umbral, máximo cinco intentos.' Criterio objetivo y tope explícito."],
   ["Cuándo sobra","Renombrar una variable en 30 archivos no necesita orquestación: necesita un agente y un comando."]],
  steps:["Implementá el mismo flujo de tres agentes (investigar, redactar, revisar) en dos frameworks distintos.","Compará control del flujo, trazabilidad y costo.","Definí para cada uno criterio de terminación, tope de iteraciones y presupuesto."],
  links:[["Claude Agent SDK","https://platform.claude.com/docs/en/agent-sdk/overview"],["LangGraph","https://langchain-ai.github.io/langgraph/"],["PydanticAI","https://ai.pydantic.dev/"]],
  done:"Tenés un flujo multi-agente corriendo con topes definidos y sabés cuándo usar cada framework."},
 {t:"L2.2 MCP: exponer tus herramientas a cualquier agente",s:"Escribir un servidor propio es más fácil de lo que parece.",
  detail:"MCP es el protocolo que estandariza cómo un agente descubre y usa herramientas. Escribir uno propio convierte las funciones de tu negocio en capacidades que cualquier agente compatible puede usar.",
  clase:["<b>Qué expone un servidor MCP:</b> herramientas (funciones que el agente puede ejecutar), recursos (datos que puede leer) y prompts (plantillas reutilizables).",
   "<b>Cada herramienta se declara con nombre, descripción y esquema de parámetros.</b> La descripción es lo que el modelo lee para decidir si usarla, así que se escribe pensando en eso, no como documentación interna.",
   "<b>Diseño del espacio de acciones.</b> Pocas herramientas bien definidas funcionan mejor que muchas parecidas. Si el modelo duda entre dos, están mal separadas.",
   "<b>Los errores se devuelven como texto útil,</b> no como excepciones crudas: el agente puede corregir y reintentar si le decís qué estuvo mal.",
   "<b>Permisos y confirmación:</b> las herramientas que escriben o gastan dinero deberían requerir aprobación explícita, y el servidor no debería exponer nada que no quieras que se llame automáticamente.",
   "<b>Casos donde rinde de verdad:</b> operaciones internas del negocio (consultar stock, crear una reserva, emitir una factura), acceso controlado a sistemas propios, y automatizaciones que hoy son scripts sueltos."],
  ej:[["Herramienta bien descrita","'crear_reserva: crea una reserva para un cliente en una fecha y horario. Úsala sólo cuando el usuario confirmó fecha, hora y cantidad de personas. Devuelve el identificador y el estado.'"],
   ["Error útil","En vez de lanzar una excepción: 'La fecha solicitada está completa. Horarios disponibles ese día: 14:00, 16:30.' El agente puede seguir la conversación."],
   ["De script a MCP","Tres scripts que el equipo corría a mano se convierten en tres herramientas MCP. Ahora cualquiera las usa hablando, con permisos y registro."]],
  steps:["Escribí un servidor MCP con dos herramientas reales de un proyecto tuyo.","Prestá especial atención a las descripciones y a los mensajes de error.","Conectalo a tu agente y usalo en una tarea real.","Documentalo para el equipo."],
  links:[["Especificación MCP","https://modelcontextprotocol.io/"]],
  done:"Tu agente ejecuta una operación real de tu negocio a través de un servidor MCP que escribiste vos."},
 {t:"L2.3 Monitorización de agentes: LangSmith y Logfire",s:"Sin trazas, un sistema multi-agente es una caja negra cara.",
  detail:"Depurar un flujo de agentes sin observabilidad es imposible: no ves qué prompt recibió cada uno, qué devolvió, ni dónde se fue el presupuesto.",
  clase:["<b>Qué se traza:</b> cada llamada al modelo con su prompt y su respuesta, cada uso de herramienta con parámetros y resultado, tokens y costo por paso, latencia, y errores con su reintento.",
   "<b>La traza como árbol:</b> el flujo completo con sus ramas, para ver qué agente llamó a cuál y en qué orden. Es lo que convierte 'algo salió mal' en 'el agente 2 recibió un contexto vacío'.",
   "<b>Las tres preguntas que responde una traza:</b> ¿dónde se fue el tiempo? ¿dónde se fue el dinero? ¿en qué paso se degradó la calidad?",
   "<b>Evaluación continua:</b> un conjunto de casos con resultado esperado que se corre en cada cambio de prompt. Sin eso, mejorar un prompt es tan probable como empeorarlo.",
   "<b>Presupuesto por corrida</b> declarado y monitoreado. Un flujo que normalmente cuesta unos centavos y de golpe cuesta dólares tiene un bucle.",
   "<b>Registro de decisiones del agente</b> para poder auditar después: qué herramienta eligió y por qué. En productos regulados esto no es opcional.",
   "<b>Lo mismo aplica a los agentes de desarrollo:</b> mirar el consumo por ticket es la métrica de costo del módulo 3.5."],
  ej:[["Traza que revela el bucle","El agente revisor rechazaba siempre y el redactor reescribía sin fin. La traza mostró 14 iteraciones antes del tope. Faltaba un criterio de aceptación concreto."],
   ["Costo desbalanceado","El 80 por ciento del gasto estaba en un paso de resumen que corría sobre el documento entero en cada iteración. Se cacheó y bajó a la quinta parte."],
   ["Evaluación continua","Un cambio de prompt que parecía mejor bajó la precisión del 91 al 84 por ciento en el conjunto de evaluación. Sin medir, se hubiera desplegado."]],
  steps:["Conectá una herramienta de trazas al flujo del lab.","Encontrá el paso más lento y el más caro, y optimizá uno.","Armá un conjunto de evaluación y corré cada cambio de prompt contra él.","Definí y monitoreá el presupuesto por corrida."],
  links:[["LangSmith","https://smith.langchain.com/"],["Logfire","https://logfire.pydantic.dev/"]],
  done:"Podés ver la traza completa de una corrida, sabés su costo y medís cada cambio de prompt contra un conjunto de evaluación."},
]},
{n:"13",h:"3 h",icon:"spark",t:"El futuro del rol del ingeniero de software",s:"Riesgos, adopción en el equipo, habilidades clave y cierre.",temas:[
 {t:"13.1 El desarrollador aumentado por IA: beneficios y riesgos",s:"Más producción, más responsabilidad, y una atrofia que hay que prevenir.",
  detail:"El cierre del máster vuelve al principio con otra mirada. La pregunta ya no es cómo usar la herramienta, sino en qué te convierte usarla todos los días.",
  clase:["<b>Los beneficios reales, medidos:</b> menos tiempo en lo repetitivo, menor barrera para entrar a tecnologías nuevas, mejor documentación (porque ahora se escribe), y más tiempo para el diseño y el producto.",
   "<b>Riesgo 1, atrofia del criterio.</b> Si nunca depurás a mano, perdés la intuición que te dice dónde está el problema. La contramedida es deliberada: elegí algo que seguís haciendo vos, a propósito.",
   "<b>Riesgo 2, deuda invisible.</b> Código que funciona, que pasa los tests, y que nadie entiende. Se detecta con una pregunta simple en el review: ¿podrías explicar este cambio sin leerlo de nuevo?",
   "<b>Riesgo 3, dependencia del proveedor.</b> Si tu flujo entero depende de una herramienta, un cambio de precio o de política te afecta. La mitigación es que el método sea portable, aunque la herramienta no lo sea: specs, tests y documentación funcionan con cualquier modelo.",
   "<b>Riesgo 4, uniformidad.</b> Todos los productos empiezan a parecerse porque todos preguntan a modelos entrenados con lo mismo. La diferenciación vuelve a estar en el criterio de producto y en el diseño.",
   "<b>La responsabilidad no se delega.</b> Firmás vos lo que sale a producción, lo haya escrito quien lo haya escrito."],
  ej:[["Anti-atrofia concreta","Un equipo decidió que los bugs de producción se depuran primero a mano durante 15 minutos, antes de pedirle ayuda a la IA. Mantiene el músculo y muchas veces se resuelve antes."],
   ["Deuda invisible detectada","En el review, la pregunta '¿por qué esta función recibe el cliente completo si sólo usa el identificador?' reveló que nadie había leído el cambio, sólo visto que los tests pasaban."],
   ["Método portable","Las specs, los tests y los runbooks del equipo funcionan igual si cambian de proveedor. La inversión no fue en la herramienta, fue en el método."]],
  steps:["Releé la lista del tema 1.1 y anotá qué cambió en tu forma de trabajar.","Escribí tu regla anti-atrofia: qué seguís haciendo a mano a propósito.","Agregá al review la pregunta de deuda invisible."],
  done:"Tenés tu regla anti-atrofia escrita y la pregunta de deuda invisible en tu proceso de review."},
 {t:"13.2 Adopción de la IA en el departamento: gestión del cambio",s:"El obstáculo casi nunca es técnico.",
  detail:"Llevar esto a un equipo o a un cliente falla por razones humanas: miedo al reemplazo, desconfianza en la calidad, o el senior que siente que su experiencia se devalúa. La técnica no resuelve nada de eso.",
  clase:["<b>Empezá por el dolor, no por la herramienta.</b> 'Vamos a usar IA' genera resistencia; 'vamos a dejar de escribir tests a mano' genera interés.",
   "<b>Piloto acotado:</b> un equipo, dos semanas, un objetivo medible. Con métricas antes y después (módulo 3.5), la discusión deja de ser de opiniones.",
   "<b>Los seniors son los que más ganan y los que más resisten.</b> Ganan porque su criterio se amplifica; resisten porque sienten que se devalúa lo que les costó años. Se los suma haciéndolos dueños del método, no usuarios de la herramienta.",
   "<b>Los juniors necesitan lo contrario:</b> límites y fundamentos. Un junior con un agente y sin criterio produce volumen que alguien tiene que revisar.",
   "<b>Lo que funciona se codifica.</b> Cada aprendizaje del piloto se convierte en una regla del proyecto o en una skill compartida. Si no se codifica, se pierde cuando se va la persona.",
   "<b>Con el cliente:</b> transparencia sobre el uso de IA, y el foco en resultados (velocidad, calidad, precio), no en la herramienta. Lo que compran es el resultado.",
   "<b>Lo que no funciona:</b> imponerlo por decreto, medir a las personas por líneas producidas, y prometer que va a reemplazar a alguien."],
  ej:[["Piloto bien planteado","'En dos semanas, el equipo A usa el ciclo completo en todos sus tickets. Medimos tiempo por ticket, retrabajo y bugs. Si no mejora, volvemos atrás.' Reversible y medible."],
   ["Senior convertido en dueño","El más escéptico del equipo escribió las reglas del proyecto y las skills. Pasó de resistir a defender el método."],
   ["Aprendizaje codificado","'El agente siempre olvida validar en el servidor' se convirtió en una línea de las instrucciones del proyecto. No volvió a pasar."]],
  steps:["Diseñá un piloto de dos semanas con un objetivo medible.","Identificá a tu senior más escéptico y hacelo dueño de una parte del método.","Convertí cada aprendizaje del piloto en una regla o una skill compartida."],
  done:"Corriste un piloto medible y sus aprendizajes quedaron codificados en reglas y skills."},
 {t:"13.3 Habilidades clave para ser un ingeniero de impacto en la era de la IA",s:"Cinco habilidades que la IA no reemplaza y sí amplifica.",
  detail:"Si escribir código deja de ser el diferencial, la pregunta es qué lo es. Estas cinco son las que separan a quien dirige el trabajo de quien lo tipea.",
  clase:["<b>1. Especificar.</b> Convertir un deseo vago en criterios verificables. Es la habilidad más rentable de todo el programa: define lo que la IA construye y lo que el cliente recibe.",
   "<b>2. Revisar con criterio.</b> Leer un cambio y detectar lo que está mal aunque compile y pase los tests. Requiere experiencia real, no se puede delegar.",
   "<b>3. Decidir arquitectura.</b> Elegir entre alternativas conociendo los costos a dos años. La IA propone; el que asume las consecuencias decide.",
   "<b>4. Medir.</b> Distinguir mejora real de sensación de mejora. Sin métricas, todo equipo cree que va más rápido.",
   "<b>5. Comunicar.</b> Explicarle a un cliente por qué una solución es mejor, escribir un PR que se entienda, y decir que no con argumentos. Es lo que convierte trabajo técnico en confianza.",
   "<b>Las cinco tienen algo en común:</b> son de juicio, no de ejecución. Y el juicio se entrena con retroalimentación, que es exactamente lo que da el ciclo con sus gates.",
   "<b>Cómo entrenarlas:</b> especificar escribiendo specs, revisar revisando de verdad, decidir escribiendo ADRs, medir con la línea base, y comunicar escribiendo el PR para un humano."],
  ej:[["Especificar bien vs mal","Dos devs reciben el mismo pedido. Uno le pasa la frase al agente; el otro escribe seis escenarios primero. El segundo entrega en el mismo tiempo algo que no vuelve con bugs."],
   ["Revisar con criterio","El código estaba impecable, pero resolvía el problema equivocado: el cliente quería filtrar por fecha de entrega, no de pedido. Ningún test lo hubiera detectado."],
   ["Comunicar un no","'Eso se puede hacer, pero agrega dos semanas y una dependencia que vamos a mantener nosotros. La alternativa cubre el 90 por ciento del caso en dos días.' Eso es valor."]],
  steps:["Autoevaluate de 1 a 5 en las cinco habilidades, con un ejemplo concreto de cada una.","Elegí la más baja y armá un plan de 30 días con una práctica semanal.","Pedí retroalimentación específica sobre esa habilidad a alguien con más experiencia."],
  done:"Tenés tu autoevaluación con ejemplos y un plan de 30 días para tu habilidad más floja."},
 {t:"13.4 Cierre: certificación y próximos pasos",s:"Un ticket real, la tabla del ciclo de vida y el plan de 30 días.",
  detail:"El programa cierra como cierra el trabajo de verdad: con algo entregado, revisado y en producción. No con un examen.",
  clase:["<b>La certificación es un entregable, no una prueba.</b> Un cambio real recorrido de punta a punta con el método completo, revisado por alguien con más experiencia.",
   "<b>Los tres artefactos del cierre:</b> el PR mergeado (demuestra ejecución), tu tabla del ciclo de vida del tema 1.5 (demuestra criterio), y tu plan de 30 días del tema 13.3 (demuestra autoconocimiento).",
   "<b>La conversación de cierre</b> repasa qué gate te costó más y por qué. Ahí suele estar tu próximo salto.",
   "<b>Después del programa, el método se sostiene solo</b> si tres cosas quedan vivas: las reglas del proyecto se actualizan cuando algo falla, los aprendizajes se convierten en skills, y las métricas se miran una vez por mes.",
   "<b>Lo que se desactualiza:</b> los modelos, las herramientas y los precios cambian cada pocos meses. El método (spec, verificación, review independiente, medición) es estable. Por eso se invierte en el método.",
   "<b>Próximos pasos naturales:</b> profundizar en la especialidad que más usás, construir una skill que le sirva a todo el equipo, o tomar el rol de quien lleva el método a un cliente."],
  ej:[["Entregable de certificación","Un PR chico pero completo: issue, spec, worktree, TDD, reporte de verificación con capturas, review adversarial con veredicto, y merge con despliegue."],
   ["Gate que más cuesta","En la mayoría de los casos es la verificación: la tentación de decir 'ya está' antes de comprobarlo. Saberlo es la mitad de corregirlo."],
   ["Método vivo","Un equipo que actualiza sus reglas de proyecto cada vez que el agente comete el mismo error dos veces. A los tres meses, el agente casi no se equivoca en ese repo."]],
  steps:["Completá un ticket real de punta a punta con el ciclo completo.","Juntá los tres artefactos: PR mergeado, tabla del ciclo de vida y plan de 30 días.","Tené la conversación de cierre y anotá qué gate te costó más.","Definí tu próximo paso: especialidad, skill compartida o llevar el método a un cliente."],
  go:"paths",done:"Certificado: un PR mergeado con el método completo, los tres artefactos entregados y la conversación de cierre hecha."},
]},
];
