<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Learning HQ — La escuela de Claude</title>
<meta name="description" content="La academia central de Claude: prompts, skills, comandos, agentes de WhatsApp e Instagram, rutas de aprendizaje y novedades que se actualizan solas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><rect width='48' height='48' rx='12' fill='%23C15F3C'/><g stroke='%23FBF3EA' stroke-width='3.4' stroke-linecap='round'><line x1='24' y1='12' x2='24' y2='36'/><line x1='12' y1='24' x2='36' y2='24'/><line x1='15.5' y1='15.5' x2='32.5' y2='32.5'/><line x1='32.5' y1='15.5' x2='15.5' y2='32.5'/></g></svg>">
<style>
:root{
  --paper:#F6F2EB; --paper2:#EFE8DC; --card:#FFFFFF; --card2:#FBF7F0;
  --ink:#1E1A15; --ink2:#5B5246; --ink3:#90856F;
  --line:#E8DFCF; --line2:#F1EADD;
  --clay:#C15F3C; --clay2:#A8492A; --clay-t:rgba(193,95,60,.10);
  --pine:#1F6F6B; --pine-t:rgba(31,111,107,.10);
  --gold:#B07A12; --gold-t:rgba(176,122,18,.13);
  --berry:#9A3F63; --berry-t:rgba(154,63,99,.10);
  --slate:#4E6285; --slate-t:rgba(78,98,133,.12);
  --code:#221D17; --code-tx:#ECE2D2; --code-dim:#9C8F7C;
  --ok:#2C7A52; --warn:#B26B12;
  --shadow:0 1px 2px rgba(40,30,18,.05),0 14px 40px -22px rgba(40,30,18,.30);
  --shadow-sm:0 1px 2px rgba(40,30,18,.05),0 6px 18px -12px rgba(40,30,18,.20);
  --r:18px; --r2:13px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.serif{font-family:'Fraunces',Georgia,serif}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
h1,h2,h3,h4,.display{font-family:'Fraunces',Georgia,serif;letter-spacing:-.01em;line-height:1.07;font-weight:600}
a{color:var(--clay2);text-decoration:none}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--clay);outline-offset:2px;border-radius:6px}
::selection{background:var(--clay);color:#fff}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ===== layout ===== */
.app{display:grid;grid-template-columns:264px 1fr;min-height:100vh}
.rail{background:linear-gradient(180deg,#FFFDFA,#FBF6EE);border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.rail::-webkit-scrollbar{width:7px}.rail::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 20px}
.brand .lk{display:flex;align-items:center;gap:11px}
.logo-mark{width:42px;height:42px;flex-shrink:0}
.brand .nm{font-family:'Fraunces',serif;font-weight:600;font-size:1.12rem;color:var(--ink);line-height:1.05}
.brand .nm b{color:var(--clay)}
.brand .sub{font-family:'JetBrains Mono',monospace;font-size:.6rem;color:var(--ink3);letter-spacing:.18em;text-transform:uppercase;margin-top:3px}
.navsec{font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);padding:14px 12px 5px;font-weight:500}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;color:var(--ink2);font-family:'JetBrains Mono',monospace;font-size:.83rem;padding:9px 12px;border-radius:10px;transition:background .14s,color .14s;position:relative}
.navbtn .ic{width:17px;height:17px;flex-shrink:0;color:var(--ink3);transition:color .14s}
.navbtn:hover{background:var(--card2);color:var(--ink)}
.navbtn:hover .ic{color:var(--clay)}
.navbtn.active{background:var(--clay);color:#fff}
.navbtn.active .ic{color:#fff}
.navbtn .dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--clay);box-shadow:0 0 0 4px var(--clay-t)}
.navbtn.active .dot{background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.25)}
.rail .spacer{flex:1;min-height:14px}
.rail .foot{font-size:.66rem;color:var(--ink3);padding:12px 12px 4px;line-height:1.7;border-top:1px solid var(--line);margin-top:8px}
.rail .foot b{color:var(--ink2)}

main{padding:46px clamp(20px,4.6vw,72px) 110px;max-width:1180px;width:100%}
section{display:none}
section.visible{display:block;animation:fade .34s cubic-bezier(.2,.7,.3,1)}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.topbar,.topnav{display:none}
@media(max-width:900px){
  .app{grid-template-columns:1fr}.rail{display:none}
  .topbar{display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:60;background:rgba(246,242,235,.92);backdrop-filter:blur(12px);padding:11px 14px;border-bottom:1px solid var(--line)}
  .topbar .logo-mark{width:30px;height:30px}
  .topbar .nm{font-family:'Fraunces',serif;font-weight:600;font-size:.98rem}
  .topbar .nm b{color:var(--clay)}
  .topnav{display:flex;gap:6px;overflow-x:auto;position:sticky;top:53px;z-index:55;background:rgba(246,242,235,.92);backdrop-filter:blur(12px);padding:9px 12px;border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch}
  .topnav::-webkit-scrollbar{display:none}
  .topnav .navbtn{width:auto;white-space:nowrap;font-size:.76rem;padding:7px 11px}
  .topnav .navbtn .ic,.topnav .navbtn .dot{display:none}
  main{padding:24px 15px 90px}
  .pdetail{margin-left:10px;padding:14px 15px}
  .pdetail ol.plist{padding-left:18px}
}

/* ===== type & primitives ===== */
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--clay);margin-bottom:13px;font-weight:500;display:flex;align-items:center;gap:8px}
.eyebrow::before{content:"";width:22px;height:1.5px;background:var(--clay);display:inline-block}
.pagetitle{font-size:clamp(2rem,4.4vw,3rem);font-weight:600;margin-bottom:12px;letter-spacing:-.02em}
.lede{color:var(--ink2);max-width:66ch;margin-bottom:34px;font-size:1.06rem}
.lede.tight{margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--shadow-sm)}
.card.flat{box-shadow:none;background:var(--card2)}
.grid{display:grid;gap:16px}
.grid.c2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.grid.c3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.hr{border:none;border-top:1px solid var(--line);margin:34px 0}
.sectit{font-size:1.4rem;font-weight:600;margin:38px 0 6px;display:flex;align-items:center;gap:10px}
.sectit .n{font-family:'JetBrains Mono',monospace;font-size:.8rem;color:var(--clay);background:var(--clay-t);width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:600}
.secsub{color:var(--ink2);margin:0 0 18px;max-width:64ch}

.tag{display:inline-flex;align-items:center;gap:5px;font-family:'JetBrains Mono',monospace;font-size:.64rem;letter-spacing:.04em;padding:4px 10px;border-radius:99px;font-weight:500;background:var(--card2);color:var(--ink2);border:1px solid var(--line)}
.tag.clay{color:var(--clay2);background:var(--clay-t);border-color:transparent}
.tag.pine{color:var(--pine);background:var(--pine-t);border-color:transparent}
.tag.slate{color:var(--slate);background:var(--slate-t);border-color:transparent}
.tag.berry{color:var(--berry);background:var(--berry-t);border-color:transparent}
.tag.gold{color:var(--gold);background:var(--gold-t);border-color:transparent}
.tag.new{color:#fff;background:var(--clay);border-color:transparent}

.btn{display:inline-flex;align-items:center;gap:7px;background:var(--clay);color:#fff;border:none;border-radius:11px;padding:11px 18px;font-weight:600;font-size:.9rem;box-shadow:var(--shadow-sm);transition:filter .15s,transform .08s}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--clay);background:var(--card2);filter:none}
.btn.small{padding:8px 14px;font-size:.82rem;border-radius:9px}
.btn.dark{background:var(--code);color:var(--code-tx)}
code.inline{font-family:'JetBrains Mono',monospace;background:var(--card2);border:1px solid var(--line);padding:1px 7px;border-radius:6px;font-size:.83em;color:var(--clay2);white-space:nowrap}

.checklist{list-style:none;display:flex;flex-direction:column;gap:10px}
.checklist li{position:relative;padding-left:24px;color:var(--ink2);font-size:.94rem;line-height:1.55}
.checklist li::before{content:"";position:absolute;left:2px;top:8px;width:8px;height:8px;border-radius:50%;border:2px solid var(--clay)}
.checklist li b{color:var(--ink)}

/* ===== code/copy ===== */
.codeline{display:flex;align-items:center;gap:8px;background:var(--code);border-radius:10px;padding:9px 9px 9px 14px;margin-bottom:7px}
.codeline code{flex:1;font-family:'JetBrains Mono',monospace;font-size:.79rem;color:var(--code-tx);white-space:pre-wrap;word-break:break-word}
.copybtn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:#B7A98F;width:31px;height:31px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;transition:.15s}
.copybtn:hover{background:rgba(255,255,255,.16);color:#fff}
.copybtn svg{width:15px;height:15px}
.copybtn.light{background:var(--card2);border-color:var(--line);color:var(--ink3)}
.copybtn.light:hover{background:#fff;color:var(--clay)}
.linkrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.linkbtn{display:inline-flex;align-items:center;gap:5px;background:var(--card2);border:1px solid var(--line);color:var(--clay2);font-size:.78rem;font-weight:500;padding:7px 13px;border-radius:9px;cursor:pointer;font-family:inherit;transition:.15s}
.linkbtn:hover{border-color:var(--clay);background:#fff}
.promptbox{background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:16px 17px;margin-top:10px}
.promptbox .lbl{font-size:.66rem;font-family:'JetBrains Mono',monospace;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:9px;display:flex;align-items:center;gap:7px}
.promptbox .lbl svg{width:13px;height:13px;flex-shrink:0;color:var(--clay)}
.phase .chev{display:grid;place-items:center;width:20px;height:20px;flex-shrink:0}
.phase .chev svg{width:16px;height:16px}
.nov-cta .chev svg{width:13px;height:13px}
.promptbox pre{font-family:'JetBrains Mono',monospace;font-size:.79rem;color:var(--ink);white-space:pre-wrap;word-break:break-word;line-height:1.65;margin-bottom:11px;max-height:300px;overflow:auto}

/* ===== hero ===== */
.hero{position:relative;background:linear-gradient(135deg,#FFFCF7 0%,#FBF4EA 100%);border:1px solid var(--line);border-radius:26px;padding:clamp(28px,4vw,52px);overflow:hidden;margin-bottom:24px}
.hero::after{content:"";position:absolute;right:-90px;top:-90px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,var(--clay-t),transparent 68%);pointer-events:none}
.hero .badge{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 14px 6px 8px;font-size:.78rem;color:var(--ink2);margin-bottom:22px;box-shadow:var(--shadow-sm)}
.hero .badge .pulse{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(44,122,82,.5);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(44,122,82,.45)}70%{box-shadow:0 0 0 9px rgba(44,122,82,0)}100%{box-shadow:0 0 0 0 rgba(44,122,82,0)}}
.hero h1{font-size:clamp(2.3rem,5.4vw,3.7rem);font-weight:600;letter-spacing:-.025em;max-width:18ch;margin-bottom:16px}
.hero h1 em{font-style:italic;color:var(--clay)}
.hero p{color:var(--ink2);max-width:60ch;font-size:1.08rem;margin-bottom:26px}
.hero .cta{display:flex;gap:11px;flex-wrap:wrap}

/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px;margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:17px 18px;box-shadow:var(--shadow-sm)}
.stat .n{font-family:'Fraunces',serif;font-size:1.9rem;font-weight:600;color:var(--clay);line-height:1}
.stat .l{font-size:.78rem;color:var(--ink3);margin-top:6px;font-family:'JetBrains Mono',monospace;letter-spacing:.03em}
.stat.dark{background:var(--code)}.stat.dark .n{color:#fff}.stat.dark .l{color:var(--code-dim)}

/* progress ring */
.ringwrap{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.ring{position:relative;width:128px;height:128px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-family:'Fraunces',serif;font-size:1.9rem;font-weight:600;color:var(--ink)}
.ring .pct small{font-size:.95rem;color:var(--ink3)}

/* feature/quick cards */
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:19px;box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .14s,box-shadow .14s,border-color .14s;text-align:left;display:flex;flex-direction:column;gap:9px}
.qcard:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--clay)}
.qcard .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--clay-t);color:var(--clay)}
.qcard .ic svg{width:20px;height:20px}
.qcard.pine .ic{background:var(--pine-t);color:var(--pine)}
.qcard.berry .ic{background:var(--berry-t);color:var(--berry)}
.qcard.slate .ic{background:var(--slate-t);color:var(--slate)}
.qcard.gold .ic{background:var(--gold-t);color:var(--gold)}
.qcard h3{font-size:1.05rem;font-weight:600}
.qcard p{font-size:.86rem;color:var(--ink2);line-height:1.5}
.qcard .arw{font-family:'JetBrains Mono',monospace;font-size:.74rem;color:var(--clay);margin-top:auto}

/* ===== novedades ===== */
.syncbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:var(--code);color:var(--code-tx);border-radius:var(--r2);padding:15px 19px;margin-bottom:22px}
.syncbar .l{display:flex;align-items:center;gap:11px;font-size:.85rem}
.syncbar .l .dot{width:9px;height:9px;border-radius:50%;background:#5BD08A;box-shadow:0 0 10px #5BD08A}
.syncbar .l b{color:#fff}
.syncbar .meta{font-family:'JetBrains Mono',monospace;font-size:.74rem;color:var(--code-dim)}
.timeline{position:relative;padding-left:26px}
.timeline::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tlitem{position:relative;margin-bottom:16px}
.tlitem::before{content:"";position:absolute;left:-26px;top:22px;width:13px;height:13px;border-radius:50%;background:var(--card);border:2.5px solid var(--clay)}
.tlitem.fresh::before{background:var(--clay);box-shadow:0 0 0 4px var(--clay-t)}
.nov{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:17px 19px;box-shadow:var(--shadow-sm)}
.nov .top{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:8px}
.nov .date{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--ink3);margin-left:auto}
.nov h3{font-size:1.08rem;font-weight:600;margin-bottom:5px}
.nov p{font-size:.9rem;color:var(--ink2);line-height:1.55}
.nov .why{font-size:.84rem;color:var(--ink2);margin-top:8px;padding:9px 12px;background:var(--clay-t);border-radius:9px}
.nov .why b{color:var(--clay2)}
.nov.has-more{cursor:pointer;transition:border-color .14s,box-shadow .14s,transform .12s}
.nov.has-more:hover{border-color:var(--clay);box-shadow:var(--shadow)}
.nov.has-more:active{transform:scale(.997)}
.nov-cta{display:inline-flex;align-items:center;gap:7px;margin-top:13px;font-family:'JetBrains Mono',monospace;font-size:.73rem;color:var(--clay);font-weight:600;letter-spacing:.02em}
.nov-cta .chev{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:6px;background:var(--clay-t);transition:transform .22s}
.nov.open .nov-cta .chev{transform:rotate(90deg)}
.nov.open .nov-cta .lbl-c{display:none}
.nov-cta .lbl-o{display:none}
.nov.open .nov-cta .lbl-o{display:inline}
.nov-more{display:none;margin-top:15px;padding-top:16px;border-top:1px dashed var(--line);cursor:default}
.nov.open .nov-more{display:block;animation:fade .26s}
.nov-more h4{font-family:'JetBrains Mono',monospace;font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin:0 0 9px;font-weight:600}
.nov-more h4.howlbl{margin-top:15px}
.nov-more p{font-size:.92rem;color:var(--ink2);line-height:1.62;margin:0}

/* ===== prompts ===== */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:0 14px;box-shadow:var(--shadow-sm)}
.search svg{width:17px;height:17px;color:var(--ink3);flex-shrink:0}
.search input{flex:1;border:none;background:none;padding:12px 0;font-family:inherit;font-size:.92rem;color:var(--ink);outline:none}
.filterrow{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px}
.chip{font-family:'JetBrains Mono',monospace;font-size:.76rem;padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink2);transition:.14s}
.chip:hover{border-color:var(--clay);color:var(--clay)}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:19px 20px;box-shadow:var(--shadow-sm);transition:border-color .14s}
.pcard:hover{border-color:var(--line)}
.pcard .head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.pcard h3{font-size:1.08rem;font-weight:600;margin:8px 0 5px}
.pcard .desc{font-size:.88rem;color:var(--ink2);line-height:1.5}
.pcard .acts{display:flex;gap:7px;flex-shrink:0}
.pcard pre{display:none;margin-top:14px;font-family:'JetBrains Mono',monospace;font-size:.78rem;color:var(--ink);white-space:pre-wrap;word-break:break-word;line-height:1.65;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:15px;max-height:380px;overflow:auto}
.pcard.open pre{display:block}
.pcard.user{border-left:3px solid var(--pine)}

/* ===== slash command ===== */
.cmd{border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;margin-bottom:11px;background:var(--card);box-shadow:var(--shadow-sm)}
.cmd .ch{display:flex;align-items:center;gap:10px;padding:14px 17px;flex-wrap:wrap}
.cmd .name{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:.94rem;color:var(--ink)}
.cmd .name b{color:var(--clay)}
.cmd .what{font-size:.86rem;color:var(--ink2);flex:1;min-width:160px}
.cmd .when{padding:0 17px 14px;font-size:.84rem;color:var(--ink2)}
.cmd .when b{color:var(--ink);font-weight:600}
.cmd .demo{margin:0 13px 13px;background:var(--code);border-radius:10px;padding:13px 15px;font-family:'JetBrains Mono',monospace;font-size:.78rem;color:var(--code-tx);display:none}
.cmd.open .demo{display:block}
.cmd .demo .ln{white-space:pre-wrap;word-break:break-word;margin:2px 0}
.cmd .demo .cm{color:#E9A87E}
.dim{color:var(--code-dim)}.ok{color:#6FD79B}.wn{color:#E7B86A}
.demobtn{margin-left:auto}

/* ===== roadmap / paths ===== */
.phase{border:1px solid var(--line);border-radius:var(--r2);margin-bottom:13px;background:var(--card);box-shadow:var(--shadow-sm);overflow:hidden}
.phase .ph{display:flex;align-items:center;gap:14px;padding:18px 19px;cursor:pointer}
.phase .pic{width:42px;height:42px;border-radius:12px;background:var(--clay-t);color:var(--clay);display:grid;place-items:center;flex-shrink:0}
.phase .pic svg{width:21px;height:21px}
.phase .pt{flex:1;min-width:0}
.phase .wk{font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase}
.phase .pt h3{font-size:1.13rem;font-weight:600;margin:3px 0}
.phase .ct{font-size:.8rem;color:var(--ink2)}
.phase .mini{display:flex;align-items:center;gap:9px}
.phase .bar{width:64px;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.phase .bar i{display:block;height:100%;background:var(--clay);border-radius:99px;transition:width .4s}
.phase .pp{font-family:'JetBrains Mono',monospace;font-size:.74rem;color:var(--ink2);min-width:34px;text-align:right}
.phase .chev{color:var(--ink3);transition:transform .2s}
.phase.open .chev{transform:rotate(90deg)}
.phase .body{display:none;padding:4px 19px 16px;border-top:1px solid var(--line2)}
.phase.open .body{display:block;animation:fade .25s}

.task{display:flex;align-items:flex-start;gap:11px;padding:11px 0;cursor:pointer;border-bottom:1px solid var(--line2)}
.task:last-child{border-bottom:none}
.task input{appearance:none;width:21px;height:21px;border:2px solid var(--line);border-radius:7px;flex-shrink:0;margin-top:2px;cursor:pointer;transition:.14s;position:relative;background:var(--card)}
.task input:checked{background:var(--clay);border-color:var(--clay)}
.task input:checked::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:.78rem;font-weight:700}
.task .tt{font-size:.94rem;font-weight:600;color:var(--ink)}
.task .ts{font-size:.84rem;color:var(--ink2);margin-top:2px}
.task.done .tt{text-decoration:line-through;color:var(--ink3)}
.extras{margin:2px 0 14px 32px;display:flex;flex-direction:column;gap:9px}

.pathtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.ptab{display:flex;align-items:center;gap:9px;padding:13px 16px;border:1px solid var(--line);border-radius:13px;background:var(--card);cursor:pointer;transition:.14s;box-shadow:var(--shadow-sm)}
.ptab .ic{width:30px;height:30px;border-radius:9px;background:var(--clay-t);color:var(--clay);display:grid;place-items:center}
.ptab .ic svg{width:17px;height:17px}
.ptab .tt{font-weight:600;font-size:.92rem}
.ptab .ts{font-size:.74rem;color:var(--ink3)}
.ptab.active{border-color:var(--clay);background:linear-gradient(180deg,#FFFCF7,#FBF4EA)}
.ptab.active .ic{background:var(--clay);color:#fff}
.progressbar{height:9px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:22px}
.progressbar i{display:block;height:100%;background:linear-gradient(90deg,var(--clay),var(--gold));border-radius:99px;transition:width .5s}
/* path steps expandibles */
.pstep{border-bottom:1px solid var(--line2)}
.pstep:last-child{border-bottom:none}
.prow{display:flex;align-items:flex-start;gap:12px;padding:14px 2px}
.prow input{appearance:none;width:21px;height:21px;border:2px solid var(--line);border-radius:7px;flex-shrink:0;margin-top:1px;cursor:pointer;transition:.14s;position:relative;background:var(--card)}
.prow input:checked{background:var(--clay);border-color:var(--clay)}
.prow input:checked::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:.78rem;font-weight:700}
.pmain{flex:1;cursor:pointer;min-width:0}
.pmain .tt{font-size:.97rem;font-weight:600;color:var(--ink)}
.pmain .ts{font-size:.85rem;color:var(--ink2);margin-top:2px}
.pstep.done .pmain .tt{text-decoration:line-through;color:var(--ink3)}
.pchev{cursor:pointer;color:var(--ink3);flex-shrink:0;display:grid;place-items:center;width:27px;height:27px;border-radius:8px;transition:transform .2s,background .14s,color .14s}
.pchev:hover{background:var(--card2);color:var(--clay)}
.pchev svg{width:16px;height:16px}
.pstep.open .pchev{transform:rotate(90deg)}
.pdetail{display:none;cursor:default;margin:0 0 15px 33px;padding:16px 18px;background:var(--card2);border:1px solid var(--line);border-radius:13px}
.pstep.open .pdetail{display:block;animation:fade .24s}
.pdetail .pintro{font-size:.9rem;color:var(--ink2);line-height:1.6;margin-bottom:14px}
.pdetail h5{font-family:'JetBrains Mono',monospace;font-size:.63rem;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);margin:0 0 10px;font-weight:600}
.pdetail ol.plist{margin:0;padding-left:21px;display:flex;flex-direction:column;gap:9px}
.pdetail ol.plist li{font-size:.91rem;color:var(--ink);line-height:1.55;padding-left:3px}
.pdetail ol.plist li::marker{color:var(--clay);font-weight:700;font-family:'JetBrains Mono',monospace}
.pdetail .pcode{margin-top:13px}
.pdetail .clase{margin:0 0 15px;padding:14px 16px;background:var(--clay-t);border-radius:11px;border:1px solid var(--line)}.pdetail .clase ul{margin:0;padding-left:19px;display:flex;flex-direction:column;gap:10px}.pdetail .clase li{font-size:.9rem;color:var(--ink);line-height:1.6}.pdetail .clase li::marker{color:var(--clay)}.pdetail .ejes{margin-top:14px;display:flex;flex-direction:column;gap:9px}.pdetail .eje{padding:11px 13px;background:var(--card);border:1px solid var(--line);border-radius:10px}.pdetail .eje .et{font-family:'JetBrains Mono',monospace;font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;color:var(--clay);font-weight:600;margin-bottom:5px}.pdetail .eje .ed{font-size:.88rem;color:var(--ink2);line-height:1.58}.pdetail .eje .ed code{font-family:'JetBrains Mono',monospace;font-size:.83em;background:var(--card2);padding:1px 5px;border-radius:5px;color:var(--ink)}.pdetail .pdone{margin-top:14px;font-size:.87rem;color:var(--ink2);padding:11px 14px;background:var(--pine-t);border-radius:10px}
.pdetail .pdone b{color:var(--pine)}
.pdetail .linkrow{margin-top:13px}

/* concept cards */
.concept{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:18px 20px;box-shadow:var(--shadow-sm)}
.concept h3{font-size:1.05rem;font-weight:600;margin-bottom:7px;display:flex;align-items:center;gap:9px}
.concept h3 .k{font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--clay);background:var(--clay-t);padding:3px 8px;border-radius:6px;font-weight:600}
.concept p{font-size:.9rem;color:var(--ink2);line-height:1.58}
.concept p b{color:var(--ink)}
.concept{transition:border-color .14s,box-shadow .14s}
.concept.has-more{cursor:pointer}
.concept.has-more:hover{border-color:var(--clay);box-shadow:var(--shadow)}
.cta-more{display:inline-flex;align-items:center;gap:7px;margin-top:12px;font-family:'JetBrains Mono',monospace;font-size:.71rem;color:var(--clay);font-weight:600;letter-spacing:.02em}
.cta-more .chev{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:6px;background:var(--clay-t);transition:transform .22s}
.cta-more .chev svg{width:13px;height:13px}
.concept.open .cta-more .chev{transform:rotate(90deg)}
.concept.open .cta-more .lbl-c{display:none}
.cta-more .lbl-o{display:none}
.concept.open .cta-more .lbl-o{display:inline}
.concept-more{display:none;margin-top:13px;padding-top:14px;border-top:1px dashed var(--line);cursor:default}
.concept.open .concept-more{display:block;animation:fade .24s}
.concept-more h5{font-family:'JetBrains Mono',monospace;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin:0 0 8px;font-weight:600}
.concept-more p{font-size:.89rem;color:var(--ink);line-height:1.6;margin:0}
.concept-more .pcode{margin-top:12px}

/* model table */
.mtable{width:100%;border-collapse:collapse;font-size:.88rem}
.mtable th{text-align:left;font-family:'JetBrains Mono',monospace;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding:10px 12px;border-bottom:2px solid var(--line)}
.mtable td{padding:12px;border-bottom:1px solid var(--line2);color:var(--ink2);vertical-align:top}
.mtable td b{color:var(--ink)}
.mtable .mono{font-size:.8rem;color:var(--clay2)}
.mtable tr:hover td{background:var(--card2)}
@media(max-width:680px){.mtable thead{display:none}.mtable,.mtable tbody,.mtable tr,.mtable td{display:block;width:100%}.mtable tr{border:1px solid var(--line);border-radius:11px;margin-bottom:11px;padding:6px;background:var(--card)}.mtable td{border:none;padding:7px 12px}.mtable td::before{content:attr(data-l);font-family:'JetBrains Mono',monospace;font-size:.62rem;text-transform:uppercase;color:var(--ink3);display:block;margin-bottom:2px}}

/* reto */
.reto{background:linear-gradient(135deg,var(--code),#332B22);color:var(--code-tx);border-radius:var(--r);padding:30px;position:relative;overflow:hidden}
.reto::after{content:"";position:absolute;right:-70px;bottom:-70px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(193,95,60,.3),transparent 70%)}
.reto .k{font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:#E9A87E;margin-bottom:14px}
.reto h3{font-size:1.5rem;color:#fff;margin-bottom:10px;max-width:30ch}
.reto p{color:#D8CCB8;max-width:58ch;position:relative}
.reto .row{display:flex;gap:24px;margin-top:22px;position:relative;flex-wrap:wrap;align-items:center}

/* lab */
.chat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow-sm)}
.chatlog{padding:20px;display:flex;flex-direction:column;gap:13px;max-height:440px;overflow-y:auto}
.msg{max-width:84%;padding:12px 15px;border-radius:14px;font-size:.9rem;line-height:1.55;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--clay);color:#fff;border-bottom-right-radius:5px}
.msg.a{align-self:flex-start;background:var(--card2);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.a b{color:var(--clay2)}
.chatin{display:flex;gap:9px;padding:13px;border-top:1px solid var(--line);background:var(--card2)}
.chatin textarea{flex:1;border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-family:inherit;font-size:.9rem;resize:none;height:46px;background:var(--card);color:var(--ink);outline:none}
.chatin textarea:focus{border-color:var(--clay)}
.typing{padding:0 20px 12px;font-size:.8rem;color:var(--ink3);font-style:italic}

/* toast + addmodal */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--code);color:#fff;padding:12px 22px;border-radius:12px;font-size:.88rem;font-weight:500;box-shadow:var(--shadow);opacity:0;transition:.3s;z-index:200;display:flex;align-items:center;gap:9px}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast .dot{width:8px;height:8px;border-radius:50%;background:#5BD08A}
.modal{position:fixed;inset:0;background:rgba(30,26,21,.5);backdrop-filter:blur(4px);z-index:150;display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex;animation:fade .2s}
.modal .box{background:var(--card);border-radius:var(--r);padding:26px;max-width:560px;width:100%;box-shadow:var(--shadow);max-height:90vh;overflow:auto}
.modal h3{font-size:1.3rem;margin-bottom:16px}
.modal label{display:block;font-size:.78rem;font-family:'JetBrains Mono',monospace;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin:13px 0 6px}
.modal input,.modal textarea,.modal select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-family:inherit;font-size:.9rem;background:var(--card2);color:var(--ink);outline:none}
.modal textarea{resize:vertical;min-height:130px;font-family:'JetBrains Mono',monospace;font-size:.82rem}
.modal input:focus,.modal textarea:focus,.modal select:focus{border-color:var(--clay)}
.modal .actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}

.callout{display:flex;gap:13px;background:var(--gold-t);border:1px solid rgba(176,122,18,.25);border-radius:13px;padding:16px 18px;margin:18px 0}
.callout .i{flex-shrink:0;color:var(--gold)}
.callout .i svg{width:22px;height:22px}
.callout p{font-size:.9rem;color:var(--ink2);line-height:1.55}
.callout p b{color:var(--ink)}
.callout.pine{background:var(--pine-t);border-color:rgba(31,111,107,.25)}.callout.pine .i{color:var(--pine)}
.callout.clay{background:var(--clay-t);border-color:rgba(193,95,60,.25)}.callout.clay .i{color:var(--clay)}

/* ===== buscador global (⌘K) ===== */
.railsearch{display:flex;align-items:center;gap:9px;width:100%;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin:2px 0 8px;color:var(--ink3);font-size:.83rem;transition:.14s;font-family:inherit}
.railsearch:hover{border-color:var(--clay);color:var(--ink2);background:var(--card)}
.railsearch svg{width:16px;height:16px;flex-shrink:0}
.railsearch span{flex:1;text-align:left}
kbd{font-family:'JetBrains Mono',monospace;font-size:.66rem;background:var(--card);border:1px solid var(--line);border-radius:5px;padding:2px 6px;color:var(--ink3);line-height:1}
.topsearch{margin-left:auto;background:var(--card);border:1px solid var(--line);border-radius:9px;width:36px;height:36px;display:grid;place-items:center;color:var(--ink2);flex-shrink:0}
.topsearch svg{width:17px;height:17px}
.palette{position:fixed;inset:0;background:rgba(30,26,21,.42);backdrop-filter:blur(5px);z-index:180;display:none;align-items:flex-start;justify-content:center;padding:78px 20px 20px}
.palette.show{display:flex;animation:fade .16s}
.pal-box{background:var(--card);border:1px solid var(--line);border-radius:17px;width:100%;max-width:610px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;max-height:72vh}
.pal-search{display:flex;align-items:center;gap:12px;padding:16px 19px;border-bottom:1px solid var(--line)}
.pal-search svg{width:19px;height:19px;color:var(--ink3);flex-shrink:0}
.pal-search input{flex:1;border:none;background:none;font-family:inherit;font-size:1.02rem;color:var(--ink);outline:none}
.pal-results{overflow-y:auto;padding:8px}
.pal-empty{padding:30px;text-align:center;color:var(--ink3);font-size:.9rem}
.pal-sec{font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);padding:10px 12px 5px;font-weight:600}
.pal-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;cursor:pointer}
.pal-item .ic{width:33px;height:33px;border-radius:9px;background:var(--card2);color:var(--clay);display:grid;place-items:center;flex-shrink:0}
.pal-item .ic svg{width:16px;height:16px}
.pal-item .tx{flex:1;min-width:0}
.pal-item .tt{font-size:.93rem;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal-item .ts{font-size:.78rem;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.pal-item .ty{font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--ink3);background:var(--card2);border:1px solid var(--line);padding:3px 8px;border-radius:6px;flex-shrink:0}
.pal-item:hover{background:var(--card2)}
.pal-item.sel{background:var(--clay);}
.pal-item.sel .ic{background:rgba(255,255,255,.2);color:#fff}
.pal-item.sel .tt{color:#fff}
.pal-item.sel .ts{color:rgba(255,255,255,.8)}
.pal-item.sel .ty{background:rgba(255,255,255,.16);color:#fff;border-color:transparent}
.pal-foot{display:flex;gap:16px;padding:11px 17px;border-top:1px solid var(--line);font-size:.72rem;color:var(--ink3);background:var(--card2);flex-wrap:wrap}
.pal-foot span{display:flex;align-items:center;gap:6px}
.databox{display:flex;gap:9px;flex-wrap:wrap;align-items:center}

/* ===== plantillas ===== */
.tpl{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:21px 22px;box-shadow:var(--shadow-sm);cursor:pointer;transition:border-color .14s,box-shadow .14s}
.tpl:hover{border-color:var(--clay);box-shadow:var(--shadow)}
.tpl .thead{display:flex;gap:14px;align-items:flex-start}
.tpl .tic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;flex-shrink:0;background:var(--clay-t);color:var(--clay)}
.tpl .tic svg{width:22px;height:22px}
.tpl.pine .tic{background:var(--pine-t);color:var(--pine)}
.tpl.berry .tic{background:var(--berry-t);color:var(--berry)}
.tpl.slate .tic{background:var(--slate-t);color:var(--slate)}
.tpl.gold .tic{background:var(--gold-t);color:var(--gold)}
.tpl h3{font-size:1.16rem;font-weight:600}
.tpl .tsub{font-size:.9rem;color:var(--ink2);margin-top:3px}
.tpl .tstack{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.tpl-more{display:none;margin-top:16px;padding-top:16px;border-top:1px dashed var(--line);cursor:default}
.tpl.open .tpl-more{display:block;animation:fade .24s}
.tpl.open .cta-more .chev{transform:rotate(90deg)}
.tpl.open .cta-more .lbl-c{display:none}
.tpl.open .cta-more .lbl-o{display:inline}
.tpl-more h5{font-family:'JetBrains Mono',monospace;font-size:.63rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin:0 0 9px;font-weight:600}
.tpl-more ul.incl{list-style:none;display:flex;flex-direction:column;gap:7px;margin:0}
.tpl-more ul.incl li{font-size:.9rem;color:var(--ink2);line-height:1.5;padding-left:21px;position:relative}
.tpl-more ul.incl li::before{content:"✓";position:absolute;left:0;color:var(--pine);font-weight:700}
.tpl-more ol.plist{margin:0;padding-left:21px;display:flex;flex-direction:column;gap:8px}
.tpl-more ol.plist li{font-size:.9rem;color:var(--ink);line-height:1.5}
.tpl-more ol.plist li::marker{color:var(--clay);font-weight:700;font-family:'JetBrains Mono',monospace}
</style>
</head>
<body>

<div class="toast" id="toast"><span class="dot"></span><span id="toast-txt">Copiado</span></div>

<!-- command palette -->
<div class="palette" id="palette" onclick="if(event.target===this)closePalette()">
  <div class="pal-box">

  </div>
</div>

<!-- mobile bars -->

  <button class="topsearch" onclick="openPalette()" aria-label="Buscar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg></button>
</div>
<nav class="topnav" id="topnav"></nav>

<div class="app">
  <aside class="rail">

      <div class="logo-mark" id="logo-d"></div>
      <div>
        <div class="nm">Claude <b>Learning HQ</b></div>

      </div>

    <button class="railsearch" onclick="openPalette()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg><span>Buscar…</span><kbd>⌘K</kbd></button>

  <main id="main"></main>
</div>

<!-- add prompt modal -->
<div class="modal" id="modal">
  <div class="box">
    <h3 class="serif">Guardar un prompt nuevo</h3>
    <p style="font-size:.88rem;color:var(--ink2)">Se guarda en este navegador. Tu colección personal vive con vos.</p>
    <label>Título</label>
    <input id="m-title" placeholder="Ej: Landing de alta conversión">

    <select id="m-cat">
      <option value="Web">Web hermosa</option>
      <option value="WhatsApp">Agente WhatsApp</option>
      <option value="Instagram">Agente Instagram</option>

{date:"2026-09-09",tag:"claude code",tagc:"clay",fresh:true,
 title:"v2.1.267: `maxEffortLevel` para limitar el esfuerzo por modelo y `--system-prompt-snapshot off`",
 body:"La v2.1.267 trae dos features de control fino para builders. `maxEffortLevel` (en settings.json) fija el techo de nivel de esfuerzo por modelo o globalmente: los usuarios pueden bajar el nivel pero nunca superarlo; útil para orgs que quieren controlar el gasto en extended-thinking. `--system-prompt-snapshot off` hace que el system prompt se re-renderice en cada request en lugar de reutilizar el guardado, lo que permite iterar el prompt sin afectar el historial de la conversación.",
 why:"Si administrás Claude Code para un equipo o construís agentes con extended-thinking, `maxEffortLevel` te da control de gasto sin deshabilitar la feature; y `--system-prompt-snapshot off` es clave cuando iterás el system prompt en producción.",
 more:{detail:"`maxEffortLevel` es una nueva setting de settings.json que se puede poner a nivel global o por modelo bajo `modelSettings`. Cuando está activa, el usuario puede seleccionar cualquier nivel de esfuerzo igual o inferior, pero no puede subir por encima del máximo configurado. Esto es especialmente útil para orgs que habilitan extended-thinking (Opus 4.8, Fable 5.1) pero quieren limitar el costo de reasoning tokens en tareas de baja complejidad. El valor acepta los mismos niveles que /effort: low, medium, high, xhigh, max. `--system-prompt-snapshot off` es un flag de la CLI que desactiva el comportamiento por defecto de reutilizar el snapshot del system prompt guardado en la conversación: con este flag activo, Claude re-renderiza el system prompt completo en cada request usando su definición actual. Esto permite que los cambios que hacés al system prompt (en settings.json, CLAUDE.md, o en la sesión) tengan efecto inmediato sin iniciar una sesión nueva. La v2.1.267 también cierra varios bugs críticos: fix de seguridad para bypass de contención en marketplace (rutas con barras invertidas), fix para Cowork tasks que fallaban en orgs con sandbox obligatorio, y múltiples mejoras de prompt-cache reuse en sesiones reanudadas y con cambios de modelo.",
   code:["# maxEffortLevel global en settings.json:","{ \"maxEffortLevel\": \"high\" }","","# maxEffortLevel por modelo:","{ \"modelSettings\": { \"claude-opus-4-1\": { \"maxEffortLevel\": \"xhigh\" } } }","","# Los usuarios pueden elegir low/medium/high pero no subir de high","","# System prompt fresco en cada request (no reutiliza snapshot):","claude --system-prompt-snapshot off","","# Útil para iterar el system prompt sin reiniciar la sesión:","claude --system-prompt-snapshot off -p 'tu tarea'","","# Ver todos los niveles disponibles:","/effort"],
   links:[["Changelog Claude Code v2.1.267","https://code.claude.com/docs/en/changelog"]]}},
{date:"2026-09-08",tag:"claude code",tagc:"clay",fresh:true,
 title:"v2.1.265: `--plugin-dir` acepta carpetas de plugins y cap de 1 GB en resultados de herramientas",
 body:"La v2.1.265 mejora la gestión de plugins y pone un techo al uso de disco de tool results. `--plugin-dir` ahora acepta una carpeta entera: cada subcarpeta con un manifest se carga como plugin, y los cambios en caliente (agregar/quitar plugins en esa carpeta) se detectan sin reiniciar. El 1 GB cap en tool results guardados a disco evita que outputs de herramientas muy voluminosas consuman espacio de forma descontrolada, con indicador en la conversación cuando el archivo quedó truncado.",
 why:"Si construís pipelines con varios plugins, la carpeta única de plugins simplifica la gestión significativamente. Y el cap de 1 GB es importante para agentes que corren comandos con salida muy grande.",
 more:{detail:"Con el nuevo soporte de `--plugin-dir` para carpetas, en lugar de pasar un plugin a la vez, podés apuntar al directorio que los contiene todos: Claude Code recorre las subcarpetas, carga las que tienen un manifest válido, y queda en modo watch sobre la carpeta. Si mientras la sesión está activa agregás o removés una subcarpeta de plugin, el cambio se detecta automáticamente sin reiniciar ni recargar la sesión. El 1 GB cap aplica a los archivos que Claude Code guarda en disco cuando la salida de una herramienta supera el umbral de almacenamiento offline: el archivo se trunca en 1 GB y en la conversación aparece un indicador de que fue recortado. Esto protege contra casos donde comandos como grep, find o pipelines de CI producen gigabytes de output. La v2.1.265 también corrige un bug crítico de prompt-cache: los subagentes en primer plano reanudados que cambiaban su lista de herramientas o system prompt prefix rompían el prompt-cache reuse; y fix para sesiones reiniciadas tras crash donde el último prompt se reescribía incorrectamente.",
   code:["# Antes: pasar plugins uno por uno:","claude --plugin /ruta/plugin-a --plugin /ruta/plugin-b","","# Ahora: apuntar a la carpeta que los contiene:","claude --plugin-dir /ruta/a/mis-plugins/","","# Estructura esperada:","# mis-plugins/","#   plugin-a/  (con manifest)","#   plugin-b/  (con manifest)","#   plugin-c/  (con manifest)","","# Los plugins se cargan todos automáticamente","# y se detectan cambios en caliente mientras la sesión está activa"],
   links:[["Changelog Claude Code v2.1.265","https://code.claude.com/docs/en/changelog"]]}},
{date:"2026-09-04",tag:"claude code",tagc:"clay",fresh:false,
 title:"v2.1.261: `/skill-doctor`, salida de comandos hasta 128K y system prompt de subagente desde archivo",
 body:"La v2.1.261 suma tres features para builders. `/skill-doctor` muestra qué skills cargados no se usaron en la sesión y cuántos tokens de contexto consumen, para que puedas podarlos. `bashOutputMaxChars` y `taskOutputMaxChars` (hasta 128K caracteres) permiten que Claude vea inline la salida completa de comandos largos sin guardarlos en archivo. `--append-subagent-system-prompt-file` lee el system prompt del subagente desde un archivo, ideal para prompts demasiado grandes para pasar en línea de comandos.",
 why:"Si usás skills y subagentes, estas tres settings te dan visibilidad y control sobre el contexto que consumen y la salida que procesan.",
 more:{detail:"`/skill-doctor` es un nuevo slash command que analiza la sesión actual y lista cada skill cargado que no fue invocado, junto con su costo estimado en tokens de contexto. Es la herramienta oficial para detectar skills que se cargan automáticamente pero no se usan, y decidir si vale la pena mantenerlos activos. `bashOutputMaxChars` y `taskOutputMaxChars` son nuevas settings en settings.json que controlan cuántos caracteres de salida de un comando Bash o tarea en segundo plano Claude recibe inline antes de que el output sea guardado en archivo; el límite anterior era más bajo, lo que hacía que builds o tests largos se cortaran. Con estas settings podés subir hasta 128K caracteres. `--append-subagent-system-prompt-file` es un flag nuevo de la CLI que permite pasar el system prompt del subagente leyéndolo desde un archivo local, evitando los límites de longitud de argumentos del shell para prompts muy extensos. Además, v2.1.261 corrige un bug de alto uso de CPU cuando un agente en segundo plano no podía reanudarse y se reintentaba en loop, y múltiples fixes de Remote Control y VS Code.",
   code:["/skill-doctor","# Lista skills cargados no usados y su costo de contexto","# Ejemplo de output:","# ● dataviz  — cargado, 0 usos, ~4K tokens","# ● claude-api — cargado, 0 usos, ~2K tokens","","# bashOutputMaxChars en settings.json:","{ \"bashOutputMaxChars\": 131072 }","","# taskOutputMaxChars para tareas en segundo plano:","{ \"taskOutputMaxChars\": 131072 }","","# System prompt de subagente desde archivo:","claude --append-subagent-system-prompt-file mi-system-prompt.txt -p 'tarea del subagente'"],
   links:[["Changelog Claude Code v2.1.261","https://code.claude.com/docs/en/changelog"]]}},
{date:"2026-09-03",tag:"claude code",tagc:"clay",fresh:false,
 title:"v2.1.260: panel `/diff` en fullscreen, diagnósticos de caché en `/cost` y fixes críticos de permisos",
 body:"La v2.1.260 suma el panel de diff togglable con `/diff`: abre un panel lateral que muestra los cambios sin commitear mientras Claude edita, sin salir del modo fullscreen. El comando `/cost` ahora explica por qué falló el prompt-cache (cambio en tool definitions, sistema prompt modificado, TTL expirado). La herramienta `/reload-plugins` y el advisor con sintaxis de texto (`/advisor`, `/advisor <modelo>`, `/advisor off`) quedan disponibles en sesiones headless. Se corrigieron bugs críticos de seguridad: reglas de permisos con paréntesis que se ignoraban silenciosamente, y comandos zsh con sustitución oculta que se auto-aprobaban sin pedir confirmación.",
 why:"El diagnóstico de caché en `/cost` es accionable de inmediato: sabés exactamente por qué estás pagando más de lo esperado y qué cambiar para arreglarlo.",
 more:{detail:"El panel `/diff` se integra al modo fullscreen de Claude Code y muestra en tiempo real los cambios sin commitear de la sesión actual, sin necesidad de abrir otra terminal o salir de la interfaz. Es togglable: `/diff` lo abre y `/diff` de nuevo lo cierra. La mejora de `/cost` agrega el campo `prompt_cache` al statusline y un diagnóstico al ejecutar el comando: si el caché falló, el output indica la causa exacta (por ejemplo, 'tool definitions cambiaron', 'system prompt modificado', 'TTL expirado'). Esto es clave para depurar pipelines donde el caching no se comporta como se espera. Los fixes de seguridad tapan dos bypasses: (1) Reglas `Edit`/`Write`/`Read` con paréntesis en la ruta (ej: `Edit(C:\\dir\\(name)\\**)`) eran descartadas como inválidas por la sandbox, dejando carpetas protegidas accesibles. (2) Comandos zsh que ocultan sustitución de comandos en asignaciones `REPORTTIME`, `REPORTMEMORY` o `DIRSTACKSIZE` se auto-aprobaban; ahora piden aprobación explícita. Fix adicional: `/rewind` ya no reporta éxito cuando faltan los archivos de backup de checkpoint (el revert no se aplicaba silenciosamente).",
   code:["# Abrir/cerrar el panel de diff en modo fullscreen:","/diff","","# Ver diagnósticos de prompt-cache:","/cost","# Output de ejemplo con diagnóstico:","# prompt_cache: miss — tool definitions changed (turno 4)","# prompt_cache: miss — system prompt modified (turno 12)","","# Recargar plugins en sesión headless:","/reload-plugins","","# Advisor sin modelo (recomendación automática):","/advisor","# Advisor con modelo específico:","/advisor claude-opus-5","# Desactivar advisor:","/advisor off"],
   links:[["Changelog Claude Code v2.1.260","https://code.claude.com/docs/en/changelog"]]}},
{date:"2026-09-03",tag:"claude code",tagc:"clay",fresh:false,
 title:"v2.1.260: fix crítico de Fable 5.1 (caching + pin [1m]), auto-compact mejorado y Workflow más robusto",
 body:"La v2.1.260 cierra varios bugs de alto impacto para builders. El prompt caching de Fable 5.1 no cubría el contexto adjunto después de resultados de herramientas, por lo que cada tool-call enviaba esos tokens como input sin cachear. El pin `[1m]` en `ANTHROPIC_DEFAULT_FABLE_MODEL` era ignorado por agentes con `model: fable`, que caían silenciosamente a la ventana de 200K. El auto-compact de Opus y Fable ahora dispara antes del límite de 1M tokens (evitando cortes). El Workflow tool rechaza schemas JSON imposibles de satisfacer desde el principio en lugar de fallar al validar el output.",
 why:"Si usás Fable 5.1 con tool use en agentes, tu costo real de prompt caching era más alto de lo esperado: este fix lo corrige automáticamente al actualizar.",
 more:{detail:"Fable 5.1 tiene soporte de prompt caching para ventanas de 1M tokens, pero hasta la v2.1.260 existía un bug: el contexto adjunto después de los resultados de herramientas (tool results) no quedaba bajo la cobertura de caché y se reenviaba completo en cada turno posterior. En pipelines con tool use intensivo, esto multiplicaba el costo de input. El fix es automático al actualizar. El bug del pin `[1m]`: cuando `ANTHROPIC_DEFAULT_FABLE_MODEL` incluye el tag `[1m]` (para forzar ventana de 1M tokens) y el agente declara `model: fable`, el pin se ignoraba y el agente usaba la ventana de 200K por defecto. Ahora el pin se respeta. Auto-compact mejorado: sesiones de Opus 5 y Fable 5.1 ya compactan poco antes de alcanzar el límite de 1M tokens, evitando el corte abrupto; además, la compactación de recuperación en contextos muy grandes ya no agota el timeout de 10 minutos. Workflow mejorado: `agent({schema})` valida el JSON Schema antes de lanzar el agente y lo rechaza de entrada si el schema es imposible de satisfacer (ej: `type: 'number'` con `enum: ['a']`). Los errores de retry-cap ahora incluyen el último fallo de validación para facilitar el debug. `/effort` en Fable 5.1 fue mejorado: cambiar el nivel de esfuerzo a mitad de sesión ya no invalida el prompt cache.",
   code:["# Actualizar para obtener todos los fixes:","claude update","","# Verificar que el pin [1m] aplica correctamente:","# En .claude/settings.json de tu agente:","{ \"model\": \"fable\" }","# Con ANTHROPIC_DEFAULT_FABLE_MODEL=claude-fable-5-1[1m]","# → el agente ahora usa ventana 1M correctamente","","# Auto-compact: no requiere configuración, aplica automáticamente","# en sesiones Opus 5 y Fable 5.1 cerca del límite de 1M tokens","","# Workflow con schema validado desde el inicio:","# agent('tu tarea', { schema: tuSchema })","# → si el schema es imposible, falla rápido con mensaje claro"],
   links:[["Changelog Claude Code v2.1.260","https://code.claude.com/docs/en/changelog"]]}},
{date:"2026-08-28",tag:"claude code",tagc:"clay",fresh:false,
 title:"v2.1.251: hooks PreModelSwitch/PostModelSwitch para controlar cambios de modelo",
 body:"La v2.1.251 introduce dos hooks nuevos en el sistema de eventos de Claude Code: PreModelSwitch se dispara justo antes de que el agente cambie de modelo y puede bloquear o confirmar el cambio; PostModelSwitch se dispara una vez efectuado y sirve para auditoría o logging. Los hooks SessionStart resume suman datos de antigüedad de sesión y costo estimado de re-caché. También llegó streaming en vivo de subagentes en primer plano para clientes de Remote Control.",
 why:"Los hooks de modelo son la palanca clave para pipelines de orquestación multi-modelo: podés controlar cuándo y a qué modelo escala el agente sin parchear el código del agente.",
 more:{detail:"PreModelSwitch y PostModelSwitch se suman al sistema de hooks de Claude Code (como PreToolUse, PostToolUse, etc.). PreModelSwitch recibe información sobre el modelo actual y el propuesto; puede responder block (abortar el cambio), confirm (forzar aprobación explícita) o nada (permitir). PostModelSwitch confirma qué modelo quedó activo y cuándo. Los SessionStart resume hooks reciben ahora session_age (antigüedad en segundos) y estimated_recache_cost (costo estimado de re-caché al retomar la sesión), útil para decidir si conviene reanudar o iniciar sesión nueva. El live streaming de subagentes en primer plano agrega observabilidad real a pipelines multi-agente: los clientes de Remote Control ahora reciben en tiempo real las llamadas a herramientas y resultados de los subagentes que corren en primer plano (los de fondo siguen mostrando solo estado). También llegó: campo rate_limits.spend_limit en el statusline para usuarios detrás de gateways con límite de gasto, barra de límite en /usage, e información de prompt-cache por sesión en /cost (hit ratio, misses, tokens re-cacheados, estado warm/cold).",
   code:["# Configurar hook PreModelSwitch en settings.json:","{ \"hooks\": { \"PreModelSwitch\": [{ \"matcher\": \"\", \"hooks\": [{ \"type\": \"command\", \"command\": \"mi-script-de-control\" }] }] } }","","# El script recibe (stdin JSON):","# { current_model: 'claude-sonnet-5', proposed_model: 'claude-opus-5', reason: '...' }","","# Responder para bloquear el cambio:","# { action: 'block', message: 'Solo se permite Sonnet 5 en este proyecto' }","","# Responder para confirmar (pide aprobación al usuario):","# { action: 'confirm' }","","# Sin respuesta o exit 0: el cambio procede normalmente"],
   links:[["Changelog Claude Code v2.1.251","https://code.claude.com/docs/en/changelog"]]}},
{date:"2026-08-28",tag:"claude code",tagc:"clay",fresh:false,
 title:"v2.1.251: fixes críticos de seguridad en path traversal para archivos, plugins y Grep",
 body:"La v2.1.251 cierra cuatro vulnerabilidades de path traversal. Las herramientas de archivo (Read, Write, Edit) ahora validan permisos ANTES de seguir symlinks, eliminando el bypass donde el symlink se podía intercambiar después del chequeo. Los comandos de plugins del marketplace no pueden apuntar fuera del directorio del plugin. Grep y Glob aplican reglas de negación Read() a archivos alcanzados vía symlinks. El scriptPath del Workflow tool también valida permisos antes de leer.",
 why:"Si usás Claude Code con plugins externos, directorios con symlinks, o en entornos donde el agente trabaja con código de terceros, actualizá: estos bypasses existían en todas las versiones anteriores.",
 more:{detail:"Los cuatro fixes de seguridad de v2.1.251 apuntan a bypasses de la sandbox de permisos. (1) File tool TOCTOU fix: las herramientas Read, Write y Edit verificaban permisos sobre la ruta normalizada, pero si un symlink era intercambiado entre el chequeo y el acceso, el agente podía leer/escribir fuera de los directorios permitidos. El fix aplica la validación sobre el destino del symlink en el momento del acceso. (2) Plugin command scope: los plugins del marketplace definían comandos que podían referenciar paths fuera del directorio del plugin; ahora se rechazan. (3) Workflow scriptPath: el Workflow tool leía scriptPath sin verificar permisos sobre el path destino; ahora verifica antes de leer. (4) Grep/Glob symlink resolution: Grep y Glob aplicaban reglas de negación sobre los paths de búsqueda pero no sobre los targets de symlinks encontrados durante la búsqueda; el fix aplica las reglas también sobre los destinos. Ninguno requiere configuración: son fixes automáticos al actualizar.",
   code:["# Actualizar a v2.1.251 para obtener los fixes:","claude update","","# Verificar versión instalada:","claude --version","","# Los fixes son transparentes: no requieren cambios de configuración.","# Plugins, Grep, Glob y herramientas de archivo se comportan","# correctamente con symlinks sin ninguna setting adicional."],
   links:[["Changelog Claude Code v2.1.251","https://code.claude.com/docs/en/changelog"]]}},
{date:"2026-08-27",tag:"claude code",tagc:"clay",fresh:false,
 title:"v2.1.248: modo `--restricted` para deployments seguros de Claude Code",
 body:"La v2.1.248 agrega el flag `--restricted`: al activarlo, Claude Code elimina las herramientas que ejecutan comandos y código (Bash, Task y similares), quita el acceso web vía WebFetch, restringe las herramientas de archivo al directorio de trabajo y rechaza cualquier intento de activar bypassPermissions. Pensado para contextos donde querés que Claude analice o documente código sin poder ejecutar nada. En el mismo release llegan mejoras de rendimiento en el Workflow tool y correcciones de pérdida de contexto en extended-thinking.",
 why:"Si usás Claude Code en pipelines de revisión de código, en entornos educativos o con código de terceros, `--restricted` te da un sandbox real sin tener que deshabilitar herramientas de a una.",
 more:{detail:"El modo --restricted es el nivel más restrictivo de Claude Code hasta la fecha, pensado para contextos donde querés lectura y análisis sin ejecución. Específicamente: elimina Bash, Task y cualquier herramienta integrada que ejecute comandos o código; elimina WebFetch para que no acceda a URLs externas; restringe las herramientas de archivo (Read, Write, Edit, Glob, Grep) al directorio de trabajo actual, sin poder salir de él; y rechaza cualquier petición de activar bypassPermissions aunque el agente lo solicite. También llega en v2.1.248: el flag `claude self-hosted-runner --client-label <label>` para identificar runners por nombre en entornos enterprise, el comando `/usage-credits` para ver créditos de uso en planes Enterprise, diagnósticos de configuración administrada del servidor, y mejoras de rendimiento en el Workflow tool. Correcciones: pérdida de contexto en extended-thinking, problemas de sesiones en Desktop y errores de inicio de sesión.",
   code:["# Arrancar Claude Code en modo restringido:","claude --restricted","","# Combinar con headless para análisis sin ejecución:","claude --restricted -p 'revisá este código y documentá las funciones públicas'","","# O activarlo por proyecto en .claude/settings.json:","{ \"restricted\": true }"],
   links:[["Changelog Claude Code v2.1.248","https://code.claude.com/docs/en/changelog"]]}},
{date:"2026-08-27",tag:"claude code",tagc:"clay",fresh:false,
 title:"v2.1.248: SendMessage y ListAgents para coordinar sesiones de Claude Code entre sí",
 body:"La v2.1.248 formaliza la mensajería entre sesiones: la herramienta SendMessage permite que un agente le mande mensajes a otra sesión activa (en el mismo equipo, en la nube o vía Remote Control), y ListAgents enumera las sesiones disponibles para contactar, diferenciando sesiones locales, en nube y de Remote Control. Abre la puerta a orquestación multi-sesión real sin infraestructura adicional de mensajería.",
 why:"Si construís pipelines multi-agente con Claude Code, ahora podés coordinar sesiones entre sí directamente desde el agente, sin necesitar un sistema externo de colas o mensajería.",
 more:{detail:"SendMessage y ListAgents son dos herramientas nuevas disponibles para los agentes dentro de Claude Code. ListAgents enumera todas las sesiones activas del usuario: sesiones locales en la misma máquina, sesiones en la nube de claude.ai, y sesiones remotas vía Remote Control; cada entrada incluye nombre, tipo y estado. SendMessage permite enviarle un mensaje a cualquier sesión listada por nombre; la sesión receptora lo recibe como nuevo turno y puede responder. El caso de uso principal es la orquestación multi-agente desacoplada: un agente orquestador puede invocar sesiones especializadas (una para testing, otra para documentación, otra para revisión de seguridad) y coordinar sus respuestas sin compartir contexto manualmente. La mensajería es asincrónica y unidireccional por defecto, aunque el receptor puede responder al sender usando el mismo mecanismo. Esta funcionalidad expande lo que antes era solo ListAgents para distinguir tipos de sesión (ya disponible desde v2.1.229) hacia una comunicación activa entre sesiones.",
   code:["# Dentro de una sesión de Claude Code, como agente:","# Listar sesiones disponibles:","# ListAgents()  →  [{name: 'session-123', status: 'cloud'}, ...]","","# Enviar mensaje a otra sesión:","# SendMessage({to: 'session-123', message: 'revisá el archivo auth.py'})","","# Patrones de uso: orquestador → agente especializado","# agente principal → sesión de tests → sesión de revisión"],
   links:[["Changelog Claude Code v2.1.248","https://code.claude.com/docs/en/changelog"]]}},
{date:"2026-08-26",tag:"claude code",tagc:"clay",fresh:false,
 title:"v2.1.247: `/claude-api cost-optimize` para perfilar y optimizar el gasto en la API",
 body:"La v2.1.247 agrega `/claude-api cost-optimize`: un subcomando que analiza el patrón de uso de la API de Claude en tu proyecto, identifica las palancas de optimización de costo disponibles (prompt caching, batch API, cambio de modelo, reducción de contexto) y muestra cuánto podrías ahorrar en cada una. También llega la herramienta SendFeedback para que Claude redacte reportes de feedback que el usuario puede revisar y enviar, y soporte mejorado para badges de GitLab MR en el footer.",
 why:"Si el gasto en la API de Claude es una variable importante de tu proyecto, este subcomando te da un diagnóstico accionable sin tener que revisar los logs de facturación a mano.",
 more:{detail:"/claude-api cost-optimize analiza el uso de la API de Claude en el proyecto actual: revisa los patrones de llamadas, el tamaño de los prompts, la tasa de cache hits, la distribución de tokens entre input/output/cache y la elección de modelo; luego mapea cada vector de ahorro disponible con una estimación del impacto potencial. Las palancas típicas que evalúa incluyen: activar prompt caching si no está configurado, mover requests batch-compatibles a la Batch API (hasta 50% de descuento), bajar el modelo en tasks que no necesitan el más capaz, reducir contexto de sistema redundante, o usar streaming para evitar timeouts que fuerzan reintentos. El subcomando es parte de la familia /claude-api (que ya incluía /claude-api upgrade para migrar de SDK 0.x a 1.x). También llega en v2.1.247: SendFeedback, una herramienta que permite a Claude redactar un borrador de reporte de feedback estructurado (bug, feature request, etc.) para que el usuario lo revise y decida si enviarlo; y tips personalizados para organizaciones, que pueden rotar sus propios mensajes de tips en la interfaz.",
   code:["/claude-api cost-optimize","# Analiza el proyecto actual y lista las palancas de ahorro","# con estimación de impacto para cada una","","# Ejemplo de output:","# ✓ Prompt caching: no configurado → ahorro potencial 40%","# ✓ Batch API: 60% de requests elegibles → ahorro potencial 30%","# ✓ Modelo: tasks simples usando Sonnet 5 → considerar Haiku 4.5","","# El diagnóstico es de solo lectura; no hace cambios automáticos"],
   links:[["Changelog Claude Code v2.1.247","https://code.claude.com/docs/en/changelog"]]}},
{date:"2026-08-25",tag:"claude code",tagc:"clay",fresh:false,
 title:"v2.1.243: modelPicker, modelPricing y promptCacheTtl para control total desde la config de org",
 body:"La v2.1.243 suma tres settings de organización con impacto directo en costo y control. `modelPicker` dejás elegir qué modelos aparecen (y en qué orden) en el picker de /model, incluyendo IDs de Vertex o Bedrock. `modelPricing` permite definir los precios contractuales de tu org para que /cost y el statusline muestren números reales en lugar del list price. `promptCacheTtl` y `subagentPromptCacheTtl` separan el TTL del caché de la conversación principal (1 hora) del de los subagentes (5 minutos), optimizando el gasto en prompt caching según el uso real. También llega sign-in sin API key vía /login → Anthropic Console para orgs que no quieren distribuir claves.",
 why:"Si administrás Claude Code para un equipo, estas settings permiten mostrar los modelos correctos, calcular el costo real (no el precio de lista) y afinar el prompt caching según el patrón de uso de cada rol.",
 more:{detail:"Con modelPicker podés definir una lista ordenada y etiquetada de modelos que aparecen en /model, incluyendo cualquier ID de modelo (IDs de Vertex, Bedrock o custom) que no están en el lineup built-in; la lista se puede agregar al final de la built-in o reemplazarla. modelPricing, disponible como managed setting de organización, permite definir los precios contractuales (por token, con multiplicadores de descuento) por modelo: /cost, el statusline y los datos de telemetría usarán esos precios en lugar del list price de Anthropic. promptCacheTtl y subagentPromptCacheTtl permiten, para usuarios de API key y cloud providers, separar el TTL del caché del hilo principal (1 hora, ideal para conversaciones largas) del de los subagentes (5 minutos, el default antiguo), equilibrando costo de cache write contra savings en sesiones largas. El sign-in sin API key via /login → Anthropic Console permite a orgs que prohíben compartir claves API dar acceso a Claude Code usando autenticación del Console directamente.",
   code:["# modelPicker en settings.json (org o proyecto):","{ \"modelPicker\": [","   { \"id\": \"claude-opus-5\", \"label\": \"Opus 5\" },","   { \"id\": \"claude-sonnet-5\", \"label\": \"Sonnet 5\" },","   { \"id\": \"us.anthropic.claude-opus-4-7\", \"label\": \"Opus 4.8 (Bedrock)\" }","  ] }","","# modelPricing (managed setting de org):","{ \"modelPricing\": {","   \"claude-opus-5\": { \"inputMtokens\": 10.0, \"outputMtokens\": 50.0 }","  } }","","# promptCacheTtl para API key/cloud provider:","{ \"promptCacheTtl\": 3600, \"subagentPromptCacheTtl\": 300 }"],
   links:[["Changelog Claude Code v2.1.243","https://code.claude.com/docs/en/changelog"]]}},
{date:"2026-08-25",tag:"claude code",tagc:"clay",fresh:false,
 title:"v2.1.243: binario 4× más liviano (75 MB), inicio más rápido y 40-70 MB menos de RAM por sesión",
 body:"La v2.1.243 trae mejoras de rendimiento que impactan en el día a día. El binario de Linux x64 bajó de 340 MB a 75 MB gracias a compresión zstd nativa. El sandbox y el arranque de servidores MCP dejaron de bloquear el primer frame: la UI ya está disponible mientras los procesos de fondo terminan de arrancar. Cada sesión consume 40-70 MB menos de RAM gracias a carga de código on-demand. Las sesiones largas también mejoran: el garbage collection se dispara antes, evitando picos de memoria sostenidos.",
 why:"Menos RAM por sesión y arranque más rápido son directamente perceptibles en máquinas con muchas sesiones abiertas o en entornos con recursos limitados (CI, containers).",
 more:{detail:"Los tres vectores de mejora de rendimiento de v2.1.243 son independientes. La reducción del binario de 340 MB a 75 MB (zstd) aplica al instalador nativo de Linux x64 y reduce tiempo y ancho de banda de las actualizaciones; en macOS el impacto es menor por la diferencia de packaging. La mejora de startup elimina el bloqueo síncrono de sandbox y MCP en el primer frame: antes, la UI esperaba a que todos los MCP servers arrancaran antes de mostrar el prompt; ahora la interfaz aparece de inmediato y los servidores se conectan en paralelo. La reducción de 40-70 MB por sesión viene de mover módulos a carga on-demand: el código de features que no se usan en esa sesión no se carga en memoria. El garbage collection más agresivo en sesiones largas previene la acumulación de objetos que en versiones anteriores terminaba en picos de uso sostenido pasadas las 2-3 horas de sesión.",
   code:["# Ver versión instalada:","claude --version","","# Actualizar a v2.1.243:","claude update","","# En CI/CD: el instalador nativo es ahora significativamente más liviano","# curl -fsSL https://code.claude.com/install.sh | sh","","# Ver MCP servers conectados (ya no bloquean el arranque):","# /mcp dentro de una sesión activa"],
   links:[["Changelog Claude Code v2.1.243","https://code.claude.com/docs/en/changelog"]]}},
{date:"2026-08-21",tag:"claude code",tagc:"clay",fresh:false,
 title:"v2.1.239: `/claude-api upgrade` para migrar proyectos Python de SDK 0.x a 1.x",
 body:"La v2.1.239 agrega el subcomando `/claude-api upgrade`: analizá tu proyecto Python, mostrá los cambios necesarios y aplicalos automáticamente para migrar de la biblioteca anthropic 0.x a la 1.x. En el mismo release llega el renderer fullscreen a Bedrock, Vertex y Foundry (antes solo estaba en sesiones directas). Las estimaciones de costo en workspaces con data-residency en US ya suman el premium de 1.1×, y las builds Alpine/musl suman soporte nativo para image paste, clipboard y captura de audio.",
 why:"Si tenés proyectos Python con la SDK antigua de Anthropic, este comando automatiza la migración a la API 1.x sin editar cada archivo a mano.",
 more:{detail:"El subcomando `/claude-api upgrade` (disponible dentro de una sesión de Claude Code) analiza el código del repositorio en busca de patrones de la SDK anthropic 0.x (el cliente antiguo, los parámetros deprecados, las llamadas a `completion` en lugar de `messages`), muestra un diff de los cambios propuestos y los aplica con tu aprobación. Es la herramienta oficial para proyectos que todavía usan la biblioteca 0.x y quieren mover a la 1.x sin hacer el trabajo manual archivo por archivo. El renderer fullscreen (la interfaz de pantalla completa con panel de herramientas y barra de estado) ya está disponible en Bedrock, Vertex AI, Microsoft Foundry y otros gateways: antes solo funcionaba en sesiones directas contra la API de Anthropic. Las builds Alpine/musl (usadas en containers Docker minimalistas) reciben soporte nativo para captura de imágenes, clipboard de sistema y los add-ons de captura de audio. Las estimaciones de costo en el panel de Stats ahora incluyen el premium de 1.1× que aplica Anthropic a los workspaces con data-residency en US, haciendo más precisas las proyecciones de gasto.",
   code:["/claude-api upgrade","# Analiza el repo, muestra el diff y pregunta si aplicar los cambios","","# El fix es incremental: podés correrlo en cada archivo o todo el repo","# Claude aplica solo los cambios que aprobás"],
   links:[["Changelog Claude Code v2.1.239","https://code.claude.com/docs/en/changelog"]]}},
{date:"2026-08-20",tag:"claude code",tagc:"clay",fresh:false,
 title:"v2.1.237/238: estilo 'Concise' nativo y fix de prompt caching en gateways LLM propios",
 body:"La v2.1.237 suma el estilo de salida incorporado 'Concise': Claude arranca directo con el resultado sin preámbulo. El mismo release corrige un bug donde las sesiones con gateway LLM personalizado o URL base propia invalidaban el caché de prompts por completo en cada respuesta, desperdiciando cache write tokens y multiplicando el costo. La v2.1.238 suma keybindingFlavor:readline para que Ctrl+W elimine hasta el espacio anterior, y proxy-authorization-command para gateways con autenticación rotativa.",
 why:"El fix de caching es urgente si usás Claude Code detrás de un proxy LLM propio: el bug te cobraba como si no tuvieras caché activado.",
 more:{detail:"La v2.1.237 cierra un bug que afectaba a toda configuración que usara apiBaseUrl, --gateway, o cualquier URL base personalizada para la inferencia: el prompt caching se invalidaba por completo en cada turno, lo que significaba que cada respuesta pagaba caching completo en lugar de cache read. El fix es transparente: actualizás y el caching vuelve a funcionar. El estilo 'Concise' se agrega al menú de estilos de salida (disponible en /config bajo 'Output style'): al activarlo, Claude omite frases de apertura y encabezados explicativos, arrancando directo con el resultado; ideal para sesiones en modo scripting. La v2.1.238 introduce keybindingFlavor: 'readline' (en settings.json) para que Ctrl+W elimine hasta el espacio anterior en lugar de borrar todo el prompt, igualando el comportamiento de terminales Unix estándar. También llega --proxy-authorization-command y --proxy-authorization-file para gateways con autenticación rotativa (ej: tokens de AWS SigV4 o credenciales de corta duración): Claude Code corre el comando antes de cada request y usa el output como Authorization header.",
   code:["# Activar el estilo Concise desde /config o settings.json:","{ \"outputStyle\": \"concise\" }","","# keybindingFlavor readline (Ctrl+W borra hasta el espacio anterior):","{ \"keybindingFlavor\": \"readline\" }","","# Proxy con autenticación rotativa:","claude --proxy-authorization-command 'mi-comando-que-devuelve-el-token'","# o con archivo de script:","claude --proxy-authorization-file /ruta/a/auth-script.sh","","# El fix de caching es automático al actualizar:","claude update"],
   links:[["Changelog Claude Code","https://code.claude.com/docs/en/changelog"]]}},
{date:"2026-08-20",tag:"skills",tagc:"pine",fresh:false,
 title:"`headersHelper` en plugins: tokens dinámicos por request para autenticación rotativa",
 body:"Los plugin manifests de marketplace suman la propiedad `headersHelper`: un comando local que el plugin corre antes de cada request HTTP y cuyo output JSON se inyecta como headers. Resolve el caso de APIs que usan tokens efímeros (JWT, AWS SigV4, OAuth de corta duración): en lugar de hardcodear credenciales estáticas en el manifest, el plugin pide un token fresco antes de cada llamada.",
 why:"Los plugins que se autentican contra APIs con tokens rotativos ya no necesitan un workaround manual: `headersHelper` rota los headers automáticamente sin tocar el manifest.",
 more:{detail:"La propiedad headersHelper en los plugin manifests de marketplace permite definir un comando local que se ejecuta antes de cada request HTTP que hace el plugin. El comando imprime un objeto JSON de headers en stdout, y esos headers se fusionan con los headers estáticos del manifest para ese request. Es la solución oficial para autenticación con tokens efímeros: en lugar de exponer un token estático en el archivo de configuración del plugin (que puede expirar o ser comprometido), el plugin llama a un comando del sistema que genera un token fresco. Casos de uso típicos: tokens AWS SigV4 via `aws sts`, tokens OAuth via `gcloud auth print-access-token`, tokens de APIs internas que expiran cada N minutos, o cualquier credencial rotativa que el sistema ya sabe cómo obtener. El comando corre con los mismos permisos que Claude Code y el output solo se loguea en modo debug para no exponer tokens en los transcripts.",
   code:["# En el manifest del plugin (plugin.json):","# {","#   \"name\": \"mi-api-plugin\",","#   \"http\": {","#     \"baseUrl\": \"https://api.ejemplo.com\",","#     \"headersHelper\": {","#       \"command\": \"mi-comando-que-devuelve-json-de-headers\"","#     }","#   }","# }","","# El comando corre antes de cada request HTTP del plugin","# Output esperado: { \"Authorization\": \"Bearer abc123\" }"],
   links:[["Changelog Claude Code v2.1.238","https://code.claude.com/docs/en/changelog"]]}},
{date:"2026-08-18",tag:"claude code",tagc:"clay",fresh:false,
 title:"v2.1.235: spellcheck en el prompt, GitLab MR badge y sesiones en nube más livianas",
 body:"La v2.1.235 trae mejoras de calidad de vida para el día a día con Claude Code. Podés activar un corrector ortográfico opcional (aspell, hunspell o ispell) que subraya los errores mientras escribís el prompt. Se sumó el estado del MR de GitLab en el footer/statusline con íconos de borrador, pendiente y verde. Las sesiones en nube largas como /ultrareview y /autofix-pr consumen menos memoria y CPU. El grep nativo ya no se come la memoria en patrones patológicos y falla rápido en lugar de colgarse.",
 why:"Si trabajás con GitLab o corrés sesiones largas en la nube, esta versión mejora la experiencia directamente sin ningún cambio de configuración.",
 more:{detail:"La v2.1.235 es una versión de pulido con mejoras de rendimiento y calidad de vida. El corrector ortográfico opcional usa los diccionarios del sistema (aspell, hunspell o ispell) y subraya palabras mal escritas en tiempo real mientras escribís el prompt; se activa/desactiva con la setting 'spellcheck' en /config o en settings.json. El badge de GitLab MR en el footer y statusline muestra el número del merge request (!N) junto con su estado visual: borrador, pendiente de revisión, o verde (listo para merge). La mejora de rendimiento en sesiones nube impacta en comandos desatendidos como /ultrareview y /autofix-pr que corrían con uso elevado de CPU/memoria. El grep embebido en los builds nativos de macOS y Linux ahora falla rápido ante patrones patológicos (ej: expresiones con backtracking catastrófico) en vez de agotar la memoria. También se corrigió que los slash commands mostraban entidades HTML cuando se ejecutaban mientras Claude respondía.",
   code:["# Activar spellcheck en settings.json:","{ \"spellcheck\": true }","","# O desde /config en la sesión interactiva","","# GitLab MR badge: aparece automático si tenés glab autenticado","# Muestra: !123 (draft) / !123 (pending) / !123 ✓"],
   links:[["Changelog Claude Code v2.1.235","https://code.claude.com/docs/en/changelog"]]}},
{date:"2026-08-17",tag:"claude code",tagc:"clay",fresh:false,
 title:"v2.1.234: auto-reanudación al resetear el límite, fix crítico de auto mode y claude-api 8× más liviana",
 body:"La v2.1.234 trae cambios importantes para builders. Las sesiones se reanudan solas cuando se resetea el límite de uso de claude.ai (configurable en /config). Se corrige un bug donde auto mode en sesiones largas, después de una compactación, denegaba sistemáticamente el acceso a red de los comandos sandboxeados. La skill claude-api bajó de ~200K a ~25K tokens de contexto (carga 8 veces más barata). También podés abrir /permissions mientras Claude está trabajando y los cambios aplican al turno en curso.",
 why:"El fix de auto mode en sesiones largas es urgente si usás pipelines desatendidos que procesan muchos archivos o hacen muchas llamadas: después de compactar, los comandos de red fallaban silenciosamente.",
