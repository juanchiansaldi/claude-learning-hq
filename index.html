{cat:"Kickoff",tag:"clay",title:"Kickoff seguro 0→1 (el prompt madre)",desc:"Arranca cualquier proyecto nuevo con la capa de seguridad puesta desde el commit 1.",
text:`Vas a arrancar un proyecto nuevo desde cero. Antes de escribir código, hacé estas 3 cosas en orden:

1. PREGUNTAME lo que necesites para entender el producto (público, features core del MVP, si hay pagos, si hay datos sensibles). No asumas nada importante.
2. PROPONÉ un plan de arquitectura en PLAN.md y esperá mi OK antes de implementar.
3. RECIÉN AHÍ implementá la base con este stack y estándares NO NEGOCIABLES:

STACK
- Next.js (App Router) + TypeScript estricto (strict:true, sin any)
- Supabase: Postgres + Auth + Storage · Tailwind · deploy a Vercel · repo GitHub con .gitignore correcto desde el primer commit

SEGURIDAD (implementar TODO, no "después")
- RLS habilitado en TODAS las tablas, con policies escritas y testeadas.
- Validación con Zod en todo input: forms, API routes y server actions.
- .env.local + .env.example documentado. NUNCA commitear secrets. service_role key solo server-side.
- Verificación de sesión en el SERVIDOR (middleware + checks por ruta).
- Headers de seguridad en next.config: CSP, HSTS, X-Frame-Options DENY, nosniff, Referrer-Policy.
- Rate limiting en endpoints sensibles. Sanitizar contenido de usuarios (XSS). npm audit limpio.

CALIDAD: ESLint + Prettier. README con la estructura. CLAUDE.md con las reglas. Commits chicos en español.

Al terminar: resumen de qué creaste, las policies de RLS, y un checklist de seguridad marcado.`},
{cat:"Kickoff",tag:"clay",title:"CLAUDE.md base (memoria permanente)",desc:"Las reglas que Claude respeta en TODAS las sesiones del proyecto. Pedile que lo guarde como CLAUDE.md.",
text:`Creá un archivo CLAUDE.md en la raíz del proyecto con este contenido (adaptá el stack al repo):

# Reglas del proyecto

## Protección de archivos — CRÍTICO
- NUNCA borres archivos sin pedirme confirmación explícita.
- NUNCA modifiques: .env*, migraciones aplicadas, configs de CI/CD, ni nada en /docs/decisiones.
- NUNCA uses comandos destructivos (rm -rf, git push --force, git reset --hard, DROP TABLE, TRUNCATE) sin mi confirmación en ese momento.
- Si un cambio afecta más de 5 archivos, mostrame el plan primero y esperá mi OK.
- Antes de algo riesgoso, sugerí crear una rama o commit de respaldo.

## Seguridad
- Todo input se valida con Zod. Toda tabla nueva nace con RLS habilitado.
- Jamás hardcodear secrets. Queries con datos de usuario siempre parametrizadas. Auth se verifica en el servidor.

## Estilo
- TypeScript estricto, prohibido "any". Componentes chicos. Justificá cada dependencia nueva.

## Flujo
- Commits chicos en español (feat/fix/refactor/chore). Siempre rama + PR. Al terminar: lint + typecheck + tests.

## Comunicación
- Si algo es ambiguo, preguntá antes de asumir. Si ves un problema de seguridad, avisá aunque no sea la tarea.`},
{cat:"Seguridad",tag:"rust",title:"Guardarraíles anti-destrucción",desc:"Para un proyecto en curso sin reglas. Frena borrados, cambios masivos y comandos peligrosos.",
text:`A partir de ahora operás bajo estas reglas. Confirmá que las entendiste y agregalas a CLAUDE.md (crealo si no existe):

1. ARCHIVOS INTOCABLES sin mi confirmación: .env y variantes, migraciones aplicadas, configs de deploy/CI, package-lock.json (salvo instalar algo), y cualquier archivo no relacionado con la tarea actual.
2. COMANDOS PROHIBIDOS sin confirmación caso por caso: rm -rf, git push --force, git reset --hard, git clean, DROP/TRUNCATE/DELETE sin WHERE, y todo lo que toque producción.
3. ALCANCE: trabajá SOLO en los archivos necesarios. Si hay que tocar algo más, decime qué y por qué.
4. ANTES de refactors o cambios en +5 archivos: plan corto → mi OK → ejecutás.
5. RED DE SEGURIDAD: antes de cambios grandes, commit de respaldo o rama nueva.
6. Si rompés algo: avisá qué se rompió y el camino de vuelta (no lo tapes con más cambios).`},
{cat:"Seguridad",tag:"rust",title:"Auditoría de seguridad (OWASP Top 10)",desc:"Revisión completa en modo solo-lectura, con hallazgos priorizados y fix con tu OK.",
text:`Hacé una auditoría de seguridad completa. Modo SOLO LECTURA primero: no cambies nada hasta que apruebe.

FASE 1 — RELEVAMIENTO: rutas/endpoints, auth y sesiones, queries a DB, uploads, variables de entorno, dependencias.
FASE 2 — AUDITORÍA (OWASP Top 10): inyección (SQL/comandos por concatenación), auth rota (¿sesión verificada en server en TODAS las rutas?), exposición de datos (campos de más, secrets en código/historial), RLS tabla por tabla, XSS, CSRF/CORS, npm audit, rate limiting, headers.
FASE 3 — REPORTE: SECURITY_AUDIT.md con cada hallazgo: [CRÍTICO/ALTO/MEDIO/BAJO] — qué — dónde (archivo:línea) — cómo se explota — cómo se arregla.
FASE 4 — Esperá mi OK y arreglá desde los críticos, un commit por hallazgo.`},
{cat:"QA",tag:"gold",title:"QA completo: plan + tests + CI",desc:"Plan de testing, tests unitarios y E2E, todo corriendo en CI.",
text:`Armá la capa de QA completa:

1. PLAN — TESTING.md: flujos críticos, casos borde, qué se testea en qué nivel.
2. UNIT + INTEGRACIÓN — Vitest. Priorizá validaciones, lógica de negocio, transformaciones, helpers de auth.
3. E2E — Playwright para 3-5 flujos clave (registro→login→acción→logout). Incluí caso "usuario malicioso": rutas protegidas sin sesión, payloads inválidos.
4. CI — GitHub Action: lint + typecheck + tests en cada PR. No se mergea si falla.
5. Tests legibles (nombre = comportamiento en español), datos aislados (nunca producción).
Al terminar: corré la suite y mostrame resultado + qué quedó sin cubrir.`},
{cat:"Contenido",tag:"gold",title:"Voz de marca reutilizable",desc:"Definí el tono una vez y guardalo como skill para todo texto público.",
text:`Vamos a definir la voz de marca de [NEGOCIO] para que todo texto público suene igual.

{cat:"Kickoff",tag:"clay",title:"Retomar un proyecto que no conocés",desc:"Que Claude entienda el repo antes de tocar nada.",
text:`Entraste a un proyecto en curso que no conocés. ANTES de cambiar nada:

{cat:"Diaria",tag:"clay",title:"Rutina: actualizador de Novedades",desc:"El prompt que corre solo cada 3 días en la nube y mantiene esta app al día. Sirve de molde para cualquier rutina sobre un repo.",
text:`Sos el actualizador automático de la sección Novedades de Claude Learning HQ. Estás en un checkout del repo.

text:`Programá un agente en la nube que corra [CADA CUÁNTO: cada 3 días / todos los lunes 9:00] sobre este repo y haga esto:

{cat:"Diaria",tag:"slate",title:"Cierre de sesión: HQ + BrainOS",desc:"Lo último de cada sesión: reportar a la torre de control y guardar lo aprendido en el vault.",
text:`Cerramos la sesión. Antes de terminar:

{id:"web",ic:"doc",t:"Constructor de webs",s:"Webs hermosas y seguras, de 0 a deploy",
 steps:[
 {t:"Completar primero el path de Operador",s:"Sin base, construir una web es perder tiempo.",
  detail:"Construir encima de una base floja se paga caro después. Si todavía no manejás Claude Code con criterio, terminá el path de Operador antes de seguir acá.",
  steps:["Completá los 6 pasos del path 'Operador Claude Code' (la pestaña de arriba).","Confirmá que tenés los permisos seguros configurados.","Volvé a este path cuando /doctor te dé todo verde."],
  done:"Tenés el path Operador completo."},
 {t:"Usar el prompt 'Director de diseño'",s:"Pedí dirección de arte antes de que codee nada.",
  detail:"El error más común es dejar que Claude codee de una y salga una web genérica. Primero pedile que proponga opciones visuales y elegís vos. Así la web tiene carácter propio.",
  steps:["Andá a Prompts y filtrá por la categoría Web.","Copiá el prompt 'Director de diseño'.","Completá los corchetes: qué es la web, para quién, y cuál es la acción principal.","Pegáselo a Claude y mirá las 4 direcciones visuales que propone.","Elegí UNA antes de que escriba una sola línea de código."],
  go:"prompts",
  done:"Claude te propuso 4 direcciones visuales y elegiste una."},
 {t:"Arrancar con el kickoff seguro 0→1",s:"La base del proyecto con seguridad desde el commit 1.",
  detail:"Este prompt arma la base del proyecto con la seguridad ya puesta (validaciones, secrets afuera del repo, headers, sesión verificada en el servidor). Hacerlo bien al principio evita arreglos carísimos después.",
  steps:["Copiá el prompt 'Kickoff seguro 0→1' (Prompts, categoría Kickoff).","Respondé las preguntas que te haga sobre el producto (público, si hay pagos, datos sensibles).","Revisá y aprobá el PLAN.md antes de que implemente.","Dejá que arme la base; al final revisá el checklist de seguridad que te entrega."],
  go:"prompts",
  done:"El proyecto base está creado, con CLAUDE.md y el checklist de seguridad marcado."},
 {t:"Guardar el design-system como skill",s:"Que la identidad visual se aplique sola en cada pantalla.",
  detail:"Para no repetir la paleta y las tipografías en cada pantalla nueva, las guardás como una skill. Claude la carga sola cada vez que toca la UI, así todo queda consistente sin que se lo pidas.",
  steps:["Andá a la sección Skills.","Copiá el prompt de la skill 'design-system'.","Cuando Claude te pregunte, pasale la paleta y tipografías que elegiste en el paso 2.","Revisá la 'description' (qué dice cuándo se activa) antes de crear el archivo."],
  go:"skills",
  done:"Existe la carpeta .claude/skills/design-system/ y se activa al crear o modificar UI."},
 {t:"QA visual con Playwright",s:"Ver la web funcionar de verdad antes de mostrarla.",
  detail:"Antes de mostrarle la web a nadie, hay que verla andar. Playwright es un MCP que deja a Claude abrir un navegador real, recorrer tu web y sacar capturas. Así encontrás lo roto antes que el cliente.",
  steps:["Conectá el MCP de Playwright con /mcp.","Pedile a Claude que recorra el flujo principal de la web y saque screenshots de cada paso.","Mirá las capturas: ¿se ve bien en celular? ¿algo desalineado o roto?","Arreglá lo que aparezca, pantalla por pantalla."],
  code:["/mcp"],
  done:"Tenés capturas del flujo principal y arreglaste lo que estaba mal."},
 {t:"Deploy guiado + RUNBOOK",s:"Publicar ordenado, con plan de rescate.",
  detail:"Publicar bien: build limpio, ningún secret en el repo, dominio con HTTPS, y un documento de rescate (RUNBOOK) por si algo se rompe en producción. Claude te guía paso a paso.",
  steps:["Pedile el deploy guiado paso a paso (usá el prompt de abajo).","Verificá: build sin errores y ningún secret subido al repo.","Conectá el dominio y confirmá que carga con HTTPS.","Pedile que cree un RUNBOOK.md con cómo hacer rollback y a quién avisar si falla."],
  prompt:"Llevemos esto a producción ordenado. Guiame paso a paso (build limpio, secrets fuera del repo, RLS verificado en prod, dominio + HTTPS, smoke test de 3 flujos clave) y creá un RUNBOOK.md con el rollback y a quién avisar. Confirmá cada paso conmigo antes de avanzar.",
  done:"La web está online, con HTTPS, y existe un RUNBOOK.md de rescate."},
]},
{id:"agentes",ic:"agents",t:"Constructor de agentes",s:"Bots de WhatsApp e Instagram que venden",
 steps:[
 {t:"Completar el path de Operador",s:"Un agente corre solo: la base es obligatoria.",
  detail:"Un agente es un producto que funciona sin vos mirando. Si no dominás Claude Code, no vas a poder mantenerlo cuando algo falle. Base primero.",
  steps:["Completá el path 'Operador Claude Code'.","Leé en Conceptos qué es la 'API de Claude' (es el cerebro que tu agente va a usar)."],
  go:"conceptos",
  done:"Path Operador completo y entendés qué es la API de Claude."},
 {t:"Entender la arquitectura de un agente",s:"Cómo viaja un mensaje, de punta a punta.",
  detail:"Antes de codear, tenés que tener clarísimo el recorrido de un mensaje: del cliente al webhook, al cerebro (Claude), a la acción, y de vuelta. Sin ese mapa mental, te perdés en el código.",
  steps:["Andá a la sección Agentes WPP/IG.","Leé los 5 pasos del flujo de un mensaje, en orden.","Mirá las piezas que se usan (WhatsApp Cloud API, API de Claude, backend, base de datos).","Asegurate de entender qué es el 'handoff' a humano y por qué es clave."],
  go:"agentes",
  done:"Podés explicar el recorrido de un mensaje desde que el cliente escribe hasta que recibe respuesta."},
 {t:"Usar el prompt madre de WhatsApp",s:"Armar toda la arquitectura del bot con un prompt.",
  detail:"Este prompt arma la arquitectura completa del agente. Igual que con las webs: plan primero, implementación por partes. No lo dejes construir todo de una.",
  steps:["Andá a Prompts y filtrá por WhatsApp.","Copiá 'Agente de WhatsApp — arquitectura completa'.","Respondé lo que te pregunte sobre el negocio (qué hace, qué resuelve el bot, cuándo deriva).","Aprobá el PLAN.md (el flujo de un mensaje) antes de que implemente.","Dejá que lo construya por partes, con tests del webhook."],
  go:"prompts",
  done:"Tenés el PLAN.md del agente aprobado y la base armada."},
 {t:"Escribir el system prompt del bot",s:"La personalidad, los límites y el handoff.",
  detail:"El system prompt es la personalidad y las reglas del bot: cómo habla, qué sabe, qué NO puede hacer, y cuándo pasa a un humano. Es lo que separa un bot útil de uno que espanta clientes.",
  steps:["Copiá 'Personalidad y reglas del bot' (Prompts, WhatsApp).","Completá: nombre del asistente, qué vende el negocio, precios y horarios.","Definí los límites: qué no debe prometer ni inventar nunca.","Definí cuándo deriva a un humano (queja, cancelación, caso complejo).","Probalo con los 8 mensajes de prueba que te genera, incluido un cliente difícil."],
  go:"prompts",
  done:"Tenés el system prompt listo y probado con casos difíciles."},
 {t:"Conectar el MCP / webhook seguro",s:"La parte sensible: firma verificada y tokens afuera.",
  detail:"Acá está la seguridad real. El webhook que recibe los mensajes tiene que verificar la firma de Meta, y los tokens nunca van al código. Si esto está flojo, te secuestran el bot.",
  steps:["Pedile a Claude que implemente el webhook verificando la firma de Meta.","Guardá los tokens en variables de entorno, NUNCA dentro del código ni en el repo.","Respondé 200 rápido al webhook y procesá el mensaje de forma asíncrona.","Probá que un mensaje entrante llegue y dispare una respuesta."],
  done:"El webhook verifica la firma, los tokens están fuera del repo, y un mensaje de prueba recibe respuesta."},
 {t:"Probar con casos difíciles",s:"Romperlo a propósito antes de que lo haga un cliente.",
  detail:"Un bot que solo aguanta el 'hola' no sirve. Hay que estresarlo a propósito: mensajes confusos, quejas, pedidos fuera de tema. Ahí se ve si está listo.",
  steps:["Mandale mensajes confusos, quejas y pedidos fuera de tema.","Verificá que NO invente datos cuando no sabe algo.","Verificá que derive a un humano cuando corresponde.","Ajustá el system prompt según lo que falle, y volvé a probar."],
  done:"El bot maneja un cliente difícil sin inventar ni trabarse, y deriva cuando debe."},
 {t:"Guardar el estándar como skill agente-wpp",s:"Para armar el próximo cliente en una fracción del tiempo.",
  detail:"Cuando te salga bien, capturá tu forma de armar agentes en una skill. El próximo cliente lo construís muchísimo más rápido, sin reinventar nada.",
  steps:["Andá a la sección Skills.","Copiá el prompt de la skill 'agente-wpp'.","Revisá que capture tu arquitectura (webhook firmado, memoria por número, handoff a humano).","Creala y usala en el próximo proyecto."],
  go:"skills",
  done:"Existe .claude/skills/agente-wpp/ con tu estándar, listo para repetir."},
]},
{id:"dev-albor",ic:"git",t:"Dev de Albor Studio",s:"El ciclo SPECBOOT y cómo trabajamos en la agencia",
 steps:[
 {t:"Requisitos: path Operador + la app de Claude",s:"Sin esto, nada de lo que sigue funciona.",
  detail:"En Albor no programamos desde cinco ventanas de VS Code: los agentes corren desde la app de escritorio de Claude (pestaña Code), una sesión por proyecto. Esta ruta asume que ya manejás Claude Code con criterio.",
  steps:["Completá los 6 pasos del path 'Operador Claude Code'.","Instalá la app de escritorio de Claude desde claude.ai/download y entrá con tu cuenta de Anthropic (plan Pro o Max; si trabajás para Albor, Juan te da el acceso).","Abrí la pestaña Code, elegí la carpeta del proyecto y creá tu primera sesión.","Cerrá VS Code salvo que estés leyendo código a mano. Cada ventana de VS Code son cerca de 1 GB de RAM.","Verificá con /doctor que todo esté verde adentro de la app."],
  code:["claude --version","/doctor"],
  links:[["Descargar la app de Claude","https://claude.ai/download"],["Docs de Claude Code","https://code.claude.com/docs/en/overview"]],
  done:"Tenés la app abierta con una sesión en un proyecto real y /doctor en verde."},
 {t:"Los 3 pilares: herramienta, contexto y prompt",s:"El marco mental de todo lo demás.",
  detail:"Todo lo que sale mal con IA cae en uno de estos tres: elegiste mal la herramienta (modelo, CLI vs web), le diste mal el contexto (falta o sobra), o el prompt no tenía lo que hacía falta (objetivo, restricciones, criterio de terminado). Antes de culpar al modelo, revisá los tres.",
  steps:["Herramienta: Fable u Opus para diseñar y revisar, Sonnet para tareas mecánicas, Haiku para lo trivial. Cambiás con /model.","Contexto: lo que Claude lee cada sesión (CLAUDE.md, archivos con @, MCPs, skills). Si el contexto pasa del 60%, /compact. Si cambiás de tarea, /clear.","Prompt: objetivo + restricciones + criterio de terminado + formato de salida. Un prompt sin 'listo cuando' es un prompt a medias.","Leé en Conceptos: contexto, tokens, skills y harness.","Ejercicio: agarrá el último pedido que le hiciste a Claude y reescribilo con los 4 elementos del prompt."],
  go:"conceptos",
  done:"Podés explicar con un ejemplo propio qué pilar falló la última vez que Claude hizo algo mal."},
 {t:"Instalar OpenSpec y entender Spec-Driven Development",s:"La spec es la fuente de verdad, no el código.",
  detail:"Spec-Driven Development (SDD): antes de tocar código, escribís qué tiene que pasar (proposal, diseño, specs con escenarios Given/When/Then y una lista de tareas). La IA rinde muchísimo mejor con una spec que con un 'hacé el login'. Usamos OpenSpec, que lo ordena todo en la carpeta openspec/ del repo y agrega los comandos /opsx:*.",
  steps:["Instalá OpenSpec global con el comando de abajo (requiere Node 20.19 o superior).","Entrá a un repo de práctica e inicializalo para Claude, en español.","Mirá lo que creó: openspec/config.yaml, openspec/specs/ y openspec/changes/.","Leé el README de OpenSpec (10 minutos) para entender propose, apply, sync y archive.","Corré /opsx:explore en Claude y pedile que te explique con tus palabras qué es un 'change'."],
  code:["npm install -g @fission-ai/openspec@latest","openspec init --tools claude --language es","ls openspec"],
  links:[["OpenSpec en GitHub","https://github.com/Fission-AI/OpenSpec"],["SPECBOOT de LIDR (el ciclo original)","https://github.com/LIDR-academy/lidr-specboot"]],
  done:"Tenés un repo con openspec/ y los comandos /opsx:* aparecen en Claude."},
 {t:"El ciclo SPECBOOT de Albor, de punta a punta",s:"Siete pasos, siempre en el mismo orden.",
  detail:"Es el ciclo de LIDR (Álvaro Moya) adaptado a Albor: user story → refinar (/enrich-us) → proponer (/opsx:propose) → aplicar en worktree (/opsx:apply) → verificar (/verify + /adversarial-review) → cerrar (/opsx:archive + /pr-report + push) → reportar a HQ. Cada flecha tiene un gate: no se pasa al siguiente sin cumplir el anterior.",
  steps:["Leé la skill albor-specboot (vive en ~/.claude/skills/ de la máquina de Juan; pedísela si trabajás en la tuya).","Dibujá el ciclo en un papel con los 7 pasos y los gates entre cada uno.","Regla 1: un cambio después de aplicar y antes de archivar se corrige primero en la spec, nunca con un 'fix rápido'.","Regla 2: quien revisa no es quien implementó (otra sesión u otro subagente).","Regla 3: cada paso cerrado se commitea y pushea. Nada queda en la compu sin subir."],
  prompt:"Leé la skill albor-specboot y explicame el ciclo SPECBOOT con un ejemplo concreto de este repo: qué produce cada paso, qué gate hay entre pasos y en qué paso participo yo como humano.",
  done:"Podés recitar los 7 pasos y decir qué gate hay entre cada uno sin mirar."},
 {t:"Dónde vive el ticket: GitHub Issues + Projects",s:"Un issue por user story, un board con las etapas del ciclo, un PR que lo cierra.",
  detail:"En Albor el ticket no vive en un chat ni en la cabeza de nadie: es un issue de GitHub en el repo del proyecto, creado con la plantilla 'User story'. El board de Projects muestra en qué paso del ciclo está cada uno. La rama, el cambio de OpenSpec y el PR llevan el número del issue, así todo queda trazable sin esfuerzo.",
  steps:["Creá el issue con la plantilla 'User story' (link abajo): Como/quiero/para, criterios de aceptación, fuera de alcance y talla. La plantilla le pone sola la etiqueta user-story.","Agregalo al board 'Albor Studio · Tickets' en la columna Backlog. Cuando lo refinás con /enrich-us pasa a Refinada; con la propuesta aprobada, a En desarrollo; después Verificación, Review y Done.","Nombrá todo con el número del issue: rama feat/<n>-<slug>, cambio de OpenSpec <n>-<slug>, y en el PR la línea 'Closes #<n>' para que se cierre solo al mergear.","Los comentarios técnicos van en el issue o en el PR, no por WhatsApp. Lo que no está escrito ahí no existe.","Regla: un issue por user story. Si mezcla dos cosas, se parte en dos."],
  code:["gh issue list -R juanchiansaldi/jca-studio --label talla:S","gh issue view 12 -R juanchiansaldi/jca-studio","git checkout -b feat/12-email-despacho","/enrich-us #12"],
  links:[["Crear un issue en jca-studio","https://github.com/juanchiansaldi/jca-studio/issues/new/choose"],["Tus boards de Projects","https://github.com/users/juanchiansaldi/projects"]],
  done:"Tu ticket es un issue con plantilla, talla y columna en el board, y sabés cómo lo cierra el PR."},
 {t:"Pasos 1 y 2: escribir y refinar la user story con /enrich-us",s:"De 'quiero un login' a algo implementable sin preguntas.",
  detail:"Una user story cruda es ambigua. /enrich-us la audita contra una checklist (funcionalidad completa, campos, endpoints, archivos, tests, no funcionales, definition of done) y devuelve Original + Enriquecida con criterios Given/When/Then. Eso es lo que entra a OpenSpec.",
  steps:["Elegí un issue chico del board (talla:S) o creá uno para practicar con la plantilla User story.","Confirmá que la historia tenga la forma 'Como <rol> quiero <acción> para <valor>'.","Corré /enrich-us #<n>: lee el issue solo. También podés pegarle la historia.","Leé la versión Enriquecida: marcá qué te faltaba (casi siempre: errores, seguridad y qué NO entra).","Resolvé lo marcado como [CONFIRMAR] y guardá el resultado: es la entrada del paso siguiente."],
  code:["/enrich-us #12","/enrich-us Como cliente quiero recibir un email cuando mi pedido se despacha para saber que está en camino"],
  done:"Tenés una user story enriquecida con criterios Given/When/Then y definition of done."},
 {t:"Paso 3: proponer con /opsx:propose y aprobar el diseño",s:"Los artefactos de la propuesta antes de una línea de código.",
  detail:"/opsx:propose crea openspec/changes/<nombre>/ con proposal.md (qué y por qué), design.md (cómo), specs/ (deltas: qué se agrega, cambia o saca) y tasks.md (la lista de tareas). Acá es donde el humano invierte tiempo: leer y corregir el diseño es diez veces más barato que corregir código.",
  steps:["Corré /opsx:propose <nombre-del-cambio> pasándole la user story enriquecida.","Leé proposal.md: ¿resuelve el 'para qué'? ¿Está claro qué NO entra?","Leé design.md: ¿usa el stack y los patrones del repo? ¿Toca la base de datos? ¿Cómo maneja errores?","Leé tasks.md: ¿las tareas son chicas (menos de una hora cada una)? ¿Cada una tiene su test?","Si algo no cierra, /opsx:update con lo que cambiás. Recién con el diseño aprobado se pasa a aplicar."],
  code:["/opsx:propose email-despacho-pedido","/opsx:update"],
  done:"Existe openspec/changes/<nombre>/ con los 4 artefactos y aprobaste el diseño a conciencia."},
 {t:"Paso 4: worktree + /opsx:apply con TDD",s:"Implementar aislado, con el test antes del código.",
  detail:"Un worktree es una copia de trabajo del repo en otra carpeta, con su propia rama. Permite que varios agentes (o vos y un agente) trabajen en paralelo sin pisarse. Adentro, /opsx:apply recorre tasks.md: para cada tarea el test primero (rojo), el código después (verde), refactor, y tilda la tarea.",
  steps:["Desde la app de Claude, creá la sesión con worktree (la app lo hace sola) o, en la terminal, claude --worktree <nombre>.","Verificá con git branch --show-current que estás en la rama nueva, no en main.","Corré /opsx:apply. Mirá que cada tarea arranque con un test que falla.","Si Claude codea sin test, frenalo (Esc) y recordale TDD.","Commit al terminar cada tarea, no al final del día. Push de la rama."],
  code:["claude --worktree email-despacho","git branch --show-current","/opsx:apply"],
  done:"tasks.md está 100% tildado, en una rama propia, con tests verdes y commits pusheados."},
 {t:"Paso 5a: verificar de verdad con /verify",s:"Tests, build y navegador real. 'Debería funcionar' no existe.",
  detail:"/verify corre lo estático (typecheck, lint), los tests, el build y, si hay UI, abre la app en un navegador real con Playwright y hace el flujo completo mirando la consola. Escribe testing-report.md con evidencia por criterio de aceptación. Sin evidencia, el criterio está en rojo.",
  steps:["Corré /verify en la rama del cambio.","Mirá testing-report.md: cada criterio Given/When/Then tiene que tener una evidencia (test o captura).","Si hay rojo, arreglá (en la spec primero si es un cambio de comportamiento) y volvé a correr.","Probá vos también el flujo en el navegador, en mobile y desktop.","No debilites lint ni tests para pasar. Se arregla el código."],
  code:["/verify","pnpm build"],
  done:"testing-report.md dice VERDE y viste el flujo andar en el navegador."},
 {t:"Paso 5b: review adversarial en otra sesión",s:"Quien implementó no revisa. Que otro intente romperlo.",
  detail:"El mismo agente que escribió el código tiende a aprobarlo (sesgo auto-preferencial). Por eso el review lo hace una sesión limpia con /adversarial-review: asume que hay fallas, ataca supuestos (datos, autorización, doble submit, estados vacíos), compara spec contra código y da un veredicto PASS, PASS CON GAPS o FAIL.",
  steps:["Abrí una sesión nueva (o /clear) en el mismo repo y rama.","Corré /adversarial-review <nombre-del-cambio>.","Leé la tabla de hallazgos: Blocker y Major se arreglan sí o sí antes de seguir.","Cada fix vuelve por el ciclo: spec (si cambia comportamiento), código, /verify.","Cuando el veredicto es PASS, recién ahí se archiva."],
  code:["/clear","/adversarial-review email-despacho-pedido"],
  done:"Tenés un review con veredicto PASS y los hallazgos Major y Blocker resueltos."},
 {t:"Pasos 6 y 7: archivar, PR con /pr-report y reportar a HQ",s:"Cerrar el ciclo deja rastro: spec archivada, PR legible, HQ al día.",
  detail:"/opsx:archive mueve el cambio a openspec/changes/archive/ y sincroniza los specs principales (la documentación queda actualizada sola). /pr-report escribe la descripción del PR para un humano en 150 a 300 palabras. El push a la rama de producción deploya en Vercel. Y hq report deja el trabajo registrado en la torre de control.",
  steps:["Corré /opsx:archive: confirmá que los specs principales absorbieron el delta.","Corré /pr-report y creá el PR con gh pr create.","Pedí review a Juan (o al tech lead) con el link del PR.","Cuando se mergea: push a main = deploy en Vercel. Verificá la URL de producción.","Cerrá la sesión reportando a HQ: hq report <slug> --done ... --note ..."],
  code:["/opsx:archive","/pr-report","gh pr create --fill","~/Desktop/HQ/bin/hq report albor-studio --done \"email de despacho\" --note \"ciclo completo\""],
  done:"El cambio está archivado, el PR tiene descripción humana y HQ registra la sesión."},
 {t:"Subagentes y paralelismo sin fundir la compu",s:"Más agentes, no más ventanas.",
  detail:"Un subagente es otro Claude con contexto propio que recibe una tarea acotada y devuelve un resultado (explorar un repo, revisar un diff, correr tests). Se lanzan desde la misma sesión, en paralelo, y cada uno es un proceso liviano de Node. Lo que funde la máquina son las ventanas de VS Code y los dev servers huérfanos, no los agentes.",
  steps:["Pedile a Claude que lance 2 subagentes en paralelo con tareas independientes (uno mapea el backend, otro el frontend) y que sintetice.","Para trabajo largo desatendido, delegá a prime-agent con un gate (--autonomous-gate 'pnpm build').","Para sesiones paralelas sobre el mismo repo: una sesión por worktree, nunca dos sesiones editando la misma rama.","Al cerrar una sesión: matá el dev server (lsof -i :3000) y cerrá la pestaña.","Mirá el Monitor de Actividad: si el swap pasa de 3 GB, cerrá ventanas de VS Code, no sesiones de Claude."],
  prompt:"Lanzá dos subagentes en paralelo: uno que mapee la estructura del backend (rutas, servicios, modelos) y otro que mapee el frontend (páginas, componentes, estado). Cuando terminen, sintetizá en un solo documento docs/MAPA.md con los puntos de entrada y las convenciones que detectaron.",
  done:"Corriste al menos 2 subagentes en paralelo y sabés qué cerrar cuando la compu se pone lenta."},
 {t:"Skills bien hechas, MCPs y hooks",s:"Convertir lo que se repite en algo que Claude usa solo.",
  detail:"Una skill es una carpeta con un SKILL.md cuya 'description' dice CUÁNDO activarse. Si la description es buena, Claude la carga solo. Anthropic las clasifica en 9 tipos (referencia de API, verificación de producto, runbooks, code review y más). Los MCPs conectan herramientas externas (Playwright, GitHub, Supabase). Los hooks corren comandos automáticos antes o después de cada acción.",
  steps:["Leé la sección Skills y el artículo de Anthropic sobre cómo usan skills internamente (link abajo).","Creá tu primera skill de proyecto con una description que diga qué frases la disparan. Incluí una sección 'Gotchas'.","Probá que se active sola: pedí algo que matchee la description sin nombrarla.","Conectá Playwright MCP (/mcp) y usalo en /verify.","Agregá un hook que corra el linter después de cada edición (/hooks)."],
  go:"skills",
  links:[["Anthropic: cómo usamos skills","https://claude.com/blog/lessons-from-building-claude-code-how-we-use-skills"],["Docs de skills","https://code.claude.com/docs/en/skills"]],
  done:"Tenés una skill propia que se activa sola y Playwright MCP conectado."},
 {t:"Mapear el código antes de tocarlo",s:"Un repo nuevo se entiende antes de modificarse.",
  detail:"Cuando entrás a un repo de un cliente (o a uno de Albor que no conocés), lo primero es un mapa: arquitectura, puntos de entrada, convenciones, dónde vive cada cosa. Ese mapa va a docs/ y al CLAUDE.md del repo para que las próximas sesiones arranquen con contexto. Nunca modifiques lo que no mapeaste.",

  detail:"El primer tema del máster no es una herramienta: es entender qué cambió. Un modelo escribe código correcto la mayoría de las veces, pero no sabe qué querés, no ve tu producción y no se hace responsable. Todo lo demás del programa sale de esa asimetría.",

   "<b>Los 4 modos de falla típicos.</b> Alucinación de API: inventa un método que no existe en esa versión. Deriva de objetivo: arranca haciendo lo que pediste y a los 20 minutos hizo otra cosa. Pereza agéntica: se detiene antes de terminar y dice que está listo. Sesgo auto-preferencial: revisa su propio código y lo aprueba.",

 {t:"1.2 Pilar 1, la herramienta: taxonomía, comparativa y criterio",s:"Cinco categorías, y cuál corresponde a cada tarea.",
  detail:"No hay una herramienta mejor: hay cinco categorías con costos y autonomías distintas. El error caro es usar un agente autónomo para algo que resolvía el autocompletado, o el chat para algo que necesitaba ver 40 archivos.",
  clase:["<b>1. Autocompletado en el editor</b> (GitHub Copilot, Cursor Tab). Ve el archivo abierto y algunos vecinos. Latencia de milisegundos. Ideal para terminar la línea que ya sabés escribir. No decide nada.",

 {t:"1.3 Pilar 2, el contexto: tipos, ventana y optimización",s:"Lo que sobra distrae tanto como lo que falta.",
  detail:"El contexto es todo lo que el modelo ve al responder. Es finito y se llena. Y acá está lo contraintuitivo del tema: un contexto lleno de cosas irrelevantes da peores respuestas que uno más chico y preciso. Curar el contexto es una habilidad, no una configuración.",
  clase:["<b>Los 5 tipos de contexto.</b> Instrucciones permanentes (CLAUDE.md, AGENTS.md, .cursorrules): las reglas que valen siempre. Código: archivos que le pasás o que el agente lee solo. Conversación: todo lo dicho en la sesión. Herramientas: lo que devuelven MCPs, tests y comandos. Conocimiento externo: documentación, tickets, diseños.",
   "<b>La ventana de contexto</b> se mide en tokens (un token es aproximadamente tres cuartos de una palabra). Los modelos grandes hoy manejan cientos de miles, pero la calidad no es uniforme: lo del principio y lo del final pesan más que lo del medio. Es el efecto 'lost in the middle'.",
   "<b>Divulgación progresiva</b> (progressive disclosure): el patrón que usa Anthropic internamente. En vez de un archivo gigante que se carga siempre, un índice corto que apunta a archivos que se leen sólo cuando hacen falta. Un CLAUDE.md de 50 líneas con reglas, y los detalles en docs/ y en skills.",

   ["Proyecto Django","La sobrecarga típica es pegar el models.py entero de 2.000 líneas. Mejor: el modelo de las 3 tablas que toca la tarea, más el esquema resumido del resto."],

 {t:"1.4 Pilar 3, el prompt: anatomía y patrones",s:"Seis partes y siete patrones que rinden.",
  detail:"Un prompt técnico efectivo no es una frase larga: es una estructura. LIDR lo enseña como anatomía porque cada parte que falta produce un tipo distinto de error.",
  clase:["<b>Las 6 partes.</b> <b>Rol</b>: desde qué experiencia responde. <b>Objetivo</b>: qué tiene que lograr, en una oración. <b>Contexto</b>: qué archivos, qué restricciones del sistema, qué ya intentaste. <b>Restricciones</b>: qué NO puede hacer (sin dependencias nuevas, sin tocar la base, sin cambiar la API pública). <b>Formato</b>: cómo querés la respuesta. <b>Criterio de terminado</b>: cómo se sabe que está bien.",
   "<b>Patrón plan primero.</b> 'Antes de tocar código, mostrame qué archivos vas a tocar y qué vas a hacer en cada uno. Esperá mi OK.' Corregir un plan cuesta un minuto; corregir código cuesta una hora.",
   "<b>Patrón ejemplos (few-shot).</b> Dos ejemplos de entrada y salida valen más que tres párrafos de explicación. Es lo mejor para formato, estilo y convenciones.",
   "<b>Patrón rúbrica.</b> Le das la lista con la que se va a evaluar y le pedís que se autoevalúe antes de devolver. Sube mucho la calidad en tareas de escritura y de review.",
   "<b>Patrón preguntas antes de asumir.</b> 'Si algo es ambiguo, preguntame antes de decidir.' Convierte suposiciones silenciosas en preguntas baratas.",
   "<b>Patrón restricción negativa.</b> Decir qué no hacer es a menudo más efectivo que describir lo que sí. 'No agregues dependencias' evita media hora de deshacer.",
   "<b>Patrón descomposición.</b> Una tarea grande partida en pasos verificables, con un chequeo al final de cada uno. Es lo que hace un tasks.md.",
   "<b>Antipatrones:</b> el prompt vago ('mejorá esto'), el prompt gigante que mezcla cinco pedidos, y pedir código sin decir en qué versión del framework."],
  ej:[["Vago vs completo","❌ 'Optimizá esta consulta.' ✅ 'Esta consulta tarda 4 segundos con 200.000 filas en Postgres 15. No podés agregar índices nuevos por espacio. Dame tres opciones con su plan de ejecución y recomendá una. Listo cuando: menos de 500 ms en el mismo volumen.'"],
   ["Rúbrica en un review","'Evaluá este PR contra: manejo de errores, casos borde, seguridad de entrada, cobertura de tests y legibilidad. Puntuá cada uno de 1 a 5 con justificación antes de dar tu conclusión.'"],
   ["Few-shot para convenciones","Pegar dos mensajes de commit del repo y pedir 'seguí exactamente este formato' produce mejores resultados que explicar Conventional Commits en prosa."]],
  prompt:"Rol: sos un desarrollador senior del stack de este repo. Objetivo: <qué tiene que lograr>. Contexto: @<archivo> y las reglas del CLAUDE.md. Restricciones: sin dependencias nuevas, sin tocar el esquema de la base, sin cambiar la API pública. Formato: primero el plan en 5 pasos, esperás mi OK, después el código. Listo cuando: el build pasa y el flujo funciona en el navegador. Si algo es ambiguo, preguntame antes de asumir.",
  steps:["Reescribí tu peor prompt de la semana con las 6 partes.","Probá el patrón rúbrica en una tarea de review y compará con el resultado sin rúbrica.","Guardá los 3 que mejor funcionen en la sección Prompts de la academia."],

 {t:"1.5 Integración: framework de decisión y aplicación en el SDLC",s:"Por fase: herramienta, contexto y nivel de autonomía.",
  detail:"El cierre del módulo junta los tres pilares en una tabla de decisión que después usás todos los días sin pensarla.",
  clase:["<b>Los 3 niveles de autonomía.</b> Nivel 1, sugiere y vos aplicás: para lo crítico e irreversible (migraciones de producción, cambios de auth, borrado de datos). Nivel 2, hace y vos aprobás antes de mergear: el modo por defecto para casi todo. Nivel 3, hace sola con un gate automático: sólo cuando existe un comando que verifica el resultado (tests, build, linter) y el costo de equivocarse es bajo.",
   "<b>Regla de oro:</b> el nivel de autonomía lo determina la calidad de la verificación disponible, no tu confianza en el modelo.",
   "<b>La tabla por fase del ciclo de vida.</b> Requisitos: chat, contexto del negocio, nivel 1. Diseño y arquitectura: chat o agente, contexto de las specs existentes, nivel 1. Implementación: agente, contexto del repo, nivel 2. Tests: agente, contexto del código y la spec, nivel 3 si hay runner. Review: agente en sesión limpia, contexto del diff y la spec, nivel 1. Deploy: automatizado por CI, nivel 3 con gates. Operación e incidentes: agente con acceso a logs, nivel 2.",
   "<b>Dónde está el trabajo humano ahora:</b> concentrado al principio (qué construir, cómo especificarlo) y al final (revisar, decidir si sale). El medio se comprime. Por eso el resto del máster invierte tanto en specs y en verificación."],
  ej:[["Equipo con buena suite de tests","Puede operar en nivel 3 en implementación: el agente itera solo hasta que los tests pasan. La suite es el permiso."],
   ["Equipo sin tests","Queda atado a nivel 2 en todo, y su primera inversión rentable es una suite mínima de los 3 flujos críticos, no un agente más potente."],
   ["Cambio en producción con datos de clientes","Nivel 1 siempre, aunque el equipo sea maduro: el costo de equivocarse no lo compensa ninguna verificación automática."]],
  steps:["Armá tu tabla: 7 filas (fases) por 3 columnas (herramienta, contexto, nivel de autonomía).","Marcá en qué fases hoy no tenés verificación suficiente para el nivel que estás usando.","Guardala: la vas a comparar en el módulo 13."],
  go:"paths",done:"Tenés tu tabla del ciclo de vida con el nivel de autonomía justificado por su verificación."},
]},
{n:"2",h:"5 h",icon:"doc",t:"Setup de proyecto y Spec-Driven Development",s:"La spec antes del código, con OpenSpec, y un repo listo en una hora.",temas:[
 {t:"2.1 Filosofía: por qué las specs potencian a la IA",s:"El cuello de botella ya no es escribir código: es decir qué querés.",
  detail:"El tema fundacional del máster. Si un modelo escribe código más rápido de lo que vos podés revisarlo, el límite se mueve a la precisión con la que sabés pedir. Spec-Driven Development es la respuesta ingenieril a ese desplazamiento.",
  clase:["<b>El problema que resuelve.</b> Un pedido en lenguaje natural es ambiguo por naturaleza. 'Que el usuario pueda recuperar su contraseña' esconde 15 decisiones: ¿cuánto dura el token? ¿qué pasa si pide dos veces? ¿revela si el mail existe? El modelo va a decidir todas, sin decirte cuáles decidió.",
   "<b>La spec es un contrato, no documentación.</b> Documentación describe lo que existe. Una spec define lo que debe cumplirse, en términos observables y verificables. Si la implementación puede cambiar sin cambiar la spec, la spec está en el nivel correcto.",
   "<b>Given / When / Then.</b> Viene de BDD y sobrevivió por una razón: es simultáneamente legible por el cliente, ejecutable como test y consumible por un modelo. Dado un estado, cuando pasa algo, entonces ocurre esto.",
   "<b>Los tres beneficios medibles.</b> Los bugs se encuentran al escribir el escenario, no en producción. La revisión se vuelve barata: revisás una página en vez de 800 líneas de diff. Y la spec queda como documentación que no se desactualiza, porque es de donde salió el código.",
   "<b>Dónde NO conviene.</b> Exploración y prototipos descartables, fixes de una línea, cambios de texto. La spec tiene un costo fijo: se paga cuando el cambio es real."],
  ej:[["Sin spec","'Agregá login con Google.' El modelo elige la librería, decide qué hacer si el mail ya existe con contraseña, y no maneja el caso de que Google no devuelva el mail. Los tres se descubren en producción."],
   ["Con spec","El escenario 'Dado un usuario registrado con contraseña, cuando entra con Google usando el mismo mail, entonces se vinculan las cuentas y entra' obliga a decidirlo antes, gratis."],
   ["Spec retroactiva","Tomar una feature ya hecha y escribirle la spec es el mejor ejercicio para ver el hueco: casi siempre aparece un caso que el código no cubre."]],
  steps:["Elegí una feature que ya construiste y escribile la spec después: proposal, escenarios Given/When/Then, tareas.","Contá cuántos casos aparecieron que el código no cubre.","Leé el artículo de LIDR sobre Spec-Driven Development."],
  links:[["Spec-Driven Development, LIDR","https://www.lidr.co/blog/spec-driven-development/"]],
  done:"Escribiste una spec retroactiva y encontraste al menos un caso que el código no cubría."},
 {t:"2.2 El protocolo OpenSpec: estructura, componentes y niveles de detalle",s:"specs/ es la verdad; changes/ son los deltas.",
  detail:"OpenSpec es el protocolo que usa LIDR para llevar SDD a la práctica. Su aporte real es el seguimiento por deltas: cada cambio registra sólo lo que se agrega, se modifica o se saca, y al archivarse se funde en la spec principal.",
  clase:["<b>La estructura.</b> <code class='inline'>openspec/specs/&lt;capacidad&gt;/spec.md</code> es la verdad actual del sistema. <code class='inline'>openspec/changes/&lt;nombre&gt;/</code> contiene un cambio en curso: proposal (qué y por qué), design (cómo), specs/ (el delta), tasks (los pasos). <code class='inline'>changes/archive/</code> guarda lo terminado con su fecha.",
   "<b>Los cuatro artefactos y para qué sirve cada uno.</b> El proposal lo lee el cliente o el jefe. El design lo lee el dev senior que aprueba el enfoque. Las specs las leen el implementador y el revisor. Las tasks las ejecuta el agente.",
   "<b>El delta.</b> En vez de reescribir la spec entera, el cambio declara: ADDED Requirements, MODIFIED Requirements, REMOVED Requirements. Al archivar, se funden. Así la spec principal siempre refleja el sistema real y tenés el historial de cómo llegó ahí.",
   "<b>Los comandos del ciclo:</b> propose (crea el cambio con todos los artefactos), explore (piensa antes de comprometerse), apply (implementa las tareas), update (revisa artefactos existentes), sync (funde los deltas), archive (cierra el cambio).",
   "<b>Nivel de detalle por talla.</b> Talla S: proposal corto y dos escenarios, sin design. Talla M: design con decisiones y alternativas. Talla L: no existe, se parte en dos cambios. Un cambio que necesita más de un design largo es dos cambios."],
  ej:[["Capacidad nueva","'notificaciones-email' no existía. El cambio la crea entera con ADDED Requirements: es una capacidad nueva en specs/."],
   ["Capacidad modificada","Login ya existe y ahora suma dos factores. El delta declara MODIFIED sobre el requisito de autenticación, no reescribe todo el spec de login."],
   ["Cambio sin spec","Actualizar dependencias o mover archivos no cambia comportamiento observable: se marca skip_specs y se salta el delta. Inventar un requisito para satisfacer la herramienta es peor que no tenerlo."]],
  steps:["Instalá OpenSpec e inicializalo en un repo de práctica.","Abrí openspec/config.yaml y agregale el contexto del proyecto: stack, arquitectura, convenciones.","Corré el comando de explorar y pedile que te explique con un ejemplo del repo qué sería un delta acá."],
  code:["npm install -g @fission-ai/openspec@latest","openspec init --tools claude --language es","openspec list","openspec validate <cambio>"],
  links:[["OpenSpec","https://github.com/Fission-AI/OpenSpec"],["SPECBOOT de LIDR","https://github.com/LIDR-academy/lidr-specboot"]],
  done:"Tenés openspec/ en un repo y podés explicar qué va en cada carpeta y qué es un delta."},
 {t:"2.3 Creación de especificaciones con IA: generación, validación y refinamiento",s:"La IA genera, la herramienta valida la forma, vos refinás el fondo.",
  detail:"Acá está el reparto de trabajo que propone el máster: el modelo produce el borrador completo en minutos, la herramienta valida la estructura, y el humano hace lo único que no se puede delegar, que es preguntar qué pasa cuando algo falla.",
  clase:["<b>Generación.</b> A partir de la historia refinada, el modelo escribe proposal, design, specs y tasks. Sale en un minuto y está entre el 70 y el 85 por ciento bien.",
   "<b>Validación estructural.</b> El comando de validar chequea la forma: que haya al menos un delta, que los escenarios tengan WHEN y THEN, que las tareas sean casillas. Es barato y automático; no dice nada sobre si la spec es buena.",
   "<b>Refinamiento, el trabajo de verdad.</b> Por cada requisito, cuatro preguntas: ¿qué pasa si el usuario lo hace dos veces? ¿qué pasa si el sistema externo no responde? ¿qué ve un usuario sin permisos? ¿qué pasa con el estado vacío o con 10.000 elementos?",
   "<b>La sección más importante es 'Fuera de alcance'.</b> Es la que evita que el agente construya de más y la que te protege cuando el cliente pide algo que no estaba. Un proposal sin fuera de alcance produce tasks.md el doble de largos.",
   "<b>Señales de una spec floja:</b> escenarios que sólo describen el camino feliz, requisitos que nombran clases o funciones (eso es diseño, no spec), y verbos vagos como 'gestionar' o 'manejar' en vez de comportamientos observables."],
  ej:[["Refinamiento de un carrito","La spec generada dice 'el usuario agrega un producto al carrito'. El refinamiento agrega: producto sin stock, producto que se agotó entre agregar y pagar, dos pestañas abiertas del mismo carrito, y carrito de un usuario que cerró sesión."],
   ["Spec en el nivel equivocado","❌ 'El servicio CartService debe llamar a InventoryRepository.' ✅ 'Cuando el producto quedó sin stock desde que se agregó, el sistema avisa antes de cobrar y no cobra.'"],
   ["Escenario de error, API pública","'Dado un token vencido, cuando llega una petición, entonces responde 401 con el código de error auth/expired y no filtra si el usuario existe.'"]],
  steps:["Generá un cambio con la propuesta a partir de una historia enriquecida.","Corré la validación y arreglá lo que marque.","Aplicá las cuatro preguntas de refinamiento a cada requisito y agregá los escenarios que falten.","Verificá que el proposal tenga una sección de fuera de alcance con al menos tres puntos."],
  code:["/opsx:propose mi-cambio","openspec validate mi-cambio","/opsx:update"],
  done:"Tu cambio valida y tiene al menos un escenario de error por requisito."},
 {t:"2.4 Configuración del entorno: del repositorio vacío al proyecto listo",s:"Lo que se configura el día uno y no se toca más.",
  detail:"El último tema del módulo es operativo: qué tiene que existir en un repo para que un agente trabaje bien desde el primer día. Sirve igual en Next.js, en Django o en Spring.",
  clase:["<b>El archivo de instrucciones</b> (CLAUDE.md, AGENTS.md o el que use tu herramienta). Corto y con reglas, no con tutoriales: stack y versiones, cómo se corre y se testea, convenciones de nombres, qué está prohibido, cómo se despliega.",
   "<b>Permisos.</b> Lectura y edición libres para que trabaje sin fricción; comandos de terminal con confirmación; borrado, push forzado y comandos destructivos bloqueados. Se configura una vez por proyecto.",
   "<b>Secretos afuera desde el commit uno.</b> Archivo de entorno gitignoreado con permisos restringidos, variables de producción en el proveedor, y un ejemplo versionado con los nombres pero sin valores.",
   "<b>Especificaciones y plantillas.</b> Inicializar el protocolo de specs, y las plantillas de issue y de pull request para que todo el equipo describa el trabajo igual.",
   "<b>La verificación disponible define la autonomía</b> (tema 1.5), así que el día uno se instala el runner de tests y el linter, aunque haya un solo test. Sin eso, el equipo queda clavado en nivel 2 para siempre."],
  ej:[["Node y Next.js","create-next-app, /init, permisos, openspec init, Vitest y Playwright, plantillas .github/, deploy conectado. Una hora."],
   ["Python y FastAPI","Poetry o uv, ruff y mypy, pytest con un test de humo, el archivo de instrucciones con cómo levantar el entorno virtual, y las mismas plantillas de issue y PR."],
   ["Java y Spring Boot","Gradle o Maven, checkstyle, JUnit con un test de contexto, el archivo de instrucciones con los perfiles y cómo correr local, y el pipeline de build desde el día uno."]],
  steps:["Creá un repo nuevo con tu stack y subilo a GitHub.","Corré /init y agregale las reglas duras del equipo.","Inicializá el protocolo de specs y copiá las plantillas de issue y PR.","Instalá el runner de tests y escribí un test de humo.","Conectá el deploy y hacé la primera publicación."],
  code:["/init","openspec init --tools claude --language es","/permissions"],
  done:"Repo nuevo con instrucciones, specs, plantillas, un test que corre y deploy funcionando, en menos de una hora."},
]},
{n:"3",h:"6 h",icon:"cli",t:"Implementación práctica con copilotos de IA",s:"Configurar bien, aplicar la spec, MCPs y subagentes, y medir.",temas:[
 {t:"3.1 Copilotos en profundidad: instalación, configuración y criterios",s:"Lo que se configura una vez y cambia todos los días.",
  detail:"El máster dedica un tema entero a la configuración porque es donde se pierde o se gana la mitad de la productividad, y casi nadie la revisa después de instalar.",
  clase:["<b>Jerarquía de configuración.</b> Del usuario (vale en todos tus proyectos) al proyecto (vale para el equipo, va versionado) al local (tu máquina, no se versiona). Lo que es del equipo va en el repo; lo que es tuyo, en tu casa.",
   "<b>Modelo por tarea, no por gusto.</b> El más capaz para diseñar, revisar y depurar lo difícil. Uno intermedio para implementar tareas ya especificadas. El más rápido para lo mecánico y masivo. Cambiar de modelo a mitad de sesión es normal y es donde está el ahorro.",
   "<b>Hooks.</b> Comandos que la herramienta ejecuta sola antes o después de una acción: correr el formateador después de cada edición, bloquear la edición de archivos de configuración, avisar cuando termina una tarea larga. Es automatización determinista alrededor de un modelo probabilístico.",
   "<b>Permisos como diseño, no como molestia.</b> Bien configurados, el agente trabaja sin interrumpirte y aun así no puede hacer nada irreversible. Mal configurados, o te pregunta todo o puede borrarte el repo.",
   "<b>Probar otro copiloto una tarde</b> es parte del temario: te enseña qué de tu flujo es esencial y qué era costumbre."],
  ej:[["Hook de formato","Después de cada edición corre el formateador del proyecto. El diff queda limpio y el review no se llena de comentarios de estilo."],
   ["Hook de protección","Bloquea la edición de los archivos de configuración del linter, para que el agente arregle el código en vez de bajar la vara."],
   ["Modelo mixto en un mismo ticket","Diseñás la solución con el modelo más capaz, aplicás las 12 tareas mecánicas con uno intermedio, y el review final vuelve al capaz. Mismo resultado, bastante menos costo."]],
  steps:["Revisá tu configuración de usuario: modelo, permisos, plugins activos.","Configurá permisos a nivel de proyecto y versionalos para el equipo.","Agregá un hook que corra el formateador después de cada edición.","Cambiá de modelo a propósito tres veces en un mismo ticket y notá la diferencia."],
  code:["/permissions","/model","/hooks"],
  done:"Tenés permisos y un hook a nivel de proyecto, y elegís modelo según la tarea."},
 {t:"3.2 Desarrollo guiado por especificaciones: de la spec al código funcional",s:"El agente ejecuta tasks.md; vos cuidás que no invente alcance.",
  detail:"Con la spec aprobada, implementar deja de ser creativo y pasa a ser ejecución verificable. Ese cambio de naturaleza es lo que permite subir la autonomía sin perder control.",
  clase:["<b>El bucle por tarea.</b> Leer la tarea, escribir el test que falla, escribir el código mínimo que lo pasa, refactorizar con el test verde, tildar la tarea, commitear. Cinco pasos, siempre iguales.",
   "<b>Tu trabajo durante la ejecución</b> es de control, no de escritura: que no saltee tareas, que no agregue alcance que no está en la spec, y que cada commit tenga sentido por sí solo.",
   "<b>Qué hacer cuando aparece algo no previsto.</b> Si cambia el comportamiento observable, se actualiza la spec primero y después el código. Si es un detalle interno, se resuelve y se anota. La tentación del arreglo rápido sin spec es exactamente lo que destruye el valor del método.",
   "<b>Commit por tarea, no por día.</b> Permite revertir con precisión, hace el review legible, y si el agente se pierde tenés un punto de retorno cercano.",
   "<b>Señal de alarma:</b> si el agente empieza a tocar archivos que no están en el design, frenalo. O falta una decisión en el design, o se está yendo."],
  ej:[["Alcance que se infla","La tarea decía 'agregar el campo teléfono al formulario' y el diff toca el modelo, la API, tres componentes y el sistema de validación entero. O el design estaba incompleto o hay que frenar y volver a la spec."],
   ["Descubrimiento legítimo","Al implementar, aparece que la librería de fechas no maneja la zona horaria del cliente. Eso cambia comportamiento observable: se actualiza la spec, se agrega el escenario y recién ahí se codea."],
   ["Tarea bien tildada","'2.2 Implementar el endpoint y verificar que el test de contrato pasa' se tilda cuando el test pasa, no cuando el código parece listo."]],
  steps:["Abrí un espacio de trabajo aislado y ejecutá el cambio aprobado tarea por tarea.","Mirá el diff después de cada tarea, antes de que siga con la próxima.","Si agrega algo fuera de la spec, frenalo y decidí: actualizar la spec o descartar.","Un commit por tarea, con mensaje que diga qué tarea cerró."],
  code:["claude --worktree mi-cambio","/opsx:apply","git diff --stat"],
  done:"Aplicaste un cambio completo sin que se desviara del tasks.md."},
 {t:"3.3 Funcionalidades avanzadas: MCPs, subagentes, multi-archivo y terminal",s:"Las cuatro capacidades que convierten un chat en un agente.",
  detail:"Este es el tema que separa a quien usa la IA como buscador de quien la usa como colaborador. Las cuatro capacidades combinadas son lo que permite que una tarea real se complete sin vos.",
  clase:["<b>MCP (Model Context Protocol)</b> es el estándar abierto que conecta un modelo con herramientas externas. Un servidor MCP expone funciones que el agente puede llamar: abrir un navegador, consultar una base, leer issues, traer documentación. Es lo que le da manos.",
   "<b>Los MCPs que más rinden en desarrollo:</b> navegador (Playwright) para ver la aplicación de verdad, base de datos para consultar esquema y datos, repositorio para issues y PRs, documentación para APIs actualizadas, y observabilidad para leer errores reales de producción.",
   "<b>Subagentes.</b> Otra instancia del modelo con su propio contexto, que recibe una tarea acotada y devuelve un resultado. Sirven para tres cosas: paralelizar trabajo independiente, explorar sin ensuciar tu contexto principal, y revisar sin el sesgo de haber escrito el código.",
   "<b>Edición multi-archivo.</b> Un cambio real toca el modelo, el servicio, la ruta, el componente y el test. La capacidad de hacerlo de forma coherente en una pasada es lo que distingue a un agente de un autocompletado.",
   "<b>Terminal integrada.</b> Correr los tests, leer el error, corregir y volver a correr, sin vos en el medio. Es el bucle de verificación que habilita el nivel 3 de autonomía.",
   "<b>Cuándo NO usar subagentes:</b> tareas que comparten estado o que dependen una de otra en secuencia. Ahí la coordinación cuesta más que el paralelismo."],
  ej:[["Fan-out de revisión","Tres subagentes en paralelo sobre el mismo PR: uno mira seguridad, otro accesibilidad, otro rendimiento. Cada uno con contexto limpio. Después una síntesis ordenada por severidad."],
   ["Verificación con navegador","El agente levanta el servidor, abre la página, completa el formulario, envía, lee la consola y saca captura. Encuentra lo que ningún test unitario ve."],
   ["Documentación en contexto","Un MCP de documentación evita la alucinación de API del tema 1.1: en vez de recordar, consulta la versión que usás."],
   ["Bucle de terminal","'Corré los tests, arreglá lo que falle y repetí hasta verde, máximo 5 intentos.' Eso es autonomía nivel 3 bien puesta: hay gate y hay tope."]],
  prompt:"Lanzá tres subagentes en paralelo sobre el diff de esta rama. Agente 1: seguridad (validación de entrada, autorización, secretos, inyección). Agente 2: accesibilidad y semántica del HTML. Agente 3: rendimiento (consultas N+1, renders innecesarios, tamaño del bundle). Cada uno devuelve una tabla con severidad, archivo, línea y fix sugerido. Después unificá en una sola tabla ordenada por severidad, sin repetir hallazgos.",
  steps:["Conectá dos MCPs a tu proyecto y usalos en una tarea real.","Pedí un cambio que toque cuatro archivos y observá el orden en que los edita.","Lanzá dos subagentes en paralelo con tareas independientes y pedí la síntesis.","Dejá que corra los tests y lea la salida solo, con un tope de intentos."],
  code:["/mcp","/agents"],
  done:"Usaste dos MCPs y dos subagentes en paralelo en una misma tarea real."},
 {t:"3.4 Workflows optimizados: refactorización, code review y debugging",s:"Tres flujos diarios, cada uno con su método.",
  detail:"Tres actividades que ocupan la mayor parte del día de un dev senior y que la IA cambia por completo, siempre que se hagan con método y no a las corridas.",
  clase:["<b>Refactor: la red primero.</b> El orden es tests que capturan el comportamiento actual (tests de caracterización si no había), después el refactor, después los mismos tests verdes. Sin la red, un refactor asistido por IA es una ruleta.",
   "<b>Refactor en pasos chicos y verificables:</b> extraer, renombrar, mover, simplificar. Cada uno con los tests corriendo. Un refactor gigante en un commit es irrevisable.",
   "<b>Code review: quien escribió no revisa.</b> Un modelo revisando su propio código lo aprueba, por el sesgo auto-preferencial del tema 1.1. La solución es sesión limpia o subagente sin el historial de la implementación.",
   "<b>Review adversarial.</b> No 'revisá esto' sino 'intentá romper esto': asumí que hay una falla y buscala. Cambia por completo lo que encuentra. Y el veredicto tiene que ser explícito: pasa, pasa con salvedades, o no pasa.",
   "<b>Debugging sistemático, la ley de hierro:</b> no hay fix sin causa raíz. Reproducir de forma confiable, aislar la variable, formular una hipótesis que explique todos los síntomas, probarla, arreglar, y dejar un test de regresión.",
   "<b>El antipatrón de depuración con IA</b> es pedir 'arreglá este error' y aceptar el primer cambio que hace desaparecer el síntoma. Suele mover el bug de lugar."],
  ej:[["Tests de caracterización","Código heredado sin tests: se le pide al agente que escriba tests que documenten lo que hace hoy, incluso si está mal. Esa es la red. Recién después se refactoriza."],
   ["Review adversarial que encuentra algo","'Este endpoint valida el rol, ¿qué pasa si el usuario cambia de rol mientras la petición está en vuelo?' Es el tipo de pregunta que un review complaciente no hace."],
   ["Causa raíz vs síntoma","La página tarda 8 segundos. El fix rápido: agregar un spinner. La causa raíz: una consulta N+1 que hace 300 viajes a la base. El primero se entrega; el segundo se arregla."]],
  steps:["Elegí una función fea de tu repo, escribile tests de caracterización y refactorizala.","Pedí un review adversarial de tu último PR en una sesión distinta.","La próxima vez que aparezca un bug, prohibite proponer un fix hasta tener la causa raíz escrita en una oración."],
  code:["/adversarial-review","/code-review","/investigate"],
  done:"Hiciste un refactor con red de tests y un review adversarial en sesión limpia."},
 {t:"3.5 Consolidación: documentación inline y métricas de productividad",s:"Comentar el porqué, y medir con números en vez de sensaciones.",
  detail:"El cierre del módulo ataca la pregunta que siempre hace un jefe: ¿esto realmente nos hace más productivos? La respuesta honesta necesita números, y casi ningún equipo los tiene.",
  clase:["<b>Comentarios: sólo el porqué.</b> El qué lo dice el código. El porqué (por qué este orden, por qué este umbral, por qué no la solución obvia) no está en ningún lado y es lo que se pierde. Una línea, sólo cuando no es evidente.",
   "<b>El antipatrón de la IA con comentarios</b> es generar uno por línea explicando lo obvio. Se corrige en las instrucciones del proyecto con una regla explícita.",
   "<b>Las cuatro métricas que importan</b> (DORA, adaptadas): frecuencia de despliegue, tiempo desde el commit hasta producción, porcentaje de cambios que fallan, y tiempo de recuperación. Miden el sistema, no a las personas.",
   "<b>Las métricas específicas de trabajar con IA:</b> tiempo por ticket de cada talla, porcentaje de PRs que necesitan retrabajo, bugs que llegan a producción por cada 10 tickets, y costo en tokens por ticket.",
   "<b>La trampa de medir líneas de código.</b> Con IA, las líneas dejaron de correlacionar con valor. Un equipo puede triplicar líneas y bajar su capacidad de entrega. Se mide entrega y estabilidad, nunca volumen.",
   "<b>Línea base primero.</b> Sin una medición de dos semanas antes de cambiar el proceso, cualquier mejora posterior es una anécdota."],
  ej:[["Buen comentario","'// Reintentamos 3 veces porque el proveedor devuelve 503 en el primer intento tras un despliegue suyo.' Eso no se deduce del código."],
   ["Mal comentario","'// Incrementa el contador en uno.' Es ruido; el código ya lo dice."],
   ["Medición honesta","Un equipo pasó de 5 a 12 tickets por sprint, pero el retrabajo subió del 10 al 35 por ciento. La ganancia neta era mucho menor que la aparente, y el diagnóstico fue falta de specs."]],
  steps:["Agregá a las instrucciones del proyecto la regla de comentarios: una línea, sólo el porqué.","Medí dos semanas: tickets cerrados por talla, tiempo promedio, PRs con retrabajo, bugs en producción, tokens por ticket.","Anotá la línea base donde puedas compararla dentro de un mes."],
  code:["/usage"],
  done:"Tenés una línea base de dos semanas con las cinco métricas anotadas."},
]},
{n:"4",h:"5 h",icon:"map",t:"Planificación y documentación efectivas con IA",s:"Arquitectura, diagramas como código, PRD, historias y estimación.",temas:[
 {t:"4.1 Diseño de sistemas, arquitectura y modelado de datos",s:"Opciones con trade-offs. La IA escribe, vos decidís.",
  detail:"El error caro de programar con IA es dejarla elegir la arquitectura. Un modelo propone lo más frecuente en su entrenamiento, no lo mejor para tu contexto. El método correcto es pedirle alternativas con sus costos y decidir vos.",
  clase:["<b>Pedí siempre tres opciones, no una.</b> Una opción es una recomendación disfrazada. Tres con trade-offs explícitos te obligan a entender el espacio de decisión.",
   "<b>Los ejes de comparación</b> que tienen que aparecer sí o sí: complejidad operativa, costo mensual, latencia, límites de escala, y qué se rompe primero cuando crece.",
   "<b>Modelado de datos.</b> Entidades, atributos con tipo, relaciones con cardinalidad, reglas de integridad, y qué se borra en cascada. La IA lo produce bien si le das el dominio; lo que no puede saber es qué consulta va a ser la más frecuente, y eso define los índices.",
   "<b>Normalizar o desnormalizar</b> es una decisión de lectura contra escritura, no una regla moral. Se decide con el patrón de acceso real, y ese lo conocés vos.",
   "<b>Regla práctica:</b> si el modelo propone microservicios, colas o caché en la primera iteración de un producto que no existe todavía, está optimizando para un problema que no tenés. Se le dice que asuma la escala real."],
  ej:[["Notificaciones en tiempo real","Tres opciones: sondeo cada 30 segundos (simple, barato, latencia alta), eventos enviados por el servidor (medio), websockets con servicio administrado (complejo, caro, instantáneo). Para 200 usuarios, la primera. Para una sala de trading, la tercera."],
   ["Almacenamiento de archivos","Base de datos como binarios (simple, no escala), almacenamiento de objetos con URLs firmadas (estándar), CDN con subida directa desde el cliente (más piezas, mejor rendimiento). El volumen y el tamaño promedio deciden."],
   ["Modelo mal normalizado por defecto","La IA propone tabla de direcciones separada por buenas prácticas. Si tu producto guarda una sola dirección por usuario y nunca la consulta aparte, es una unión extra en cada consulta a cambio de nada."]],
  prompt:"Necesito <feature> para un producto con <número real> de usuarios y <volumen real> de datos. Proponeme 3 arquitecturas posibles con el stack <tu stack>. Para cada una: componentes, flujo de datos, complejidad operativa, costo mensual estimado, latencia esperada, y qué se rompe primero al crecer 10 veces. Recomendá una y justificá por qué las otras dos no. No escribas código todavía.",
  steps:["Tomá una feature real y pedí tres arquitecturas con los cinco ejes de comparación.","Elegí una y escribí en tres oraciones por qué descartaste las otras dos.","Pedí el modelo de datos como tabla, y agregale vos los índices según las consultas que ya sabés que van a existir."],
  done:"Tenés una decisión de arquitectura escrita con sus alternativas descartadas y el porqué."},
 {t:"4.2 Diagramas como código con IA",s:"Mermaid en el markdown, versionado y regenerado desde el código.",
  detail:"Un diagrama en una herramienta visual se desactualiza el primer día. Un diagrama como código vive en el repo, se revisa en el PR y la IA lo regenera leyendo el código real.",
  clase:["<b>Mermaid</b> se renderiza nativamente en GitHub, GitLab, Notion y muchos editores. Es el formato por defecto: cero instalación, se ve donde ya trabajás.",
   "<b>Los cuatro tipos que más se usan:</b> secuencia (para flujos entre sistemas), entidad-relación (para el modelo de datos), flujo (para lógica y decisiones), y estados (para máquinas de estado como un pedido o una suscripción).",
   "<b>PlantUML</b> cuando necesitás diagramas más formales o UML completo, a cambio de instalar y renderizar aparte.",
   "<b>La práctica que lo mantiene vivo:</b> el diagrama se genera desde el código, no desde la cabeza. Si cambia el flujo, se regenera. Y una regla en el PR: si cambia el comportamiento, se regenera el diagrama.",
   "<b>Dónde falla:</b> diagramas con más de 15 nodos se vuelven ilegibles. Si no entra, el problema no es el diagrama, es que estás dibujando dos cosas juntas."],
  ej:[["Secuencia de un pago","Cliente, API, pasarela de pago, webhook, base. Incluyendo el camino de error: pago rechazado, webhook duplicado, webhook que llega antes que la respuesta."],
   ["Estados de un pedido","Creado, pagado, preparando, despachado, entregado, cancelado, reembolsado. Con las transiciones válidas dibujadas, se ven de inmediato las que el código permite y no debería."],
   ["Entidad-relación desde migraciones","Se le da la carpeta de migraciones y produce el diagrama del esquema real, no del que alguien recuerda."]],
  prompt:"Leé <carpeta o archivos> y generá un diagrama de secuencia en Mermaid del flujo <nombre>: participantes reales, mensajes en orden, y los caminos de error (timeout, rechazo, duplicado). Guardalo en docs/<nombre>.md con un párrafo de contexto arriba. No inventes participantes que no estén en el código.",
  steps:["Generá un diagrama de secuencia de un flujo real de tu proyecto y verificá que GitHub lo renderiza.","Generá el diagrama de entidades desde tus migraciones y comparalo con el que tenías en la cabeza.","Agregá a las instrucciones del proyecto la regla de regenerar el diagrama cuando cambia el flujo."],
  done:"docs/ tiene al menos dos diagramas Mermaid generados desde el código real."},
 {t:"4.3 Documentación de código, comentarios y bases de conocimiento",s:"Tres capas, y qué va en cada una.",
  detail:"La mayoría de los equipos mezcla las tres capas y termina con documentación que nadie lee y decisiones que nadie recuerda. Separarlas es la mitad del trabajo.",
  clase:["<b>Capa 1, el código.</b> Comentarios del porqué y docstrings en funciones públicas y complejas. Vive junto al código y se revisa en el mismo PR.",
   "<b>Capa 2, el repositorio.</b> Cómo funciona el sistema: mapa del repo, arquitectura, cómo levantarlo, cómo desplegarlo, runbooks. Vive en docs/ y es lo que lee un dev nuevo o un agente que entra por primera vez.",
   "<b>Capa 3, el conocimiento del equipo.</b> Decisiones, contexto de negocio, acuerdos con clientes, aprendizajes. No es del repo porque sobrevive al repo. Va a una base de conocimiento (Notion, Obsidian, un vault propio).",
   "<b>La prueba para saber en qué capa va algo:</b> si sirve para entender el código de este repo, capa 2. Si sirve para entender por qué la empresa hace lo que hace, capa 3. Si sólo se entiende leyendo esa función, capa 1.",
   "<b>Documentación generada, revisada por humanos.</b> La IA escribe el borrador en minutos; el humano corrige lo que está mal, que suele ser el porqué, no el qué."],
  ej:[["Capa 1","'// Ordenamos antes de agrupar porque el proveedor no garantiza orden y agrupar sin ordenar duplica filas.'"],
   ["Capa 2","docs/MAPA.md con las capas del repo, los puntos de entrada, dónde están los tests y cómo se despliega. Es lo primero que se le da a un agente en un repo nuevo."],
   ["Capa 3","'El cliente X paga por adelantado porque tuvimos un incobrable en marzo.' Eso no va al repo del cliente X."]],
  steps:["Clasificá diez piezas de documentación que tenés hoy en las tres capas y movelas donde corresponde.","Generá o actualizá docs/MAPA.md de un repo real.","Definí dónde vive tu capa 3 y qué se guarda ahí."],
  done:"Tus tres capas están separadas y el repo tiene docs/MAPA.md al día."},
 {t:"4.4 Spec-Driven Development aplicado a la planificación",s:"La spec como contrato comercial, antes de estimar.",
  detail:"El mismo método del módulo 2, visto desde el rol de quien planifica y cotiza. La spec deja de ser un artefacto técnico y pasa a ser la defensa contra el alcance que crece sin precio.",
  clase:["<b>No se estima lo que no está especificado.</b> Un número dado sobre un pedido vago es una promesa que vas a pagar vos.",
   "<b>La sección de fuera de alcance es la cláusula comercial más importante.</b> Es lo que convierte una discusión incómoda ('eso no estaba') en una referencia a un documento que el cliente aprobó.",
   "<b>Cambio de alcance, procedimiento:</b> el pedido nuevo entra como cambio nuevo, con su propia spec y su propio precio. No se negocia dentro del cambio en curso.",
   "<b>La spec como material de venta.</b> Un cliente que recibe una propuesta con escenarios concretos entiende qué está comprando y confía más que con una lista de funcionalidades.",
   "<b>Estimar por talla, no por horas.</b> S, M y L con equivalencias acordadas por el equipo. Es más honesto y se calibra solo con el tiempo."],
  ej:[["Antes de cotizar","'Sistema de reservas' es incotizable. 'Reserva con selección de fecha, pago con tarjeta, mail de confirmación y panel de administración con estas cuatro acciones' es cotizable."],
   ["Fuera de alcance que salva un proyecto","'No incluye: integración con el sistema contable, app móvil nativa, ni migración de los datos históricos.' Las tres van a aparecer pedidas más adelante."],
   ["Cambio bien gestionado","'Eso no está en la spec aprobada. Lo especifico y te paso el precio, o lo dejamos para la fase dos.' Sin conflicto y sin regalar trabajo."]],
  steps:["Tomá tu última propuesta a un cliente y agregale la sección de fuera de alcance que le faltaba.","Definí las equivalencias de talla de tu equipo.","Acordá por escrito el procedimiento de cambio de alcance con tu próximo cliente."],
  go:"paths",done:"Cotizaste un trabajo a partir de una spec escrita con fuera de alcance explícito."},
 {t:"4.5 Documentos de requisitos (PRD)",s:"Seis secciones, y la crítica antes de arrancar.",
  detail:"El PRD es el documento del que salen todas las specs. Con IA sale en veinte minutos, pero su valor está en la crítica que le hacés después, no en la velocidad con la que se escribe.",
  clase:["<b>Las seis secciones:</b> problema (qué duele hoy y a quién), usuarios (quiénes son y qué hacen), alcance (qué se construye), fuera de alcance (qué no), criterios de éxito (cómo se sabe que funcionó, con números), y riesgos.",
   "<b>Criterios de éxito con números o no son criterios.</b> 'Mejorar la experiencia' no es medible. 'Bajar el abandono del checkout del 60 al 40 por ciento' sí.",
   "<b>La crítica como CTO.</b> Antes de partirlo en tareas, se le pide al modelo que lo destroce: ambigüedades, requisitos sin criterio de éxito, riesgos técnicos no mencionados, preguntas para el cliente. Es lo más rentable de todo el proceso.",
   "<b>Del PRD a las tareas.</b> Un cambio de spec por feature, no un cambio gigante para todo el PRD. Un PRD grande produce cinco o diez cambios.",
   "<b>El PRD es un documento vivo</b> hasta que arranca la construcción; después se congela y los cambios entran como specs nuevas."],
  ej:[["Criterio vago vs medible","❌ 'Que la app sea más rápida.' ✅ 'Que la pantalla de inicio cargue en menos de 1,5 segundos en 4G en un teléfono de gama media.'"],
   ["Riesgo que aparece en la crítica","'La integración con el ERP del cliente depende de una API que no está documentada y de la que no tenemos acceso de prueba.' Detectado en el PRD cuesta una conversación; detectado en la semana tres cuesta el proyecto."],
   ["PRD en producto interno","Mismo formato para una herramienta interna: el usuario es tu equipo y el criterio de éxito es tiempo ahorrado por semana."]],
  prompt:"Leé este PRD y criticalo como si fueras el CTO que tiene que aprobar el presupuesto. Listá: ambigüedades que permitirían dos implementaciones distintas, requisitos sin criterio de éxito medible, riesgos técnicos no mencionados, dependencias externas sin plan B, y las cinco preguntas que le harías al cliente antes de empezar. No reescribas el documento, sólo criticalo.",
  steps:["Escribí un PRD con las seis secciones para algo que estés por empezar.","Pedile la crítica como CTO y respondé cada punto.","Partilo en cambios de spec, uno por feature."],
  done:"Tenés un PRD criticado y corregido antes de la primera tarea de código."},
 {t:"4.6 Historias de usuario, tickets, sprints y estimación",s:"De la historia cruda al board, con refinamiento en el medio.",
  detail:"El último tema del módulo baja todo a la operación diaria: cómo se escribe una historia, cómo se refina, cómo se talla y cómo se arma la semana.",
  clase:["<b>La forma canónica:</b> como &lt;rol&gt; quiero &lt;acción&gt; para &lt;valor&gt;. El 'para' es el que más se omite y el que más importa: sin el porqué, nadie puede proponer una solución mejor que la pedida.",
   "<b>Criterios INVEST</b> para saber si una historia sirve: independiente, negociable, valiosa, estimable, chica, testeable. Si falla 'chica' o 'testeable', se parte.",
   "<b>El refinamiento con IA</b> audita la historia contra una lista: flujo completo, datos, contratos, archivos afectados, tests, no funcionales, fuera de alcance y definición de terminado. Lo que falta, lo completa; lo que no puede saber, lo marca para confirmar.",
   "<b>El ticket vive en el gestor, no en el chat.</b> GitHub Issues, Jira o Linear: lo importante es que haya un único lugar con estado, y que la rama y el PR lo referencien para cerrar el círculo.",
   "<b>Sprint = suma de tallas que entra en la semana</b>, dejando un margen para lo imprevisto. Al cerrar, la pregunta que calibra: qué talla estimaste mal y por qué.",
   "<b>Antipatrón:</b> historias técnicas sin valor de usuario ('refactorizar el módulo X'). Se convierten en tareas dentro de una historia real o en deuda técnica priorizada aparte, no en historias."],
  ej:[["Historia sin el porqué","❌ 'Como admin quiero exportar a CSV.' ✅ '...para pasarle los datos al contador todos los meses sin copiar a mano.' El porqué revela que quizás lo que necesita es un envío automático mensual."],
   ["Historia que hay que partir","'Como usuario quiero gestionar mi perfil' son cinco historias: ver, editar datos, cambiar foto, cambiar contraseña, borrar cuenta. Cada una con criterios distintos."],
   ["Refinamiento que encuentra lo no funcional","La historia de exportar no decía nada de volumen. Con 200.000 filas, la exportación síncrona tumba el servidor. Aparece en el refinamiento, no en producción."]],
  steps:["Escribí cinco historias reales con la forma canónica completa, incluyendo el porqué.","Pasalas por INVEST y partí las que fallen.","Refiná cada una con la skill de refinamiento y talla.","Armá el sprint y al cerrar la semana anotá qué talla erraste."],
  code:["/enrich-us #12","gh issue list --label talla:S"],
  done:"Un sprint planificado con historias refinadas, talladas y en un board."},
]},
{n:"5",h:"4 h",icon:"book",t:"Documentación efectiva de un proyecto apoyado en IA",s:"C4, ADRs, OpenAPI, runbooks y docs que se publican solas.",temas:[
 {t:"5.1 Documentación de arquitectura: C4, UML, ADRs y flujos de datos",s:"Cuatro niveles de zoom y una decisión por archivo.",
  detail:"Documentar arquitectura falla casi siempre por la misma razón: se mezcla el nivel de zoom. C4 resuelve eso separando en cuatro niveles, y los ADRs resuelven la otra mitad del problema, que es que nadie recuerda por qué se decidió lo que se decidió.",
  clase:["<b>C4, los cuatro niveles.</b> Nivel 1, contexto: tu sistema, sus usuarios y los sistemas externos. Nivel 2, contenedores: aplicaciones, bases, colas. Nivel 3, componentes: las partes internas de un contenedor. Nivel 4, código: clases, casi nunca vale la pena dibujarlo a mano.",
   "<b>En la práctica alcanza con los niveles 1 y 2</b> para casi todos los proyectos. El nivel 3 sólo para el contenedor más complejo.",
   "<b>ADR (Architecture Decision Record):</b> un archivo por decisión, numerado, con contexto, decisión, alternativas consideradas y consecuencias (las buenas y las malas).",
   "<b>La regla que los hace funcionar:</b> un ADR nunca se edita. Si la decisión cambia, se escribe uno nuevo que dice que reemplaza al anterior. El historial es el valor.",
   "<b>Qué merece un ADR:</b> elección de base de datos, de framework, de patrón de autenticación, de estrategia de despliegue. Lo que si se revierte cuesta semanas.",
   "<b>Por qué importan más con IA:</b> un agente que lee tus ADRs no vuelve a proponer la alternativa que descartaste hace seis meses."],
