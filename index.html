 more:{detail:"La v2.1.234 cierra un bug crítico en auto mode: en sesiones largas que pasaban por compactación (el resumen automático de contexto), el clasificador de auto mode empezaba a denegar sistemáticamente el acceso a red de los comandos sandboxeados sin importar la allowlist configurada. Esto causaba que pipelines que corrían bien al inicio empezaran a fallar después de horas de sesión. El fix es transparente: actualizás y el problema desaparece. La reanudación automática al límite de uso ahora está integrada en la CLI además del desktop: cuando la sesión llega al cap de uso, Claude espera el reseteo y retoma sin intervención; se puede togglear en /config. La skill claude-api pasó de cargar ~200K tokens de contexto a ~25K gracias a documentación de referencia cargada bajo demanda. El parámetro mode en las herramientas de Task fue deprecado: los subagentes heredan el permission mode del padre por defecto. También: CLAUDE_CODE_PROJECT_DIR_NAME para nombres de directorio de transcriptas personalizados por proyecto; protección contra paths Windows NT-namespace en lecturas remotas y restores de sesión; /permissions ahora abre mientras Claude trabaja y los cambios aplican al turno en curso.",
   code:["# La reanudación automática es configurable en /config","# o en settings.json:","{ \"autoResumeOnLimitReset\": true }","","# Nombre de directorio de transcript personalizado:","export CLAUDE_CODE_PROJECT_DIR_NAME=mi-proyecto","","# El fix de auto mode no requiere configuración:","claude update   # actualizá a v2.1.234 o superior"],
   links:[["Changelog Claude Code v2.1.234","https://code.claude.com/docs/en/changelog"]]}},
{date:"2026-08-14",tag:"claude code",tagc:"clay",fresh:false,
 title:"v2.1.233: herramientas de tareas desactivadas en modelos nuevos + GitLab en worktree",
 body:"La v2.1.233 trajo dos cambios con impacto inmediato para builders. Las herramientas de tracking de tareas (TaskCreate, TaskGet, TaskUpdate, TaskList, TodoWrite) dejaron de estar disponibles por defecto en Opus 4.8, Sonnet 5, Fable 5, Mythos 5 y modelos más nuevos — restaurarlas requiere activar una variable de entorno. Los merge requests de GitLab son ahora ciudadanos de primera clase en el flag --worktree y en la vista de agentes, donde se muestran como !N. También llegó control de límite de RAM para comandos Bash en Linux y configuración del TTL de caché de WebFetch.",
 why:"Si tenés workflows o agentes que usan TaskCreate o TodoWrite, esta versión los rompe silenciosamente en Sonnet 5 y Opus 4.8: verificá antes de actualizar.",
 more:{detail:"La v2.1.233 consolida el soporte de GitLab en Claude Code: el flag --worktree ahora acepta URLs de merge requests de GitLab y la vista de agentes los muestra como !N (análogo a #N para PRs de GitHub). La deprecación de herramientas de tareas es el cambio más disruptivo: TaskCreate, TaskGet, TaskUpdate, TaskList y TodoWrite ya no están disponibles por defecto en Opus 4.8, Sonnet 5, Fable 5, Mythos 5 ni en modelos más nuevos. Para restaurarlas temporalmente mientras migrás tu workflow, seteá CLAUDE_CODE_ENABLE_TODO_TOOLS=1. El nuevo control de memory cgroup para Linux (opt-in con CLAUDE_CODE_TOOL_MEMORY_LIMIT) limita el uso de RAM de los comandos Bash sandboxeados, evitando que builds descontrolados cuelguen la sesión. CLAUDE_CODE_WEBFETCH_CACHE_TTL_MS permite configurar el TTL del caché de URLs de WebFetch (default: 15 minutos). La gateway suma forward_user_identity (opt-in): cuando está activado, envía la identidad del usuario autenticado como headers, habilitando la atribución de gasto por usuario en backends proxy. Fixes clave: sesiones en la nube que se marcaban como perdidas al apagarse mientras esperaban un permiso; reconexiones infinitas de MCP v2 contra servidores serverless con timeout fijo; Notification hooks que no se disparaban en Claude Desktop o VS Code; CPU al 100% en sesiones idle en Linux con sandboxing activado.",
   code:["# Restaurar herramientas de tareas en modelos nuevos:","export CLAUDE_CODE_ENABLE_TODO_TOOLS=1","","# Limitar RAM de comandos Bash sandboxeados en Linux:","export CLAUDE_CODE_TOOL_MEMORY_LIMIT=512m   # ej: 512 MB","","# Configurar TTL de caché de WebFetch (default 15 min):","export CLAUDE_CODE_WEBFETCH_CACHE_TTL_MS=900000","","# Worktree con GitLab MR:","claude --worktree https://gitlab.com/org/repo/-/merge_requests/123 -p 'revisá este MR'"],
   links:[["Changelog Claude Code","https://code.claude.com/docs/en/changelog"]]}},
{date:"2026-08-14",tag:"claude code",tagc:"clay",fresh:false,
 title:"Claude Code Desktop: la sesión retoma sola cuando se resetea el límite de uso",
 body:"Claude Code Desktop incorporó un checkbox 'Auto-continue when limits reset': cuando lo activás y la sesión llega al límite de uso, la app espera a que se abra la ventana de uso y retoma la tarea sola, sin que tengas que estar en el teclado. Ideal para builds y agentes desatendidos que corren de noche o entre pausas largas. Por ahora solo está en el app de escritorio; el CLI aún no tiene soporte nativo.",
 why:"Los workflows desatendidos que se paraban a mitad por límite de uso ahora se reanudan solos: dejás correr un agente de noche y al volver encontrás la tarea terminada.",
 more:{detail:"Hasta ahora, cuando Claude Code alcanzaba el límite de uso del plan (techo de 5 horas o semanal), la sesión se detenía y había que volver manualmente a reanudarla. La nueva opción 'Auto-continue when limits reset' en Claude Code Desktop resuelve esto: activando el checkbox antes o en el momento en que se detiene la sesión, la app espera silenciosamente a que se resetee la ventana de uso y retoma la tarea automáticamente, sin interacción. El estado del contexto se preserva entre la pausa y la reanudación. El cambio no afecta cómo se calculan los límites ni los tamaños de las ventanas de uso: solo elimina la intervención manual para continuar. La funcionalidad es exclusiva del app de escritorio por ahora; el CLI no la tiene de manera nativa.",
   code:["# En Claude Code Desktop:","# Activar el checkbox 'Auto-continue when limits reset'","# antes o durante una sesión larga o desatendida.","","# En el CLI, mientras no hay soporte nativo:","# Proyecto claude-auto-retry en GitHub para retomar sesiones automáticamente"],
   links:[["Issue original (feature request)","https://github.com/anthropics/claude-code/issues/18980"],["Changelog Claude Code","https://code.claude.com/docs/en/changelog"]]}},
{date:"2026-08-14",tag:"claude code",tagc:"clay",fresh:false,
 title:"Auto mode pasa a ser el default para Pro, Max y Team",
 body:"A partir del 14 de agosto, las sesiones nuevas de Claude Code en planes Pro, Max y Team arrancan en auto mode: Claude ejecuta sin pedir aprobación en cada paso, salvo que detecte acciones irreversibles, destructivas o fuera del entorno de trabajo. Para Enterprise, API, Bedrock, Vertex y Foundry el cambio sigue siendo opt-in.",
 why:"Si usás Claude Code en plan pago, ya no necesitás activar auto mode a mano: llega activado desde el inicio de sesión. Revisá que los permisos de tus proyectos reflejen lo que querés.",
 more:{detail:"Auto mode usa un clasificador interno que evalúa cada tool call antes de ejecutarlo y bloquea acciones determinadas como irreversibles, destructivas o fuera del entorno de confianza. Según Anthropic, el clasificador bloqueó 937 de 1.053 comandos peligrosos en pruebas internas (vs. 143 detectados por testers humanos). El cambio aplica a sesiones nuevas en Pro, Max y Team a partir del 14 de agosto. Los planes Enterprise, API, Amazon Bedrock, Vertex AI, Foundry y AWS quedan opt-in mientras los admins revisan la configuración de sus plataformas. Si querés volver al modo de confirmación paso a paso, podés desactivarlo con disableAutoMode en .claude/settings.json o con la variable de entorno correspondiente.",
   code:["# Desactivar auto mode en un proyecto (.claude/settings.json):","{ \"disableAutoMode\": true }","","# Verificar configuración actual:","claude config","","# Forzar auto mode explícitamente en cualquier plan:","claude --mode auto -p 'tu tarea'"],
   links:[["Blog: Auto mode default en Claude Code","https://claude.com/blog/auto-mode-default-in-claude-code"],["Changelog Claude Code","https://code.claude.com/docs/en/changelog"]]}},
{date:"2026-08-12",tag:"claude code",tagc:"clay",fresh:false,
 title:"v2.1.229: keepalives para Bedrock/Vertex, plugins desde comando local y ListAgents mejorado",
 body:"Cuatro mejoras en v2.1.229. Los gateways de Vertex y Bedrock ya no desconectan durante pausas largas de thinking: Claude Code manda keepalive pings SSE para mantener el stream vivo. Los plugins ahora pueden resolverse desde un comando local (tu IDE imprime el path del plugin, se re-resuelve cada sesión sin reiniciar). ListAgents distingue sesiones de Remote Control offline de sesiones en la nube. Y los self-hosted runners soportan server-supplied hooks.",
 why:"Si tus sesiones se cortaban en Bedrock o Vertex mientras Opus 5 razonaba largo rato, el keepalive las mantiene vivas sin intervención manual.",
 more:{detail:"La v2.1.229 apunta a la estabilidad en gateways cloud y a nuevas capacidades de plugins. Los keepalive pings SSE resuelven un problema frecuente en Vertex y Bedrock: cuando el modelo hace una pausa larga de thinking, el gateway detecta idle y cierra el stream. Ahora Claude Code manda pings periódicos para mantener la conexión viva. El source 'command' en plugins permite que un comando local (por ej., tu IDE) devuelva el directorio del plugin al inicio de cada sesión en lugar de usar una ruta fija; con mode:'link' el directorio se usa directamente sin reiniciar. ListAgents ahora diferencia entre sesiones de Remote Control desconectadas (status: 'offline') y sesiones en la nube de tu cuenta de claude.ai (status: 'cloud'). Los self-hosted runners pasan a soportar server-supplied hooks, igualando el comportamiento de los managed environments. Fixes incluidos: respuestas largas que se imprimían dos veces en el terminal, crashes en Windows con paths extendidos o UNC, crashes en terminales angostas al renderizar tablas o barras de progreso, y stalls de varios segundos al editar archivos con miles de diagnósticos de IDE mientras la extensión está conectada.",
   code:["# El keepalive es automático para Bedrock/Vertex; solo actualizá:","claude update   # actualizá a v2.1.229 o superior","","# Plugin desde comando local (en el manifest del plugin):","# { \"source\": { \"type\": \"command\", \"command\": \"mi-ide plugin-dir\", \"mode\": \"link\" } }","","# ListAgents ahora muestra estado cloud u offline:","# ListAgents()  →  sessions[{ name: '...', status: 'cloud' | 'offline' | 'online' }]"],
   links:[["Changelog Claude Code v2.1.229","https://code.claude.com/docs/en/changelog"]]}},
{date:"2026-08-08",tag:"claude code",tagc:"clay",fresh:false,
 title:"v2.1.225: aviso de límite de gasto del gateway y trust prompt para agentes",
 body:"La v2.1.225 trae dos novedades de calidad de vida para builders. El mensaje de 'límite alcanzado' del gateway ahora muestra el cap exacto, cuándo se resetea y el mensaje del operador, en lugar de un error genérico. Además, se sumó el workspace trust prompt a claude agents, igualando su comportamiento de seguridad al del comando claude para directorios no confiables. También llegaron fixes importantes para sesiones headless con OAuth y para MCP en macOS.",
 why:"Si distribuís Claude Code vía gateway con límites de gasto por equipo, ahora tus usuarios ven exactamente cuándo y cómo se resetea el límite en lugar de un error opaco.",
 more:{detail:"La v2.1.225 llega con mejoras orientadas a deploys en entornos controlados. El soporte de gateway spend-limit enriquece el mensaje de error cuando se alcanza el cap de gasto: en lugar de un mensaje genérico, el usuario ve el monto del cap, el momento exacto del reseteo y el mensaje personalizado del operador (requiere gateway en v2.1.225+). Clave para equipos que distribuyen Claude Code con presupuestos por usuario o equipo vía gateway. El workspace trust prompt para claude agents iguala el comportamiento de seguridad con el comando claude: al trabajar en directorios no confiables, ahora pide confirmación antes de proceder. Fixes importantes: se corrigió el problema donde un OAuth token de larga vida (CLAUDE_CODE_OAUTH_TOKEN) era reemplazado transitoriamente por el token corto del login, rompiendo sesiones headless hasta el reinicio; y se arregló el fallo intermitente de servidores MCP OAuth en macOS que causaba errores 401 en burst después de un timeout en la lectura del keychain.",
   code:["# El mensaje de límite ahora muestra el cap y el tiempo de reset:","# 'Límite de gasto alcanzado: $50 / reset en 2h 15min / <mensaje del operador>'","","# El gateway debe estar en v2.1.225+ para enviar el mensaje enriquecido","","# OAuth token de larga vida en headless ya funciona sin rotación inesperada:","export CLAUDE_CODE_OAUTH_TOKEN=tu-token-de-larga-vida","","# claude agents ahora pide trust igual que claude en directorios no confiables"],
   links:[["Changelog Claude Code","https://code.claude.com/docs/en/changelog"]]}},
{date:"2026-08-07",tag:"api",tagc:"slate",fresh:false,
 title:"Managed Agents: presupuesto por sesión, advisor estratégico y ejecución geo-controlada",
 body:"Cuatro novedades grandes para la API de Managed Agents. Podés poner un techo de gasto a cada sesión (budget_reached la pausa sin perder el estado). Podés agregar un advisor: un modelo más capaz que el agente que se consulta a mitad de turno para decisiones estratégicas. Podés controlar en qué región corre la inferencia. Y los skills del repo GitHub montado se auto-descubren al inicio de la sesión.",
 why:"El presupuesto por sesión y el advisor son los cambios más grandes: el primero da control de costos granular sin terminar la sesión; el segundo permite arquitecturas donde un modelo barato escala al caro solo cuando lo necesita.",
 more:{detail:"Las cuatro novedades de Managed Agents del 7 de agosto. (1) Session budgets: al crear o actualizar una sesión podés pasarle un presupuesto (hard cap en moneda de lista pública). Si la sesión llega al techo se detiene con stop_reason: 'budget_reached' en lugar de lanzar un error; cambiando o sacando el budget se reanuda sin perder estado. Los deployments aceptan el mismo budget y lo aplican a cada sesión que inician. (2) Session advisor: un modelo de al menos la misma capacidad que el agente, configurado como {'type': 'advisor'} en el roster multiagente, que el thread principal puede consultar en medio de un turno para orientación estratégica. Ideal para arquitecturas donde un modelo barato maneja la mayoría de las tareas y escala a uno caro en los momentos críticos. (3) Inference geo: control de dónde corre la inferencia del modelo. Se configura con inference_geo dentro del objeto model al crear el agente, o se puede sobrescribir por sesión individual. (4) Skills desde GitHub: cuando una sesión monta un repositorio de GitHub, los skills en el directorio .claude/skills/ de la raíz del repo se descubren automáticamente al inicio de la sesión y quedan disponibles para el agente.",
   code:["# Session budget al crear o actualizar una sesión:","# POST /v1/sessions  →  { 'budget': { 'amount': 10.00, 'currency': 'USD' } }","# stop_reason: 'budget_reached' pausa sin perder estado","# Cambiar o eliminar el budget reanuda la sesión","","# Advisor estratégico en el roster del agente:","# POST /v1/agents","# { 'multiagent': [{ 'type': 'advisor', 'model': 'claude-opus-5' }] }","","# Controlar la geo de inferencia:","# POST /v1/agents","# { 'model': { 'id': 'claude-sonnet-5', 'inference_geo': 'eu' } }","","# Skills desde GitHub (se auto-cargan al montar el repo):","# Poné tus skills en .claude/skills/ en la raíz del repo"],
   links:[["Release notes API — agosto 2026","https://platform.claude.com/docs/en/release-notes/overview"],["Docs: Session budgets","https://platform.claude.com/docs/en/managed-agents/budgets"],["Docs: Advisor","https://platform.claude.com/docs/en/managed-agents/multiagent-orchestration"]]}},
{date:"2026-08-07",tag:"claude code",tagc:"clay",fresh:false,
 title:"v2.1.224: self-hosted runner, mensajes entre sesiones y plugins desde zip",
 body:"Cuatro novedades grandes en una versión. El nuevo comando claude self-hosted-runner convierte tus propias máquinas o containers en entornos de ejecución para sesiones de Claude Code web, mobile y desktop (beta en planes Team y Enterprise). Cross-session SendMessage permite que sesiones de Claude Code se envíen mensajes entre sí en cualquiera de tus máquinas (macOS y Linux). El nuevo source archive para plugins permite instalar plugins desde un zip por HTTPS sin necesitar git ni npm, con pin opcional de SHA-256. Y se removió el cap de 200 subagentes por sesión: las sesiones largas ya no rechazan agentes nuevos.",
 why:"Self-hosted runner es el cambio más grande para equipos con restricciones de red o compliance: las sesiones corren en tu propia infra en lugar de los servidores de Anthropic.",
 more:{detail:"La v2.1.224 trae el lanzamiento en beta pública de self-hosted environments: con claude self-hosted-runner, cualquier máquina Linux con Docker puede convertirse en un runner que atiende sesiones de Claude Code desde la web, el móvil o el desktop. Los runners se configuran desde el admin de claude.ai y soportan dos modos — Fixed (N runners siempre activos, las sesiones se distribuyen) y On-demand (el orquestador levanta runners cuando llegan sesiones y los baja cuando terminan). Disponible para planes Team y Enterprise. Cross-session messaging: ListAgents descubre todas las sesiones activas de Claude Code en tus máquinas; SendMessage les envía mensajes entre sí. Los mensajes a sesiones con permisos bypass requieren aprobación del usuario. Configurable con crossSessionInbound y dialogExpiry en settings. El source archive para plugins permite hacer /install-plugin con una URL HTTPS a un zip, con SHA-256 opcional para verificar integridad sin necesitar git, npm ni un registry. También: ANTHROPIC_BEDROCK_REGION_PREFIX para preferir perfiles de inferencia cross-region específicos, y mejoras en el enmascarado de credenciales del sandbox (JWT-aware con maskClaims, AWS SigV4 con awsPairs/sigv4).",
   code:["# Levantar un self-hosted runner:","claude self-hosted-runner","# (o solo para una sesión: claude self-hosted-runner --once)","","# Descubrir sesiones activas y enviarles mensajes:","# ListAgents()  →  lista sesiones disponibles","# SendMessage({ to: 'nombre-sesion', message: '...' })","","# Instalar plugin desde zip (con SHA-256 opcional):","# /install-plugin https://mi-server.com/plugin.zip#sha256:abc123","","# Preferir región de Bedrock:","export ANTHROPIC_BEDROCK_REGION_PREFIX=us-east-1"],
   links:[["Changelog Claude Code v2.1.224","https://code.claude.com/docs/en/changelog"],["Docs: self-hosted environments","https://platform.claude.com/docs/en/managed-agents/self-hosted-sandboxes"]]}},
{date:"2026-08-05",tag:"api",tagc:"slate",fresh:false,
 title:"Inference Hooks: tu servidor DLP inspecciona cada prompt antes de que Claude lo vea",
 body:"Anthropic lanzó en beta para Enterprise un checkpoint de seguridad que se inserta antes de cada generación. Configurás un endpoint HTTPS propio y Anthropic le manda por WebSocket firmado el transcript completo de la conversación, incluyendo prompts y tool calls. El servidor responde allow o deny, y Claude solo genera si recibe allow. Corre en chat, Claude Code, Cowork y cualquier otro surface de Enterprise.",
 why:"Los equipos de compliance ahora pueden aplicar las mismas políticas DLP que ya tienen para email y web a todas las interacciones con Claude, desde un solo punto de configuración a nivel organización.",
 more:{detail:"Los Inference Hooks son una capa de inspección inline que Anthropic inserta en el pipeline de Enterprise: cada request que llega a Claude primero se envía al servidor DLP de tu organización (o de un proveedor de seguridad). El servidor recibe el transcript completo de la conversación en un POST HTTPS firmado por Anthropic, tiene un timeout de 5 segundos para responder, y devuelve allow o deny. Solo con allow Claude genera la respuesta. La configuración es a nivel de organización, así que todos los surfaces (chat.claude.ai, Claude Code, Cowork) quedan cubiertos con un solo setup sin tocar los clientes. La decisión es binaria: el servidor puede bloquear pero no puede reescribir ni redactar partes del prompt. El canal usa WebSocket firmado para garantizar la integridad del transcript. Disponible en beta para clientes Enterprise.",
   code:["# Configuración en el admin de Claude Enterprise:","# Settings → Security → Inference Hooks → Agregar endpoint","","# El webhook que recibe tu servidor:","# POST https://tu-servidor.com/dlp-hook","# Body: { conversation: [...], surface: 'claude-code' | 'chat' | 'cowork', ... }","","# Tu servidor responde:","# { action: 'allow' }","# { action: 'deny', message: 'Mensaje visible al usuario' }","","# Timeout: 5 segundos (sin respuesta → deny por defecto)"],
   links:[["Blog: Claude Enterprise Inference Hooks","https://claude.com/blog/claude-enterprise-inference-hooks"],["Docs: Inference Hooks","https://platform.claude.com/docs/en/managed-agents/inference-hooks"]]}},
{date:"2026-08-04",tag:"claude code",tagc:"clay",fresh:false,
 title:"v2.1.221: Focus View en VSCode, enmascarado de credenciales en sandbox y sesiones en fondo más prolijas",
 body:"Cuatro novedades para builders. Focus View en VSCode (Ctrl+Alt+F) colapsa toda la actividad de herramientas en un resumen expandible por turno con indicador en vivo, ideal para trabajar sin ruido visual. El nuevo mode: 'mask' en archivos de credenciales del sandbox deja que el agente lea una copia centinela mientras el proxy sustituye el valor real al salir. Las sesiones en background ahora hacen commit y push para preservar el trabajo y solo abren un draft PR cuando la tarea lo requiere. El panel de Stats muestra cache tokens desglosados (input, output, cache read, cache write).",
 why:"Las sesiones programadas ya no pierden trabajo si el contenedor se reinicia; el enmascarado de credenciales resuelve el acceso seguro a secrets en sandboxes sin exponer el archivo real.",
 more:{detail:"v2.1.221 llega con cambios de UX, seguridad y comportamiento de fondo. Focus View es un nuevo toggle en el menú del chat de VSCode: al activarlo (Ctrl+Alt+F o 'Claude Code: Toggle Focus view'), toda la actividad de herramientas se colapsa en un resumen expandible por turno con un indicador visual de herramienta activa, útil cuando el flujo de tool calls es muy verboso. El nuevo sandbox credential masking (Linux/WSL) agrega mode: 'mask' a la configuración de archivos de credenciales en el sandbox: los comandos sandboxeados leen una copia centinela del archivo (completa o solo los spans capturados por un regex extract), mientras que el proxy del sandbox sustituye el valor real en el egress; en macOS cae automáticamente a deny. Cambio importante en sesiones background: ahora hacen commit y push al terminar para preservar el trabajo, abren un draft PR solo cuando la tarea lo pide, siguen las instrucciones de git del CLAUDE.md, y siempre reportan dónde queda el trabajo. El panel de Stats suma los cache tokens al total y los muestra desglosados. La skill claude-api suma el subcomando prompt-audit para detectar patrones de prompts escritos para modelos viejos. Claude plugin validate ahora lanza warnings cuando el nombre del plugin sería rechazado por el marketplace de Claude Desktop. En seguridad: fix de bypass en condicionales regex [[ ]] de zsh, fix de paths con comillas en PowerShell, fix de MCP servers de --mcp-config que no conectaban antes del primer turno en modo -p.",
   code:["# Focus View en VSCode:","Ctrl+Alt+F  →  toggle 'Claude Code: Toggle Focus view'","","# Credential masking en .claude/settings.json (Linux/WSL):","# { \"sandbox\": { \"credentials\": [{ \"path\": \"/home/user/.netrc\", \"mode\": \"mask\", \"extract\": \"password\\\\s+(\\\\S+)\" }] } }","","# Prompt Audit en la skill claude-api:","# /claude-api prompt-audit   →  detecta patrones de prompts para modelos viejos","","# Sesiones background ahora:","# - hacen commit + push al terminar","# - abren draft PR solo si la tarea lo requiere","# - siguen instrucciones git del CLAUDE.md"],
   links:[["Changelog Claude Code v2.1.221","https://code.claude.com/docs/en/changelog"]]}},
{date:"2026-07-24",tag:"modelo",tagc:"berry",fresh:false,
 title:"Claude Opus 5: el nuevo modelo insignia con 1M de contexto y control de esfuerzo",
 body:"Anthropic lanzó Opus 5 el 24 de julio: el nuevo modelo flagship con ventana de contexto de 1M tokens, hasta 128K tokens de salida síncrona y un control de esfuerzo de 5 niveles por request (low a max). Pasa a ser el modelo por defecto en Claude Code en lugar de Opus 4.8. El precio estándar de API se mantiene en $5 entrada / $25 salida por millón de tokens; fast mode cuesta $10/$50.",
 why:"El modelo más potente de Anthropic actualizado sin cambio de precio: más contexto, más salida y esfuerzo configurable por request.",
 more:{detail:"Opus 5 es el mayor salto de la familia Opus en mucho tiempo. Sus características principales: ventana de contexto nativa de 1M tokens; hasta 128K tokens de salida síncrona; effort control per-request en 5 niveles (low, medium, high, xhigh, max) que permite balancear velocidad y profundidad de razonamiento según la tarea; y el mejor perfil de benchmarks que Anthropic ha publicado para la familia Opus. El ID de la API es claude-opus-5, y es ahora el default del rol Opus en Claude Code y en las plataformas Bedrock, Vertex y Foundry. El precio de API estándar se mantiene respecto a la generación anterior: $5 por millón de tokens de entrada y $25 por millón de salida. En fast mode (que ahora usa Opus 5 en lugar de Opus 4.7) el precio es $10 entrada / $50 salida por millón. Disponible también en Amazon Bedrock, Google Vertex AI y Microsoft Foundry.",
   code:["# ID del modelo en la API:","claude-opus-5","","# Usar Opus 5 en Claude Code:","claude --model claude-opus-5 -p 'tu tarea'","","# Fast mode ahora apunta a Opus 5 (y Opus 4.8):","# /fast  en Claude Code activa el modo rápido con Opus 5"],
   links:[["Docs: novedades de Opus 5","https://platform.claude.com/docs/en/about-claude/models/whats-new-opus-5"],["Changelog Claude Code v2.1.219","https://code.claude.com/docs/en/changelog"]]}},
{date:"2026-07-24",tag:"claude code",tagc:"clay",fresh:false,
 title:"v2.1.219: subagentes hasta profundidad 3, hook DirectoryAdded y red estricta en sandbox",
 body:"Tres novedades para builders de multi-agentes en v2.1.219: el nesting de subagentes pasa de depth 0 (deshabilitado en v2.1.217) a 3 como default, habilitando pipelines más profundos sin configuración extra. El nuevo hook DirectoryAdded se dispara cuando se registra un directorio con /add-dir o register_repo_root. Y sandbox.network.strictAllowlist deniega automáticamente las conexiones a hosts no incluidos en la allowlist.",
 why:"El nesting de profundidad 3 habilita pipelines de agentes más complejos out-of-the-box; la red estricta da control total sobre las conexiones salientes del sandbox.",
 more:{detail:"La v2.1.219 ajusta el comportamiento de nesting de subagentes que llegó en v2.1.217 (21 de julio): la profundidad máxima por defecto sube de 0 (deshabilitado) a 3, permitiendo que un subagente genere sub-subagentes hasta 3 niveles. Seguís pudiendo configurarlo con CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH. El nuevo hook DirectoryAdded se activa cada vez que se añade un directorio de trabajo a la sesión (vía /add-dir en la CLI o el request SDK register_repo_root), útil para pipelines que inicializan su entorno dinámicamente y necesitan correr algo al registrar un nuevo repo. El nuevo setting sandbox.network.strictAllowlist: true en settings.json hace que las conexiones salientes a hosts que no estén en la allowlist sean denegadas sin mostrar diálogo de confirmación, a diferencia del comportamiento previo que preguntaba al usuario. También: Opus 4.7 sale de fast mode (ahora /fast usa Opus 5 y Opus 4.8), y la skill claude-api pasa a tener Opus 5 como modelo por defecto.",
   code:["# Profundidad de nesting de subagentes (default desde v2.1.219: 3):","export CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH=3   # ajustá si necesitás otro valor","","# Hook DirectoryAdded en .claude/settings.json:","# \"hooks\": { \"DirectoryAdded\": [{ \"hooks\": [{ \"type\": \"command\", \"command\": \"echo nuevo dir: $CLAUDE_ADDED_DIR\" }] }] }","","# Red estricta en sandbox (.claude/settings.json):","# { \"sandbox\": { \"network\": { \"strictAllowlist\": true } } }"],
   links:[["Changelog Claude Code","https://code.claude.com/docs/en/changelog"]]}},
{date:"2026-07-22",tag:"api",tagc:"slate",fresh:false,
 title:"API de memoria de agentes: nuevo comportamiento de listado (se activa para todos hoy)",
 body:"A partir de hoy, el header managed-agents-2026-04-01 adopta automáticamente el mismo comportamiento que el nuevo agent-memory-2026-07-22: los resultados se devuelven en orden estable definido por el servidor (sin order_by ni order), depth solo acepta 0 o 1, y path_prefix debe terminar en /. Los SDKs de Python, TypeScript, Go, Java, Ruby, PHP, C# y CLI ya envían el nuevo header por defecto en todas las llamadas a memory stores.",
 why:"Si usás GET /v1/memory_stores/{id}/memories con paginación, tus cursores de página emitidos con el header viejo dejan de funcionar hoy: reiniciá desde la primera página.",
 more:{detail:"El 2 de julio Anthropic publicó el header agent-memory-2026-07-22 como preview opt-in con un nuevo comportamiento de listado de memorias. Desde hoy (22 de julio) ese comportamiento se vuelve el default para todo el mundo que usa el viejo header managed-agents-2026-04-01. Los cambios en el endpoint GET /v1/memory_stores/{memory_store_id}/memories son: resultados en orden estable definido por el servidor (ignorando order_by y order); depth acepta solo 0, 1, o puede omitirse — cualquier otro valor devuelve 400; path_prefix debe terminar en / y hace matching por segmentos de ruta completos, no por substring. Los SDKs actualizados (Python 0.116.0, TypeScript 0.110.0, Go 1.56.0, Java 2.48.0, Ruby 1.55.0, PHP 0.36.0, C# 12.35.0, CLI 1.16.0) ya envían el nuevo header. Si enviás ambos headers en la misma request obtenés error 400.",
   code:["# El nuevo header reemplaza al viejo en memory store calls:","# Antes: anthropic-beta: managed-agents-2026-04-01","# Ahora: anthropic-beta: agent-memory-2026-07-22","","# depth: solo acepta 0 o 1  (otros valores → 400)","# path_prefix: debe terminar en /  (ej: 'user/prefs/' no 'user/prefs')","# Cursores emitidos sin el nuevo header no son válidos — reiniciá desde la primera página"],
   links:[["Release notes API — julio 2026","https://platform.claude.com/docs/en/release-notes/overview"],["Docs: Using agent memory","https://platform.claude.com/docs/en/managed-agents/memory"]]}},
{date:"2026-07-21",tag:"claude code",tagc:"clay",fresh:false,
 title:"v2.1.217: cap de 20 subagentes concurrentes y nesting deshabilitado por defecto",
 body:"Dos cambios que afectan directo a builders de workflows multi-agente: el límite de subagentes corriendo en paralelo es ahora 20 por defecto (configurable con CLAUDE_CODE_MAX_CONCURRENT_SUBAGENTS), y los subagentes ya no pueden crear sub-subagentes por defecto (configurable con CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH). Además, --max-budget-usd ahora también detiene los subagentes en background al alcanzar el techo de gasto.",
 why:"Si tenés pipelines que generan muchos subagentes en paralelo, ahora hay un techo que previene el runaway delegation y los gastos descontrolados.",
 more:{detail:"La v2.1.217 introduce límites por defecto en la creación de subagentes. El cap concurrente es 20: si tu workflow lanza más de 20, los extras quedan en cola hasta que se libere un slot. El nesting de subagentes — que un subagente genere otro subagente — queda deshabilitado por defecto (depth 0) para prevenir cadenas de delegación descontroladas. Ambos valores son configurables con variables de entorno. El flag --max-budget-usd, que antes solo controlaba el presupuesto de la sesión principal, ahora también frena a los subagentes en background cuando se alcanza el límite. Otros cambios de la versión: emoji shortcode autocomplete en el prompt input (`:heart:` → ❤️, desactivable con emojiCompletionEnabled), fix de memory leak en MCP tool outputs truncados, fix del auto-updater de Windows que no restauraba claude.exe en fallos, y corrección de isolación de symlinks en worktrees.",
   code:["# Configurar el límite de subagentes concurrentes:","export CLAUDE_CODE_MAX_CONCURRENT_SUBAGENTS=10   # default: 20","","# Permitir nesting de subagentes (profundidad máxima):","export CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH=2   # default: 0 (deshabilitado)","","# El cap de gasto ahora también aplica a subagentes background:","claude --max-budget-usd 5 -p 'tu tarea con agentes'"],
   links:[["Changelog Claude Code","https://code.claude.com/docs/en/changelog"]]}},
{date:"2026-07-20",tag:"claude code",tagc:"clay",fresh:false,
 title:"v2.1.216: fix crítico de stalls en sesiones largas + sandbox.filesystem.disabled",
 body:"Fix urgente para quien usa Claude Code en sesiones de muchas horas: la normalización de mensajes tenía costo cuadrático con el número de turnos, causando stalls de varios segundos que empeoraban a medida que crecía la sesión. También llegó sandbox.filesystem.disabled: true, un nuevo setting que desactiva el aislamiento de filesystem sin perder el control de egress de red.",
 why:"Si trabajás con sesiones largas o pipelines de muchos pasos, esta versión puede hacer que tu setup pase de lento a fluido sin cambiar una línea de código.",
 more:{detail:"El bug de message normalization en v2.1.216 es uno de los fixes de rendimiento más impactantes de los últimos meses: el algoritmo que normalizaba los mensajes entre turnos tenía complejidad O(n²) donde n es la cantidad de turnos de la sesión. En sesiones largas — horas de trabajo, cientos de mensajes — esto causaba stalls de varios segundos al escribir cada respuesta, y hacer resumen de la sesión se volvía lento. La corrección es transparente: actualizás y el problema desaparece. El nuevo setting sandbox.filesystem.disabled: true en settings.json permite que el agente acceda al filesystem del host directamente, sin el overhead del sandbox de aislamiento, pero manteniendo activo el control de egress de red. Útil cuando el aislamiento de filesystem es contraproducente (por ejemplo, al leer grandes volúmenes de archivos en un pipeline de procesamiento). Otros fixes: auto mode ya no falla con 'HTTP 401' cuando el OAuth token expira o rota durante una sesión; Claude Code en la web ya no repite la misma pregunta después de que la sesión queda idle.",
   code:["# En .claude/settings.json, para deshabilitar el aislamiento del filesystem:","{ \"sandbox\": { \"filesystem\": { \"disabled\": true } } }","","# El fix de rendimiento no requiere ningún cambio de configuración:","claude update   # actualizá a v2.1.216 o superior"],
   links:[["Changelog Claude Code","https://code.claude.com/docs/en/changelog"]]}},
{date:"2026-07-19",tag:"claude code",tagc:"clay",fresh:false,
 title:"v2.1.215: /verify y /code-review ya no se disparan solos",
 body:"Cambio de comportamiento: Claude ya no ejecuta automáticamente las skills /verify y /code-review al final de una tarea. Ahora tenés que invocarlas explícitamente cuando las necesitás. El comportamiento anterior podía generar consumo extra de tokens y revisiones no solicitadas en pipelines automáticos.",
 why:"Tus pipelines y agentes desatendidos ya no consumen tokens en revisiones automáticas que no pediste.",
 more:{detail:"Hasta v2.1.214, Claude Code ejecutaba /verify y /code-review automáticamente al completar tareas cuando esas skills estaban activas en la sesión. Desde v2.1.215 ese comportamiento cambió: las skills siguen disponibles pero se ejecutan solo cuando las invocás explícitamente. Esto da control total sobre cuándo se hace una verificación o revisión de código, evitando gastos extra de tokens en workflows donde no querés ese paso automático.",
   code:["/verify               # verificá un cambio cuando vos lo decidís","/code-review medium   # revisá el diff con el nivel que necesitás","# ya no se ejecutan solas al terminar una tarea"],
   links:[["Changelog v2.1.215","https://code.claude.com/docs/en/changelog"]]}},
{date:"2026-07-18",tag:"claude code",tagc:"clay",fresh:false,
 title:"v2.1.214: mega fix de permisos + EndConversation + OTel por mensaje",
 body:"La versión con más cambios de seguridad en mucho tiempo: 7 correcciones de permisos (bypass en PowerShell 5.1, comandos de más de 10.000 caracteres, redirección de descriptores de archivo), la nueva herramienta EndConversation para que Claude corte sesiones abusivas, latido de progreso en llamadas largas de herramientas, y atributos OTel a nivel de mensaje para trazabilidad fina.",
 why:"Los fixes de permisos cierran vectores de bypass reales en auto mode; los atributos OTel nuevos te permiten correlacionar llamadas a herramientas con mensajes específicos en tu telemetría.",
 more:{detail:"v2.1.214 llega con el mayor lote de correcciones de permisos en mucho tiempo. Los bugs cerrados incluyen: reglas dir/** que auto-aprobaban escrituras en subdirectorios anidados en lugar de solo en <cwd>/dir; bypass en sesiones de PowerShell 5.1; comandos de más de 10.000 caracteres que se auto-aprobaban; formas de redirección de descriptores de archivo que el analizador de permisos no parseaba igual que bash; modificadores de variables zsh en comparaciones [[ ]] tratados como texto inerte; y diálogos de permiso en sesiones remotas que avanzaban antes de la confirmación local. La nueva herramienta EndConversation permite a Claude terminar sesiones con usuarios altamente abusivos o intentos de jailbreak, igual a como funciona en claude.ai desde 2025. En telemetría: tres atributos nuevos en los logs OTel (message.uuid, client_request_id, tool_source) para correlación a nivel de mensaje y procedencia de herramientas; y la variable CLAUDE_CODE_OTEL_CONTENT_MAX_LENGTH para controlar el límite de truncamiento (default 60 KB) en atributos de contenido. También: latido de progreso periódico en llamadas largas de herramientas para que no queden en silencio, y corrección de que tareas programadas rechazaban su propio prompt configurado como input no confiable.",
   code:["# Nueva variable para controlar el límite de contenido en OTel:","export CLAUDE_CODE_OTEL_CONTENT_MAX_LENGTH=100000   # bytes (default: 60000)","# Atributos nuevos en logs OTel:","# message.uuid → correlación a nivel de mensaje","# client_request_id → ID de request del cliente","# tool_source → procedencia de la herramienta","","# Cambio en reglas de permisos (importante si usás allow rules):","# dir/**    → solo coincide con <cwd>/dir  (antes: cualquier nivel del árbol)","# **/dir/** → coincide en cualquier profundidad (la nueva forma correcta)"],
   links:[["Changelog v2.1.214","https://code.claude.com/docs/en/changelog"],["Investigación EndConversation","https://www.anthropic.com/research/end-subset-conversations"]]}},
{date:"2026-07-15",tag:"claude code",tagc:"clay",fresh:false,
 title:"v2.1.211: --forward-subagent-text, fix de prompt-caching en Bedrock/Vertex y permisos por repo",
 body:"La versión más cargada de fixes en mucho tiempo. Lo más impactante para builders: el nuevo flag --forward-subagent-text incluye el output de subagentes en el stream JSON (útil para monitorear pipelines multi-agente); se corrige el bug de prompt-caching en Bedrock, Vertex, Mantle y Foundry que facturaba el bloque de sistema como tokens frescos en cada request; y los permisos 'always allow' ahora se guardan en la raíz del repo y persisten en todos los worktrees de la sesión.",
 why:"El fix de prompt-caching en Bedrock/Vertex puede bajar tus costos directamente; el fix de modelo en subagentes hace los workflows multi-agente más predecibles.",
 more:{detail:"v2.1.211 trae un cambio nuevo y un paquete grande de correcciones críticas para builders. El nuevo flag --forward-subagent-text (y su variable CLAUDE_CODE_FORWARD_SUBAGENT_TEXT) lleva el texto y el thinking de subagentes al output stream-json, útil para monitorear pipelines multi-agente desde sistemas externos. En seguridad, se hardeneó la preview de permisos para neutralizar caracteres bidi-override, zero-width y comillas look-alike que podían alterar visualmente el mensaje de aprobación — relevante en flujos donde agentes piden permisos con texto de terceros. También se corrige que auto mode ignoraba la decisión `ask` de un hook PreToolUse para Bash no sandboxed (ahora el hook tiene piso). Otros fixes relevantes: subagentes con override de modelo ya no vuelven al modelo del padre al resumir; las sesiones en paralelo ya no se desloguean todas a la vez al despertar el equipo; los servidores MCP de plugins vuelven a conectar tras una sesión web inactiva; el bug de prompt-caching en Bedrock/Vertex/Mantle/Foundry que facturaba el bloque de sistema como tokens frescos en cada request queda cerrado; los agentes en background muertos por el usuario ya no se auto-respawnean; y /clear ahora resetea correctamente el contador de costo de sesión.",
   code:["# Incluir output de subagentes en stream-json:","claude --output-format stream-json --forward-subagent-text -p 'tu tarea'","# o con variable de entorno:","export CLAUDE_CODE_FORWARD_SUBAGENT_TEXT=1","","# Always allow ahora persiste en todos los worktrees:","# La aprobación se guarda en .claude/settings.json de la raíz del repo"],
   links:[["Changelog v2.1.211","https://code.claude.com/docs/en/changelog"]]}},
{date:"2026-07-11",tag:"claude code",tagc:"clay",fresh:false,
 title:"v2.1.207: Auto mode de serie en Bedrock/Vertex/Foundry + parche de inyección en plugins",
 body:"Dos cambios que impactan directo en builders empresariales. Auto mode ahora está habilitado por defecto en Amazon Bedrock, Vertex AI y Microsoft Foundry: ya no necesitás la variable CLAUDE_CODE_ENABLE_AUTO_MODE para activarlo. Además, se cerró una vulnerabilidad de inyección de shell en hooks de plugins y MCP: la sintaxis ${user_config.*} en comandos de shell queda rechazada y tenés que migrar al formato exec (array de args) o a variables de entorno.",
 why:"Si usás plugins con hooks en formato shell y tenías ${user_config.*}, esta versión te rompe algo — migrá antes de actualizar.",
 more:{detail:"En v2.1.207, auto mode deja de requerir opt-in en Bedrock, Vertex AI y Foundry. Antes había que setear CLAUDE_CODE_ENABLE_AUTO_MODE=1 en el entorno; ahora está habilitado por defecto para esas plataformas y podés desactivarlo con disableAutoMode en settings. Bedrock, Vertex y Claude Platform en AWS también pasan a usar Opus 4.8 como modelo por defecto. En materia de seguridad, el parche más importante cierra una vulnerabilidad de inyección de shell: si tus hooks de plugins, monitors o el headersHelper de MCP usan la sintaxis ${user_config.*} en comandos de shell, esa sintaxis ahora está rechazada. La migración es a formato exec (array de args) o a leer valores desde variables de entorno con $CLAUDE_PLUGIN_OPTION_<KEY>. También se arreglaron: el congelamiento de la terminal al streamear listas o bloques de código muy largos, que settings remotos se guardaran como consentidos en runs no-interactivos sin mostrar el diálogo, el auto-updater que pisaba symlinks o launchers custom en ~/.local/bin/claude, y múltiples bugs de corrupción en .git/config de worktrees.",
   code:["# Para deshabilitar auto mode en Bedrock/Vertex si no lo querés:","# en settings.json: { \"disableAutoMode\": true }","","# Migración de hooks: de formato shell a exec","# Antes (rechazado desde v2.1.207):","# { \"type\": \"command\", \"command\": \"mi-tool ${user_config.api_key}\" }","# Después (formato exec):","# { \"type\": \"command\", \"command\": \"mi-tool\", \"args\": [\"$CLAUDE_PLUGIN_OPTION_API_KEY\"] }"],
   links:[["Changelog v2.1.207","https://code.claude.com/docs/en/changelog"],["GitHub Release v2.1.207","https://github.com/anthropics/claude-code/releases/tag/v2.1.207"]]}},
{date:"2026-07-09",tag:"claude code",tagc:"clay",fresh:false,
 title:"v2.1.205–206: /doctor optimiza CLAUDE.md, gateways de Anthropic y auto-upgrade de agentes",
 body:"Dos versiones con mejoras para builders: /doctor ahora analiza los CLAUDE.md chequeados en el repo y propone recortarlos para ahorrar tokens de contexto. /login soporta endpoints públicos de gateway operados por Anthropic (útil en entornos remotos y en Claude Code on the Web). Y los agentes en background se actualizan a la nueva versión de Claude Code automáticamente, sin interrumpir la sesión activa.",
 why:"Si tu proyecto acumula un CLAUDE.md pesado, /doctor te dice qué sacarle antes de que empiece a costar tokens innecesarios.",
 more:{detail:"En v2.1.206, /doctor —el diagnóstico de configuración de Claude Code— ganó una nueva capacidad: analiza los archivos CLAUDE.md que están chequeados en el repo y propone recortarlos si detecta contenido que consume contexto sin aportar valor (secciones repetidas, instrucciones obsoletas, documentación que podría estar en otro lado). Además, /login ahora soporta endpoints públicos de gateway de Anthropic: útil para entornos remotos (Claude Code on the Web, runners de CI) donde el login normal no está disponible. En cuanto a los agentes en background, ahora se actualizan a la versión nueva de Claude Code justo después de una actualización, sin necesidad de reiniciar la sesión. En v2.1.205 se sumó también un bloqueo en auto mode que impide que cualquier proceso externo modifique los archivos de transcripción de sesión, cerrando un vector de manipulación.",
   code:["/doctor   # analizá CLAUDE.md y otras configuraciones del proyecto","/login    # ahora soporta gateways públicos de Anthropic para entornos remotos","# los agentes en background se actualizan solos tras 'claude update'"],
   links:[["Changelog v2.1.206","https://code.claude.com/docs/en/changelog"],["Claude Code on the Web","https://code.claude.com/docs/en"]]}},
{date:"2026-07-08",tag:"api",tagc:"slate",fresh:false,
 title:"API keys con fecha de expiración desde la consola",
 body:"Ya podés configurar una fecha de expiración al crear claves de API o Admin API en la consola de Claude. Elegís un preset, una duración personalizada o 'nunca'. Para claves con vida de al menos 7 días, Anthropic te avisa por mail antes de que venzan. Las claves existentes no se ven afectadas. El Admin API ahora expone el campo expires_at en los endpoints de listado.",
 why:"Si manejás clientes corporativos o tenés que cumplir con SOC 2, ISO 27001 u otras normas, ahora podés rotar claves automáticamente sin acordarte de hacerlo a mano.",
 more:{detail:"La expiración de claves de API es un requisito habitual en entornos con políticas de seguridad estrictas. Desde el 8 de julio, al crear una clave en console.anthropic.com > Settings > API Keys podés elegir cuándo vence: hay presets de 30, 60 y 90 días, una opción de duración personalizada y otra de 'nunca' para las claves de larga vida. Cuando la clave tiene vida útil de al menos 7 días, Anthropic le manda un mail al creador recordándole que está por vencer. El Admin API incorpora el campo expires_at en los endpoints de listado de claves, así podés monitorear los vencimientos de forma programática. Las claves existentes no tienen fecha de expiración y no cambian.",
   code:["# Admin API: GET /v1/organizations/api-keys","# → campo expires_at en cada objeto de clave","# Consola: platform.claude.com/settings/keys → botón 'Create API key' → campo Expiration"],
   links:[["Docs de autenticación y expiración","https://platform.claude.com/docs/en/manage-claude/authentication#key-expiration"],["Consola de Claude","https://platform.claude.com/settings/keys"]]}},
{date:"2026-07-06",tag:"claude code",tagc:"clay",fresh:false,
 title:"v2.1.202: tamaño de workflow configurable, /review vuelve a modo rápido y trazabilidad OTel",
 body:"Tres cambios clave en v2.1.202: /config ahora tiene 'dynamic workflow size' (small/medium/large) para controlar cuántos agentes genera Claude en workflows dinámicos. /review <pr> vuelve a ser revisión de un solo paso rápido — para análisis multi-agente usá /code-review <nivel> <pr#>. Y los workflows emiten atributos OpenTelemetry (workflow.run_id y workflow.name) para armar un trace completo de cada corrida.",
 why:"Con workflow size controlás el gasto de tokens en workflows grandes; la distinción /review vs /code-review aclara cuándo invertir en análisis profundo.",
 more:{detail:"'Dynamic workflow size' en /config es consultivo, no un límite forzado: le indica a Claude qué tan grandes deben ser los workflows dinámicos, pero el modelo puede excederlo si la tarea lo requiere. Los atributos OTel (workflow.run_id y workflow.name) se suman a los ya existentes: con ellos podés agrupar todos los spans de una corrida en Datadog, Grafana o cualquier otro collector y reconstruir el árbol de agentes completo. El cambio en /review es importante: vuelve a ser revisión rápida de un solo paso, ideal para chequeos antes de mergear. Para análisis profundo multi-agente (bugs, seguridad, rendimiento) usá /code-review con nivel medium, high o max. También en esta versión: mejoras en la lista de /workflows (títulos más anchos, columna de tiempo, nombres de modelos más cortos) y mensajes de error más claros en MCP cuando falta el campo type en la config.",
   code:["/config   # buscá 'Dynamic workflow size' y elegí small/medium/large","/review 123             # revisión rápida de un solo paso de la PR #123","/code-review medium 123  # revisión multi-agente más profunda","# atributos OTel disponibles en esta versión:","# workflow.run_id  → ID único de la corrida","# workflow.name   → nombre del workflow"],
   links:[["Changelog v2.1.202","https://code.claude.com/docs/en/changelog"]]}},
{date:"2026-07-03",tag:"claude code",tagc:"clay",fresh:false,
 title:"AskUserQuestion ya no avanza solo + modo de permiso renombrado a 'Manual'",
 body:"Con v2.1.200, los diálogos de AskUserQuestion ya no continúan automáticamente después de un timeout: esperan tu respuesta. Si querés mantener el comportamiento anterior, configuralo con /config. También: el 'modo predeterminado' de permisos ahora se llama 'Manual' en toda la CLI y en las extensiones de VS Code y JetBrains.",
 why:"Agentes desatendidos que preguntan algo ya no avanzan solos: no pasan a un estado inesperado sin tu aprobación.",
 more:{detail:"Hasta v2.1.199, cuando un agente ejecutaba AskUserQuestion y vos no respondías en el tiempo configurado, el agente continuaba automáticamente con el valor por defecto. Desde v2.1.200 ese comportamiento cambió: por defecto el agente espera indefinidamente hasta que respondas. Si necesitás el comportamiento anterior (que continúe después de un timeout inactivo), configuralo con /config. En cuanto al naming, el modo de permiso que antes se llamaba 'default' ahora se llama 'Manual' en la CLI, la ayuda, VS Code y JetBrains — en settings.json también se acepta 'default' por retrocompatibilidad.",
   code:["/config   # para configurar el timeout inactivo de AskUserQuestion","# en settings.json: \"defaultMode\": \"manual\"  (o \"default\", igual funciona)","# --permission-mode manual  también funciona en CLI"],
   links:[["Changelog v2.1.200","https://code.claude.com/docs/en/changelog"]]}},
{date:"2026-07-02",tag:"claude code",tagc:"clay",fresh:false,
 title:"Skills apiladas: `/skill-a /skill-b do XYZ` carga hasta 5 a la vez",
 body:"Desde v2.1.199, podés combinar varias skills en un solo comando: '/skill-a /skill-b do XYZ' las carga todas antes de ejecutar la tarea. Antes solo se activaba la primera. El límite es 5 skills por invocación.",
 why:"Combinás contexto de múltiples skills en una sola instrucción, sin tener que activarlas por separado.",
 more:{detail:"Antes de v2.1.199, cuando escribías '/skill-a /skill-b do XYZ', Claude Code solo cargaba la primera skill e ignoraba las demás. Ahora carga todas las skills iniciales listadas, hasta un máximo de 5. Útil cuando el trabajo combina ámbitos de varias skills: por ejemplo '/code-review /dataviz revisá este componente de gráficos' carga el contexto de revisión de código Y el de diseño de visualizaciones antes de analizar.",
   code:["/code-review /dataviz revisá este componente   # carga 2 skills","# límite: 5 skills por invocación","# se cargan en el orden en que aparecen en el comando"],
   links:[["Changelog v2.1.199","https://code.claude.com/docs/en/changelog"]]}},
{date:"2026-07-01",tag:"claude code",tagc:"clay",fresh:false,
 title:"Claude en Chrome disponible para todos + /dataviz, nueva skill de gráficos",
 body:"Claude en Chrome deja la beta y queda disponible para todos los usuarios de planes pagos (v2.1.198). En la misma versión llegó /dataviz: una skill integrada que da guías de diseño de gráficos y dashboards, con un validador de paleta de colores que podés correr directamente. El agente Explore también mejora: ahora hereda el modelo de la sesión (opus) en lugar de correr en haiku.",
 why:"Claude en Chrome automatiza el navegador real para testing y scraping; /dataviz asegura que los gráficos sean visualmente correctos y accesibles.",
 more:{detail:"Claude en Chrome pasó de preview a disponibilidad general (GA) en v2.1.198. Permite a Claude Code controlar Chromium para automatizar flujos de usuario, tomar capturas de pantalla, testear UI y hacer scraping de páginas que requieren interacción. La skill /dataviz es nueva y se activa antes de crear cualquier gráfico, diagrama o panel: define tipología de gráficos, paleta de colores accesible con validador ejecutable, y reglas de legibilidad en modo claro y oscuro. Escribe una referencia de paleta en 'references/palette.md' que podés personalizar con los colores de tu marca. El agente Explore (el sub-agente de exploración de código) ahora hereda el modelo de la sesión principal limitado a opus, en lugar de ejecutarse siempre en haiku — mejor calidad en exploración de repos grandes.",
   code:["/dataviz    # cargá la skill antes de crear cualquier gráfico o dashboard","# Claude en Chrome se activa cuando pedís tareas en el navegador, ej:","\"andá a la URL X, completá el formulario Y y copiá el resultado\""],
   links:[["Changelog v2.1.198","https://code.claude.com/docs/en/changelog"]]}},
{date:"2026-07-01",tag:"claude code",tagc:"clay",fresh:false,
 title:"v2.1.198: Agentes en background hacen commit, push y PR borrador solos",
 body:"Los subagentes ahora corren en background por defecto (antes era rollout gradual). Los agentes lanzados desde 'claude agents' que terminan trabajo de código en un worktree hacen commit, push y abren un PR borrador automáticamente, sin frenar a preguntar. Además llegaron los hooks 'agent_needs_input' y 'agent_completed' para recibir notificaciones cuando un agente espera tu input o termina.",
 why:"Dejás correr un agente de noche y al volver encontrás el PR borrador listo, sin haber intervenido ni una sola vez.",
 more:{detail:"La v2.1.198 consolida el modo background para subagentes: ya no es rollout gradual, todos los subagentes corren en background por defecto. Los agentes lanzados desde 'claude agents' tienen ahora un ciclo de vida completo: cuando terminan trabajo de código en un worktree, hacen commit, push y abren un PR borrador, en lugar de frenar a esperar confirmación. Para monitorear sin tener la sesión abierta, los nuevos hooks 'agent_needs_input' (el agente espera input tuyo) y 'agent_completed' (el agente terminó) te permiten recibir una notificación en el sistema operativo o en tu herramienta favorita. También se arregló que errores de red breves (ECONNRESET) ya no abortaban el turno — ahora se reintentan con backoff.",
   code:["# hook en .claude/settings.json para notificaciones de escritorio:","\"hooks\": {","  \"Notification\": [{","    \"matcher\": \"\",","    \"hooks\": [{\"type\": \"command\", \"command\": \"notify-send '$CLAUDE_NOTIFICATION_TITLE'\"}]","  }]","}","claude agents   # ver todos los agentes en background"],
   links:[["Changelog v2.1.198","https://code.claude.com/docs/en/changelog"]]}},
{date:"2026-07-01",tag:"modelo",tagc:"berry",fresh:false,title:"Fable 5 vuelve: el gobierno de EE.UU. levantó los controles de exportación",
 body:"El 30 de junio, la administración Trump levantó las restricciones sobre Fable 5 y Mythos 5. A partir del 1° de julio, el modelo más capaz de Anthropic volvió a estar disponible globalmente en Claude.ai, Claude Code y la API. Hasta el 7 de julio, los planes Pro, Max, Team y Enterprise selectos lo incluyen hasta el 50% del límite semanal de uso; después se factura por créditos de uso a precios de API.",
 why:"Si dejaste de usar Fable 5 cuando lo suspendieron, ya podés retomarlo sin drama.",
 more:{detail:"El 12 de junio, tres días después de su lanzamiento, el gobierno de EE.UU. ordenó a Anthropic suspender el acceso a Fable 5 y Mythos 5 para todos los ciudadanos extranjeros, dentro y fuera de los EE.UU., bajo autoridades de seguridad nacional y control de exportaciones. Anthropic trabajó con el gobierno para implementar una salvaguarda que bloquea el jailbreak que preocupaba a las autoridades en el 99% de los casos. Tras eso, el Departamento de Comercio levantó las restricciones. Desde el 1° de julio, Fable 5 está disponible globalmente; hasta el 7 de julio, los planes Pro, Max, Team y Enterprise selectos lo incluyen en hasta el 50% del límite semanal. Después vuelve al esquema de créditos de uso.",
   code:["/model   # elegí Fable 5 para volver a usarlo"],
   links:[["Anuncio de Anthropic","https://www.anthropic.com/news/redeploying-fable-5"],["Cobertura CNBC","https://www.cnbc.com/2026/06/30/anthropic-says-trump-admin-has-lifted-export-controls-on-claude-fable-5-and-mythos-5.html"]]}},
{date:"2026-06-30",tag:"modelo",tagc:"berry",fresh:false,title:"Claude Sonnet 5: rendimiento casi-Opus 4.8 al precio de Sonnet",
 body:"Sonnet 5 es el nuevo modelo mid-tier de Anthropic, pensado para trabajo agéntico. Rinde cerca de Opus 4.8 en código, razonamiento y uso de herramientas, pero cuesta $2 por millón de tokens de entrada y $10 de salida (precio promo hasta el 31 de agosto; después sube a $3/$15). Contexto nativo de 1M tokens. Es ahora el modelo default en Claude Code y en los planes Free y Pro.",
 why:"La mejor relación precio-rendimiento para agentes y builds de webs: rendimiento casi-Opus al precio de Sonnet.",
 more:{detail:"Sonnet 5 es el mayor salto de la línea Sonnet: su rendimiento en benchmarks agénticos se acerca al de Opus 4.8, que hasta ahora era el default recomendado para builders. Mejora a Sonnet 4.6 en reasoning, uso de herramientas, código y knowledge work. Además reduce sycophancy y alucinaciones, y es más resistente a prompt injection, lo que lo hace más seguro en contextos agénticos desatendidos. Ventana de contexto nativa de 1M tokens. Es el nuevo default en Claude Code (v2.1.197) y en los planes Free y Pro. Precio promo de $2/$10 por millón de tokens hasta el 31 de agosto; después pasa a $3/$15.",
   code:["# ID del modelo para la API:","claude-sonnet-5","/model   # cambia a Sonnet 5 en Claude Code"],
   links:[["Anuncio oficial","https://www.anthropic.com/news/claude-sonnet-5"],["TechCrunch","https://techcrunch.com/2026/06/30/anthropic-launches-claude-sonnet-5-as-a-cheaper-way-to-run-agents/"]]}},
{date:"2026-06-29",tag:"claude code",tagc:"clay",fresh:false,title:"v2.1.196: MCP más seguro en workspaces no confiables + modelos de org",
 body:"Claude Code v2.1.196 trajo mejoras de seguridad y productividad. Lo crítico: claude mcp list y claude mcp get ya no levantan servidores MCP definidos en .mcp.json dentro de workspaces no confiables. También llegó soporte para modelo por defecto a nivel de organización (configurable desde la consola), archivos adjuntos clickeables en el chat con Cmd/Ctrl+click, y nombres de sesión legibles generados automáticamente.",
 why:"El fix de MCP en workspaces no confiables cierra un vector de ataque real cuando abrís repos de terceros.",
 more:{detail:"Antes de este fix, ejecutar claude mcp list o claude mcp get en un workspace no confiable podía inicializar servidores MCP definidos en el .mcp.json de ese repo, abriendo un vector de ataque si el repo contenía configuraciones maliciosas. Ahora esos comandos no levantan servidores en workspaces no confiables. Otras mejoras de la versión: soporte para org default models configurado desde la consola de la organización; archivos adjuntos en el chat clickeables con Cmd/Ctrl+click para abrirlos; nombres de sesión legibles por defecto en lugar de IDs crípticos. También se corrigieron bugs en trabajos en background, rate limits, sesiones remotas y mejoras en PowerShell para git diff y git grep.",
   code:["# Para marcar un workspace como confiable: settings.json del proyecto:","{ \"isTrusted\": true }","# Org default model: configurar en console.anthropic.com > Settings"],
   links:[["Changelog oficial","https://code.claude.com/docs/en/changelog"]]}},
{date:"2026-06-24",tag:"claude code",tagc:"clay",fresh:false,title:"/rewind recupera la sesión después de un /clear",
 body:"A partir de la v2.1.191, /rewind puede retroceder al momento justo antes de que usaste /clear y restaurar el contexto borrado. Antes, /clear era definitivo: limpiaba el historial sin vuelta atrás. También en esta versión: las redes que autorizás en el sandbox se recuerdan por toda la sesión sin volver a preguntar, y el uso de CPU durante respuestas en streaming bajó un 37%.",
 why:"Si limpiaste el contexto sin querer en medio de una sesión larga, ahora la recuperás sin arrancar de cero.",
 more:{detail:"/rewind ya existía para deshacer ediciones y retroceder a checkpoints anteriores. La v2.1.191 le agrega una opción nueva: si corriste /clear (que borra el historial pero conserva los archivos en disco), ahora podés usar /rewind para saltar justo antes de ese /clear y restaurar el hilo de la conversación. Muy útil cuando limpiaste el chat para liberar tokens y te arrepentiste, o cuando el agente perdió el hilo después del borrado. Abrís /rewind con el comando o presionando Esc dos veces con el input vacío.",
   code:["/rewind   # abre el menú de rewind","# elegí 'Before /clear' para restaurar el contexto borrado","# shortcut: Esc Esc con el input vacío"],
   links:[["Changelog v2.1.191","https://code.claude.com/docs/en/changelog"]]}},
{date:"2026-06-23",tag:"app",tagc:"gold",fresh:false,title:"Claude Tag: Claude entra como miembro a tus canales de Slack",
 body:"Claude Tag es la nueva integración de Slack: en lugar de un bot privado, Claude se incorpora como miembro del canal y cualquier persona puede mencionarlo con @Claude. Es multiplayer — el mismo Claude interactúa con todo el equipo, todos ven qué está haciendo y cualquiera puede retomar la tarea. Beta disponible hoy para planes Enterprise y Team. El bot viejo de Claude en Slack se retira el 3 de agosto.",
 why:"Si tu equipo ya vive en Slack, es la forma más directa de meter Claude en el flujo de trabajo sin cambiar de herramienta.",
 more:{detail:"Claude Tag reemplaza la integración anterior de Claude en Slack. La diferencia clave es que es multiplayer: un solo @Claude vive en el canal, cualquier miembro puede taguearlo, ver en qué está trabajando y continuar la conversación desde donde la dejó otro. Claude descompone el pedido en pasos, los trabaja en background y entrega el resultado en el canal. Los administradores de workspace tienen 30 días desde el 23 de junio para migrar a Claude Tag antes de que Anthropic retire la integración vieja el 3 de agosto de 2026.",

{date:"2026-06-22",tag:"modelo",tagc:"berry",fresh:false,title:"Fable 5 deja los planes incluidos: desde el 23/6 requiere créditos",
 body:"El período de acceso gratuito a Fable 5 en los planes Pro, Max, Team y Enterprise terminó el 22 de junio. A partir del 23, usarlo descuenta de créditos de uso a precios de API: $10/M tokens de entrada y $50/M de salida, el doble de Opus 4.8. Anthropic planea reincorporarlo a los planes cuando la capacidad lo permita, sin fecha confirmada.",

 more:{detail:"Desde el 9 de junio, Fable 5 estuvo incluido sin cargo adicional en los planes Pro, Max, Team y Enterprise (seat-based). A partir del 23 de junio ese acceso se cierra: usarlo consume créditos de uso facturados a precios de API. En la API, Fable 5 cuesta $10 por millón de tokens de entrada y $50 por millón de tokens de salida, el doble que Opus 4.8. Para la mayoría de tareas de construcción de webs y agentes, Opus 4.8 sigue siendo la mejor relación precio-calidad. Anthropic anunció que volverá a incluirlo en los planes cuando la infraestructura lo permita, sin fecha confirmada.",

{date:"2026-06-19",tag:"claude code",tagc:"clay",fresh:false,title:"Auto mode protege tu repo: bloquea comandos destructivos",
 body:"En auto mode, Claude Code ahora bloquea git reset --hard, git checkout -- ., git clean y terraform/pulumi/cdk destroy a menos que vos lo pidas explícitamente. También bloquea git commit --amend si el commit no lo hizo Claude en esta sesión. Llega además /config --help para listar todas las claves disponibles.",
 why:"Para sesiones desatendidas: tu repo y tu infra están protegidos aunque el agente tenga acceso amplio.",
 more:{detail:"El auto mode reemplaza los prompts de permiso por un clasificador que evalúa cada acción. Ahora ese clasificador también bloquea comandos que destruyen trabajo local o infraestructura sin haberlos pedido: git reset --hard, git checkout -- ., git clean -fd, git stash drop, terraform destroy, pulumi destroy y cdk destroy. git commit --amend queda bloqueado si el commit no lo creó Claude en esta sesión, protegiendo tu historial. Son defaults de seguridad: si los necesitás, simplemente pedíselos al agente y los habilita para ese contexto. Y /config --help ahora lista todas las claves de configuración para no tener que buscar en la doc.",
   code:["/config --help   # lista todas las claves configurables","# en auto mode estos ya no corren sin pedirlo:","git reset --hard   # bloqueado","terraform destroy  # bloqueado"]}},
{date:"2026-06-17",tag:"claude code",tagc:"clay",fresh:false,title:"/config key=value: cambiá settings inline desde la sesión",
 body:"Podés cambiar cualquier setting de Claude Code con /config key=value directamente en la conversación, sin abrir el menú interactivo. Funciona en modo -p y Remote Control también. Además: auto-retry si se corta la API durante una respuesta, y runtime Bun actualizado a 1.4.",
 why:"Controlás la sesión por prompts, clave para scripts y agentes que se autoconfiguran.",
 more:{detail:"La nueva sintaxis /config key=value permite cambiar configuraciones de Claude Code desde la línea de comandos dentro de la sesión sin entrar al menú interactivo. Funciona en modo interactivo, en modo -p (no interactivo) y en Remote Control, así podés parametrizar sesiones scripted o que se autoconfiguran. El auto-retry en desconexiones es también importante: si la API se corta en el medio de una respuesta (incluso durante el thinking), Claude Code reintenta automáticamente sin mostrar error ni perder el progreso. El runtime se actualizó a Bun 1.4 para mejor rendimiento general.",
   code:["/config thinking=false      # desactiva thinking en esta sesión","/config model=claude-sonnet-4-6  # cambia modelo inline","# también en modo no-interactivo:","claude -p 'hacé X' --config thinking=false"]}},

{cat:"Web",tag:"slate",title:"Director de diseño — web que no se confunde",desc:"Para arrancar una web hermosa de cero. Le pedís dirección de arte antes de tocar código.",
text:`Actuá como director de diseño de un estudio conocido por identidades que NO se confunden con ninguna otra. Vamos a diseñar [QUÉ ES] para [PARA QUIÉN]. La acción principal es [QUÉ QUIERO QUE HAGA EL USUARIO].

Cuando elija, recién ahí:
3. Definí el sistema completo: paleta con uso de cada color, escala tipográfica, sistema de espaciado, radios, sombras, y UN "elemento firma" que haga memorable la marca.
4. Construí la web como un solo archivo HTML autocontenido, responsive, con datos realistas (nada de "Item 1"), microinteracciones donde aporten, accesibilidad AA y focus visible.

Al final: resumen de las decisiones de diseño y cómo escalarlas.`},
{cat:"Web",tag:"slate",title:"Landing de alta conversión",desc:"Una landing que vende, con jerarquía clara y un solo CTA dominante.",
text:`Construí una landing page de alta conversión para [PRODUCTO/SERVICIO]. Público: [QUIÉN]. Objetivo único: [QUÉ ACCIÓN].

{cat:"Web",tag:"slate",title:"Mejorar el diseño sin romper la lógica",desc:"Eleva el nivel visual de una app existente sin tocar funcionalidad.",
text:`Subí el nivel visual de esta app SIN cambiar funcionalidad ni lógica. Reglas:

{cat:"WhatsApp",tag:"pine",title:"Agente de WhatsApp — arquitectura completa",desc:"El prompt madre para construir un agente de atención por WhatsApp con la API oficial.",
text:`Vamos a construir un agente de IA para WhatsApp para [NEGOCIO]. Antes de codear, preguntame lo que necesites (qué hace el negocio, qué debe resolver el bot, si agenda turnos, si cobra, horario de atención, cuándo escalar a humano).

- Cerebro: API de Claude (modelo claude-opus-4-8). System prompt con la personalidad y reglas del negocio + tool use para acciones (consultar stock, agendar, derivar a humano).
- Memoria: guardar la conversación por número de teléfono (Postgres/Supabase) para dar contexto.
- Handoff: cuando el cliente lo pide o el bot no puede, marca la conversación para un humano con TODO el contexto.

REGLAS NO NEGOCIABLES:

- Responder rápido al webhook (200) y procesar async.

- Rate limiting y manejo de errores con reintentos.

Primero hacé un PLAN.md con el flujo de un mensaje de punta a punta y esperá mi OK. Después implementás por partes, con tests del webhook.`},
{cat:"WhatsApp",tag:"pine",title:"Personalidad y reglas del bot (system prompt)",desc:"El system prompt que define cómo habla y qué puede hacer tu agente de WhatsApp.",
text:`Generá el system prompt para un agente de WhatsApp de [NEGOCIO]. Tiene que incluir:

IDENTIDAD: nombre del asistente, tono (cercano pero profesional, español rioplatense), y que SIEMPRE aclare que es un asistente virtual si se lo preguntan.

QUÉ SABE: [productos/servicios, precios, horarios, ubicación, formas de pago]. Si no sabe algo, lo dice y ofrece derivar a una persona; nunca inventa.

QUÉ PUEDE HACER (tools): [responder consultas, pasar catálogo, agendar turno, tomar pedido, derivar a humano].

LÍMITES: no promete lo que no puede cumplir, no da información médica/legal/financiera sensible, no comparte datos de otros clientes, no negocia precios fuera de lo permitido.

ESTILO DE WHATSAPP: mensajes cortos, uno o dos por respuesta, sin párrafos enormes. Emojis con moderación. Siempre cierra con una pregunta o un próximo paso claro.

HANDOFF: cuando el cliente pida una persona o haya una queja/cancelación/caso complejo, deriva a un humano resumiendo el caso.

3. Decime qué categoría de plantilla usar y por qué (marketing / utility).
4. Buenas prácticas para no caer en spam: segmentación, frecuencia y cómo manejar las respuestas.

Si algo no se puede hacer sin violar las políticas, decímelo en vez de inventar un atajo.`},

/* DEBUG / DEPLOY / PERFORMANCE / REFACTOR */
{cat:"Debug",tag:"rust",title:"Investigar un bug hasta la causa raíz",desc:"Diagnóstico sistemático: primero la causa, después el fix. Nada de parches a ciegas.",
text:`Hay un bug: [DESCRIBÍ QUÉ PASA Y QUÉ ESPERABAS]. No lo arregles todavía. Seguí este orden:

1. INVESTIGAR: reproducí el problema. Mostrame los pasos exactos y qué observás (logs, error, comportamiento).
2. ANALIZAR: rastreá desde el síntoma hacia atrás. ¿Qué archivos y funciones participan? Mostrame el camino del dato.
3. HIPÓTESIS: decime cuál es la causa raíz más probable y por qué. Si hay dudas, proponé cómo confirmarla.
4. RECIÉN AHÍ, con mi OK, arreglá la causa (no el síntoma): un commit con el fix + un test que lo cubra para que no vuelva.

Regla: no toques nada que no esté relacionado con este bug.`},
{cat:"Deploy",tag:"slate",title:"Deploy a producción guiado + RUNBOOK",desc:"Llevar el proyecto a producción ordenado, paso a paso, con plan de rescate.",
text:`Llevemos esto a producción ordenado. Guiame y verificá cada paso, esperando mi confirmación:

1. PRE-DEPLOY: build limpio, npm audit sin críticas, .env.example completo, ningún secret en el repo ni en el historial de git.
2. BASE DE DATOS: proyecto de producción separado, migraciones aplicadas, RLS verificado tabla por tabla EN PROD, redirect URLs de auth al dominio real.
3. HOSTING: repo conectado (main = prod), variables de entorno por ambiente, headers de seguridad verificados (curl -I).
4. POST-DEPLOY: smoke test de 3 flujos críticos, dominio + HTTPS andando, monitoreo (analytics + errores).
5. RUNBOOK.md: cómo hacer rollback, dónde ver los logs, y a quién avisar si se cae.`},
{cat:"Web",tag:"slate",title:"Optimizar performance (Core Web Vitals)",desc:"Hacer la web rápida de verdad, midiendo antes y después.",
text:`Optimizá la performance de esta web SIN cambiar funcionalidad. Trabajá con datos, no a ojo:

1. MEDÍ primero: LCP, CLS, INP y peso total de la página. Mostrame el estado actual.
2. DIAGNOSTICÁ los 5 mayores problemas (imágenes pesadas, JS de más, fuentes que bloquean el render, falta de lazy-load, etc.).
3. ARREGLÁ de mayor a menor impacto, un cambio por commit: optimizar y lazy-load de imágenes, code-splitting, precargar fuentes, sacar dependencias innecesarias.
4. VOLVÉ a medir y mostrame el antes/después.

No rompas el diseño ni la accesibilidad en el camino.`},
{cat:"Refactor",tag:"gold",title:"Refactor seguro paso a paso",desc:"Mejorar código existente sin cambiar el comportamiento, con red de seguridad.",
text:`Refactoricemos [ÁREA / ARCHIVO]. Reglas:

1. RED PRIMERO: si no hay tests, escribí characterization tests que capturen el comportamiento ACTUAL antes de tocar nada.
2. PLAN: listá los cambios de menor a mayor riesgo. Esperá mi OK.
3. EJECUCIÓN: un cambio atómico por commit. Después de cada uno: typecheck + tests en verde.
4. PROHIBIDO: cambiar comportamiento observable, tocar archivos no relacionados, o renombrar APIs públicas sin avisar.
5. Al final: qué mejoró y qué deuda quedó anotada.`},
